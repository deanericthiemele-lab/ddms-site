<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon classeur — 2nde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F2;
  --page:#FFFFFF;
  --rule:#E2E2DD;
  --rule-2:#C9C9C2;
  --ink:#1A1A18;
  --ink-2:#6E6E68;
  --accent:#2F5EA8;
  --accent-soft:#EDF2FA;
  --alerte:#A93E33;
  --alerte-soft:#F8EDEB;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:grid;grid-template-columns:210px 1fr;min-height:100%}
.rail{background:var(--page);border-right:1px solid var(--rule);padding:22px 12px 30px;
  display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px;text-decoration:none;color:var(--ink);display:block}
.brand b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;letter-spacing:-.03em}
.brand span{font-size:12.5px;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;
  text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .tag{font-size:11.5px;color:var(--ink-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}

.sheet{padding:28px 30px 90px;max-width:820px;width:100%}
.sheet.large{max-width:1040px}
.sheet-head{margin-bottom:22px}
.sheet-head h1{font-size:27px;line-height:1.2}
.sheet-head p{margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
.back{font-size:13.5px;color:var(--ink-2);text-decoration:none;display:inline-block;margin-bottom:8px}
.back:hover{color:var(--ink)}

.mobile-bar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .sheet{padding:16px 14px 80px}
  .mobile-bar{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--page);
    border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
  .mobile-bar a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-size:13.5px;
    padding:6px 11px;border-radius:18px;white-space:nowrap}
  .mobile-bar a.on{background:var(--ink);color:#fff}
}

.card{background:var(--page);border:1px solid var(--rule);border-radius:8px}
.card + .card{margin-top:12px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h h2{font-size:16px}
.sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.card-b{padding:14px 16px}

.bloc{margin-top:26px}
.bloc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:7px;border-bottom:1px solid var(--rule-2);margin-bottom:2px}
.bloc-h h2{font-size:17px}
.bloc-vide{padding:14px 0;color:var(--ink-2);font-size:14px}

.item{padding:13px 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:none}
.item h3{font-size:15px;font-weight:500;font-family:inherit;letter-spacing:0}
.item p{margin:4px 0 0;font-size:14.5px;color:#3C3C38;white-space:pre-wrap}
.item .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.item-row{display:flex;gap:12px;align-items:flex-start}
.item-row .grow{flex:1;min-width:0}

.line{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.line:last-child{border-bottom:none}
.line .grow{flex:1;min-width:0}
.line h3{font-size:15px;font-weight:500;font-family:inherit;letter-spacing:0}
.line p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.clic{cursor:pointer}
.clic:hover{background:#FAFAF8}

.sec{margin-top:22px}
.sec-t{font-size:12.5px;color:var(--ink-2);padding-bottom:6px;border-bottom:1px solid var(--rule-2)}
.chap{display:flex;gap:12px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--rule);
  cursor:pointer;text-decoration:none;color:var(--ink)}
.chap:hover{background:#FAFAF8}
.chap .n{color:var(--ink-2);font-size:13px;flex:0 0 22px}
.chap .t{flex:1;font-size:15.5px}
.chap .s{font-size:12.5px;color:var(--ink-2)}

.btn{border:1px solid var(--rule-2);background:var(--page);border-radius:7px;padding:8px 13px;
  font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lien{border:none;background:none;color:var(--accent);padding:4px 0;font-size:14px}
.btn.lien:hover{background:none;text-decoration:underline}
.btn.discret{border:none;background:none;color:var(--ink-2);padding:4px 6px}
.btn.discret:hover{color:var(--alerte);background:none}
.btn.block{width:100%;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;border:1px solid var(--rule-2);border-radius:7px;padding:9px 11px;font-size:14.5px;background:#FDFDFC}
textarea{min-height:90px;resize:vertical;line-height:1.55}
label.field{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.form{margin:12px 0 4px;padding:14px;background:#FAFAF8;border:1px solid var(--rule);border-radius:8px;
  display:grid;gap:9px}
.form.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.form.two{grid-template-columns:1fr}}

.etat{font-size:12.5px;color:var(--ink-2)}
.etat.alerte{color:var(--alerte)}
.empty{padding:22px 4px;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px;font-size:15px}
.hint{font-size:12.5px;color:var(--ink-2)}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pt.v{background:#2E7D46}.pt.o{background:#C77A2B}.pt.r{background:#A93E33}.pt.g{background:#CFCFC9}
.t-v{color:#2E7D46}.t-o{color:#C77A2B}.t-r{color:#A93E33}
.niveau{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.niveau i{display:block;height:100%;background:var(--accent)}
.niveau i.v{background:#2E7D46}.niveau i.o{background:#C77A2B}.niveau i.r{background:#A93E33}
.etape{border:1px solid var(--rule);border-radius:8px;padding:14px 15px;margin-bottom:10px;background:var(--page)}
.etape.ouvert{border-color:var(--rule-2)}
.etape-h{display:flex;gap:10px;align-items:center;cursor:pointer}
.etape-h h3{flex:1;font-size:15.5px;font-weight:500;font-family:inherit;letter-spacing:0}
.etape-c{margin-top:12px;font-size:15px;line-height:1.6}
.etape-c .ex{margin-top:12px;padding:12px 14px;background:#FAFAF8;border-left:2px solid var(--rule-2);border-radius:4px;font-size:14.5px;white-space:pre-wrap}
.etape-c p{margin:0 0 10px;white-space:pre-wrap}
.reprise{margin-top:12px;padding:12px 14px;border:1px solid var(--rule-2);border-radius:8px;background:#FBFAF6}
.reprise h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink-2);font-family:inherit}
.reprise p{margin:0 0 8px}
.coche{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;border:1px solid var(--rule-2);
  border-radius:16px;padding:5px 11px;cursor:pointer;background:var(--page)}
.coche input{margin:0}

.quiz{max-width:600px;margin:0 auto}
.q-text{font-size:20px;line-height:1.35;margin:10px 0 18px;font-family:"Bricolage Grotesque",sans-serif}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;border:1px solid var(--rule-2);
  border-radius:8px;background:var(--page);cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.bonne{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.fausse{border-color:var(--alerte);background:var(--alerte-soft);color:var(--alerte)}
.opt.mute{opacity:.5}
.verdict{padding:12px 14px;border-radius:8px;font-size:14.5px;margin:2px 0 14px;background:var(--bg)}
.verdict b{display:block;margin-bottom:3px}
.verdict.faux{background:var(--alerte-soft);color:var(--alerte)}
.jauge{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:20px}
.jauge i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:46px;font-weight:700;letter-spacing:-.04em}

.drop{border:1.5px dashed var(--rule-2);border-radius:9px;padding:26px 16px;text-align:center;cursor:pointer;
  background:#FAFAF8;display:flex;flex-direction:column;gap:3px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px}
.drop span{font-size:13px;color:var(--ink-2)}
.trois{display:grid;grid-template-columns:1fr 1.2fr .8fr;gap:8px}
@media (max-width:640px){.trois{grid-template-columns:1fr}}

.modal-bg{position:fixed;inset:0;background:rgba(26,26,24,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60}
@media(min-width:641px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--page);border-radius:12px 12px 0 0;width:100%;max-width:500px;max-height:88vh;
  overflow-y:auto;padding:18px}
@media(min-width:641px){.modal{border-radius:12px}}
.modal h2{font-size:17px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:22px;font-size:13.5px;z-index:80;max-width:90%;text-align:center}
table.tt{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
table.tt th{font-size:12.5px;color:var(--ink-2);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.tt td{border-bottom:1px solid var(--rule);padding:0;vertical-align:top;width:16.6%}
.slot{display:block;width:100%;text-align:left;border:none;background:none;padding:8px;cursor:pointer;font-size:13px}
.slot:hover{background:#FAFAF8}
.slot span{display:block;color:var(--ink-2);font-size:11.5px}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <a class="brand" href="#/"><b>Mon classeur</b><span id="brandSub">2nde</span></a>
    <nav class="nav" id="navMat"></nav>
    <a class="nav" href="#/pronote" style="display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14.5px">
      <span>PRONOTE</span><span class="tag" id="pronoteCount">0</span>
    </a>
    <div class="rail-foot">
      <button class="btn sm" data-act="export">Sauvegarder</button>
      <button class="btn sm" data-act="import">Restaurer</button>
    </div>
  </aside>
  <div>
    <nav class="mobile-bar" id="navMobile"></nav>
    <main class="sheet" id="app"></main>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
/* ===================== stockage ===================== */
const KEY = 'classeur2nde_v1';
let MEM = null;
const disk = {
  read(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return MEM; } },
  write(o){ MEM = o; try{ localStorage.setItem(KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
};
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }

function neuf(){
  const noms = [['Mathématiques','ma'],['Français','fr'],['Physique-Chimie','pc'],['SVT','sv'],
    ['Histoire-Géographie','hg'],['Anglais','an'],['Espagnol','es']];
  return {v:2, eleve:{prenom:'', classe:'2nde'},
    matieres:noms.map(n => ({id:uid(), nom:n[0], k:n[1], prof:''})),
    sections:[], chapitres:[], seances:[], taches:[], notes:[]};
}
function migrer(o){
  if(!o || !o.matieres) return neuf();
  o.sections = o.sections || [];
  (o.chapitres || []).forEach(c => {
    c.lecon = c.lecon || c.cours || [];
    c.exemples = c.exemples || [];
    c.exos = c.exos || [];
    c.quiz = c.quiz || [];
    if(!c.notes) c.notes = (c.expl || []).map(e => ({id:e.id || uid(), texte:(e.titre ? e.titre + ' — ' : '') + (e.texte || '')}));
    if(!c.notes.length && (c.notions || []).length) c.notes = c.notions.map(n => ({id:uid(), texte:n.t}));
    delete c.cours; delete c.expl; delete c.notions;
    c.sid = c.sid || '';
    if(typeof c.ord !== 'number') c.ord = 0;
  });
  o.v = 2;
  return o;
}
let S = migrer(disk.read());
S.pronote = S.pronote || pronoteNeuf();
function save(){
  S.maj = Date.now();
  if(!disk.write(S)) toast('Mémoire saturée : fais une sauvegarde puis allège les fichiers.');
  if(typeof CLOUD !== 'undefined') CLOUD.envoyer();
}

/* ===================== utilitaires ===================== */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(m){ const h = $('toastHost'); h.innerHTML = '<div class="toast">' + esc(m) + '</div>';
  setTimeout(() => { h.innerHTML = ''; }, 2800); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ const p = String(d || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (d || ''); }
function joursRestants(d){ if(!d) return null;
  return Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function poids(n){ return n > 999999 ? (n/1048576).toFixed(1) + ' Mo' : Math.max(1, Math.round(n/1024)) + ' Ko'; }
function capital(s){ s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function mat(id){ return S.matieres.find(m => m.id === id) || {nom:'Matière', id:''}; }
function chap(id){ return S.chapitres.find(c => c.id === id); }
function sectionsDe(mid){ return S.sections.filter(s => s.mid === mid).sort((a,b) => a.ord - b.ord); }
function chapsDeSection(sid){ return S.chapitres.filter(c => c.sid === sid).sort((a,b) => a.ord - b.ord); }
function chapsDe(mid){
  const out = [];
  sectionsDe(mid).forEach(s => chapsDeSection(s.id).forEach(c => out.push(c)));
  S.chapitres.filter(c => c.mid === mid && !S.sections.some(s => s.id === c.sid)).forEach(c => out.push(c));
  return out;
}
function numero(c){ const l = chapsDe(c.mid); return l.findIndex(x => x.id === c.id) + 1; }
function sectionDe(c){ return S.sections.find(s => s.id === c.sid); }
function newChap(mid, sid, titre, ord){
  return {id:uid(), mid, sid, titre, ord, statut:'', lecon:[], exemples:[], exos:[], quiz:[], notes:[]};
}

/* ===================== fichiers ===================== */
const FS = {
  db:null,
  open(){ return new Promise((res, rej) => {
    if(FS.db) return res(FS.db);
    if(!window.indexedDB) return rej('no');
    let r; try{ r = indexedDB.open('classeur2nde_files', 1); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => { FS.db = r.result; res(FS.db); };
    r.onerror = () => rej(r.error);
  }); },
  async put(id, b){ const db = await FS.open(); return new Promise((res, rej) => {
    const t = db.transaction('f','readwrite'); t.objectStore('f').put(b, id);
    t.oncomplete = () => res(1); t.onerror = () => rej(t.error); }); },
  async get(id){ const db = await FS.open(); return new Promise((res, rej) => {
    const t = db.transaction('f','readonly'), q = t.objectStore('f').get(id);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};
function toDataURL(f){ return new Promise(r => { const x = new FileReader(); x.onload = () => r(x.result); x.readAsDataURL(f); }); }
async function storeFile(f){
  if(!f) return null;
  const meta = {id:uid(), name:f.name, type:f.type, size:f.size};
  try{ meta.cloud = await CLOUD.envoiFichier(meta.id, f); }catch(e){}
  try{ await FS.put(meta.id, f); }
  catch(e){
    if(meta.cloud) return meta;
    if(f.size > 1400000){ toast('« ' + f.name + ' » est trop lourd pour ce navigateur.'); return null; }
    meta.data = await toDataURL(f);
  }
  return meta;
}
async function readFile(input){ const f = input && input.files && input.files[0]; return f ? storeFile(f) : null; }
async function ouvrir(meta){
  if(!meta) return;
  let href = meta.data;
  if(!href){
    try{ const b = await FS.get(meta.id); if(b) href = URL.createObjectURL(b); }catch(e){}
  }
  if(!href && meta.cloud){
    try{ href = await CLOUD.lien(meta.cloud); }catch(e){}
  }
  if(!href){ toast('Fichier introuvable. Connecte-toi pour le récupérer.'); return; }
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  const t = meta.type || '';
  if(!(t.startsWith('image/') || t === 'application/pdf' || t.startsWith('text/'))) a.download = meta.name;
  document.body.appendChild(a); a.click(); a.remove();
  if(href.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(href), 20000);
}

/* ---- lecture du contenu ---- */
let PDFLIB = null, PDFKO = false;
async function loadPdfjs(){
  if(PDFLIB) return PDFLIB;
  if(PDFKO) throw 'ko';
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = base + 'pdf.min.js'; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc); setTimeout(rej, 9000);
  }).catch(() => { PDFKO = true; throw 'ko'; });
  const lib = window.pdfjsLib;
  if(!lib){ PDFKO = true; throw 'ko'; }
  try{ const w = await fetch(base + 'pdf.worker.min.js').then(r => r.text());
    lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], {type:'text/javascript'})); }catch(e){}
  PDFLIB = lib; return lib;
}
async function extraireTexte(f){
  const n = norm(f.name), t = f.type || '';
  try{
    if(t.startsWith('text/') || /\.(txt|md|csv|rtf)$/.test(n)) return (await f.text()).slice(0, 8000);
    if(t === 'application/pdf' || /\.pdf$/.test(n)){
      const lib = await loadPdfjs();
      const doc = await lib.getDocument({data:await f.arrayBuffer(), isEvalSupported:false}).promise;
      let out = '';
      for(let i = 1; i <= Math.min(4, doc.numPages); i++){
        const c = await (await doc.getPage(i)).getTextContent();
        out += c.items.map(x => x.str).join(' ') + ' ';
        if(out.length > 8000) break;
      }
      return out.slice(0, 8000);
    }
  }catch(e){}
  return '';
}

/* ===================== programme ===================== */
function nettoieTitre(t){
  return capital(String(t || '').replace(/^[\s:\-–—•*.\d)]+/,'').replace(/\s+/g,' ').trim());
}
function parseProgramme(txt){
  const out = [];
  let cur = null;
  const pushChap = t => {
    t = nettoieTitre(t);
    if(!t || t.length < 2) return;
    if(!cur){ cur = {titre:'Programme', chapitres:[]}; out.push(cur); }
    cur.chapitres.push(t);
  };
  String(txt || '').split(/\r?\n/).forEach(raw => {
    let l = raw.trim().replace(/^[•\-*\u2022\u25AA]\s*/,'');
    if(!l) return;
    let m;
    if((m = l.match(/^(section|partie|th[eè]me|module|unit[eé]|bloc|domaine)\b[\s:.\-–—]*[\dIVX]*[\s:.\-–—]*(.*)$/i))){
      cur = {titre:nettoieTitre(m[2] || l) || 'Section ' + (out.length + 1), chapitres:[]};
      out.push(cur); return;
    }
    if((m = l.match(/^(chapitre|chap\.?|le[çc]on)\b\s*n?°?\s*[\dIVX]*[\s:.\-–—]*(.*)$/i))){ pushChap(m[2] || l); return; }
    if(l.length < 80 && l === l.toUpperCase() && /[A-ZÀ-Ý]{3}/.test(l)){
      cur = {titre:nettoieTitre(l), chapitres:[]}; out.push(cur); return;
    }
    if((m = l.match(/^\d{1,2}\s*[.)\-–]\s*(.+)$/))){ pushChap(m[1]); return; }
    pushChap(l);
  });
  return out.filter(s => s.chapitres.length);
}
function appliquerProgramme(mid, parsed){
  const anciens = S.chapitres.filter(c => c.mid === mid);
  const pris = {};
  S.sections = S.sections.filter(s => s.mid !== mid);
  parsed.forEach((sec, i) => {
    const sid = uid();
    S.sections.push({id:sid, mid, titre:sec.titre, ord:i});
    sec.chapitres.forEach((t, j) => {
      const ex = anciens.find(c => !pris[c.id] && norm(c.titre) === norm(t));
      if(ex){ pris[ex.id] = 1; ex.sid = sid; ex.ord = j; ex.titre = t; }
      else S.chapitres.push(newChap(mid, sid, t, j));
    });
  });
  const restes = anciens.filter(c => !pris[c.id] &&
    ((c.lecon || []).length + (c.exemples || []).length + (c.exos || []).length + (c.quiz || []).length + (c.notes || []).length));
  const vides = anciens.filter(c => !pris[c.id] && restes.indexOf(c) < 0);
  S.chapitres = S.chapitres.filter(c => vides.indexOf(c) < 0);
  if(restes.length){
    const sid = uid();
    S.sections.push({id:sid, mid, titre:'Hors programme', ord:99});
    restes.forEach((c, j) => { c.sid = sid; c.ord = j; });
  }
  save();
}

const ALIAS = {
  ma:['math','maths','mathematique','algebre','geometrie','calcul','fonction','equation','inequation','probabilite','statistique','vecteur','python','algorithme','theoreme','pourcentage'],
  fr:['francais','litterature','roman','theatre','poesie','commentaire','dissertation','grammaire','orthographe','conjugaison','narrateur','strophe','argumentation'],
  pc:['physique','chimie','optique','energie','mecanique','onde','atome','molecule','mole','solution','concentration','electricite','vitesse','force','reaction'],
  sv:['svt','biologie','geologie','cellule','adn','gene','genetique','ecosysteme','climat','organisme','microbe','enzyme','respiration','photosynthese'],
  hg:['histoire','geo','geographie','revolution','antiquite','mondialisation','territoire','empire','republique','population','urbanisation','colonisation'],
  an:['anglais','english','simple past','present perfect'],
  es:['espagnol','espanol','subjuntivo','preterito']
};
const STOP = ['cours','chapitre','chap','exercice','exercices','exos','fiche','devoir','corrige','correction','seconde','2nde','classe','scan','photo','document','final','version','lecon'];
function compte(t, m){ let n = 0, i = 0; if(!m || m.length < 4) return 0;
  while((i = t.indexOf(m, i)) >= 0){ n++; i += m.length; } return n; }
function racine(w){ return String(w || '').replace(/(aux|eaux|es|s|x)$/,''); }
function titrePropre(nom, mid, contenu){
  const m = mid ? S.matieres.find(x => x.id === mid) : null;
  const bruit = STOP.concat(m ? (ALIAS[m.k] || []).concat(norm(m.nom).split(/[^a-z0-9]+/)) : []);
  let mots = capital(String(nom).replace(/\.[a-z0-9]{1,5}$/i,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim()).split(' ');
  let n = 0;
  while(mots.length > 1 && n < 2 && bruit.indexOf(norm(mots[0])) >= 0){ mots.shift(); n++; }
  while(mots.length > 1 && /^\d{1,2}$/.test(mots[0])) mots.shift();
  let t = mots.join(' ').trim();
  if(t.length < 4){
    const l = String(contenu || '').split(/[\n\r.]+/).map(x => x.trim()).filter(x => x.length > 6 && x.length < 70);
    if(l.length) t = l[0];
  }
  return capital(t) || 'Document';
}
function devine(nom, contenu, midForce){
  const s = norm(nom), txt = norm(contenu || '');
  let rub = 'lecon';
  if(/(exo|exercice|td\b|tp\b|dm\b|ds\b|devoir|entrainement|controle|interro|evaluation|corrige|annale)/.test(s)) rub = 'exos';
  if(/(edt|emploi.?du.?temps|planning|horaire)/.test(s)) rub = 'edt';
  if(txt){
    if(/(exercice\s*n?\s*\d|exercices\b|corrig|devoir surveill|controle\b|interrogation|application\s*\d)/.test(txt)) rub = 'exos';
    if(/(emploi du temps)/.test(txt) || (/lundi/.test(txt) && /mardi/.test(txt) && /jeudi/.test(txt))) rub = 'edt';
  }
  let mid = midForce || '', best = 0;
  if(!midForce) S.matieres.forEach(m => {
    let sc = 0;
    norm(m.nom).split(/[^a-z0-9]+/).filter(w => w.length > 3).forEach(w => {
      if(s.includes(w)) sc += 4;
      if(txt) sc += Math.min(6, compte(txt, w) * 2);
    });
    (ALIAS[m.k] || []).forEach(w => {
      if(s.includes(racine(w))) sc += w.length > 4 ? 4 : 2;
      if(txt) sc += Math.min(6, compte(txt, racine(w)) * 2);
    });
    if(txt) chapsDe(m.id).forEach(c => norm(c.titre).split(/[^a-z0-9]+/).filter(w => w.length > 4 && STOP.indexOf(w) < 0)
      .forEach(w => { sc += Math.min(4, compte(txt, racine(w))); }));
    if(sc > best){ best = sc; mid = m.id; }
  });
  if(!midForce && best < 2) mid = '';
  let cid = '';
  if(mid){
    const cs = chapsDe(mid);
    const num = s.match(/chap(?:itre)?\s*_?-?\s*(\d{1,2})/) || s.match(/^(\d{1,2})[\s_.-]/) ||
      (txt ? txt.slice(0,600).match(/chapitre\s*(\d{1,2})/) : null);
    if(num && cs[+num[1] - 1]) cid = cs[+num[1] - 1].id;
    if(!cid){
      const mots = s.split(/[^a-z0-9]+/).filter(w => w.length > 3 && STOP.indexOf(w) < 0);
      const debut = txt.slice(0, 1500);
      let bc = 0, second = 0;
      cs.forEach(c => {
        const t = norm(c.titre), clefs = t.split(/[^a-z0-9]+/).filter(w => w.length > 3);
        let sc = 0;
        mots.forEach(w => { if(t.includes(racine(w))) sc += 3; });
        clefs.forEach(w => { sc += Math.min(6, compte(debut, racine(w)) * 2) + Math.min(4, compte(txt, racine(w))); });
        (c.notes || []).forEach(n => norm(n.texte).split(/[^a-z0-9]+/).filter(w => w.length > 5)
          .forEach(w => { if(txt.includes(w)) sc += 1; }));
        if(sc > bc){ second = bc; bc = sc; cid = c.id; }
        else if(sc > second) second = sc;
      });
      if(bc < 4 || bc - second < 2) cid = '';
    }
  }
  if(rub === 'edt') rub = 'lecon';
  return {mid, cid, rub, titre:titrePropre(nom, mid, contenu)};
}

function faiblesses(){
  const out = [];
  S.chapitres.forEach(c => {
    const s2 = mat(c.mid).nom + ' · ' + c.titre;
    toutesQuestions(c).forEach(x => {
      const q = x.q;
      if(q.last === 'ko' || (q.ko || 0) > (q.ok || 0))
        out.push({p:(q.last === 'ko' ? 3 : 2) + (q.ko || 0), mid:c.mid, cid:c.id,
          titre:q.q, sous:s2 + (x.bloc ? ' · ' + x.bloc.titre : ''), note:(q.ko || 0) + ' erreur' + ((q.ko || 0) > 1 ? 's' : '')});
    });

      out.push({p:3, mid:c.mid, cid:c.id, titre:e.enonce, sous:s2, note:'bloqué'}); });
  });
  return out.sort((a,b) => b.p - a.p);
}
function statsQuiz(mid){
  let ok = 0, ko = 0;
  S.chapitres.filter(c => !mid || c.mid === mid).forEach(c => toutesQuestions(c).forEach(x => { ok += x.q.ok || 0; ko += x.q.ko || 0; }));
  return {ok, ko, total:ok + ko, pct:(ok + ko) ? Math.round(ok * 100 / (ok + ko)) : null};
}
function moyenne(mid){
  const l = S.notes.filter(n => !mid || n.mid === mid);
  if(!l.length) return null;
  let s = 0, c = 0;
  l.forEach(n => { const co = Number(n.coef) || 1; s += (Number(n.note) / Number(n.sur) * 20) * co; c += co; });
  return Math.round(s / c * 100) / 100;
}

/* ===================== niveau de compréhension ===================== */
function toutesQuestions(c){
  const out = [];
  (c.prereqs || []).forEach(p => (p.questions || []).forEach(q => out.push({q, bloc:p, type:'prereq'})));
  (c.etapes || []).forEach(p => (p.questions || []).forEach(q => out.push({q, bloc:p, type:'etape'})));
  (c.quiz || []).forEach(q => out.push({q, bloc:null, type:'quiz'}));
  return out;
}
function findQ(cid, qid){
  const c = chap(cid);
  if(!c) return null;
  const f = toutesQuestions(c).find(x => x.q.id === qid);
  return f ? f.q : null;
}
function etatBloc(b){
  const qs = b.questions || [];
  if(!qs.length) return 'g';
  const rep = qs.filter(q => q.last);
  if(!rep.length) return 'g';
  if(qs.some(q => q.last === 'ko')) return 'r';
  return rep.length === qs.length ? 'v' : 'o';
}
function niveau(c){
  const qs = toutesQuestions(c);
  if(!qs.length) return {pct:null, coul:'g', txt:'pas encore de parcours'};
  const rep = qs.filter(x => x.q.last);
  if(!rep.length) return {pct:null, coul:'g', txt:'pas commencé'};
  const ok = qs.filter(x => x.q.last === 'ok').length;
  const pct = Math.round(ok * 100 / qs.length);
  const coul = pct >= 80 ? 'v' : pct >= 50 ? 'o' : 'r';
  return {pct, coul, txt:pct >= 80 ? 'maîtrisé' : pct >= 50 ? 'en cours' : 'à retravailler'};
}
function lacunes(c){
  const out = [];
  (c.prereqs || []).forEach(p => { if(etatBloc(p) === 'r') out.push({type:'Prérequis', b:p}); });
  (c.etapes || []).forEach(p => { if(etatBloc(p) === 'r') out.push({type:'Étape', b:p}); });
  return out;
}
function maitrise(c){
  const out = [];
  (c.prereqs || []).concat(c.etapes || []).forEach(p => { if(etatBloc(p) === 'v') out.push(p); });
  return out;
}

/* ===================== synchronisation Firebase ===================== */
const SDKB = 'https://www.gstatic.com/firebasejs/10.12.2/';
function chargerScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => rej(new Error('réseau'));
    document.head.appendChild(el);
  });
}
const CLOUD = {
  db:null, st:null, uid:null, unsub:null, tmr:null, etat:'local', err:'',
  async sdk(){
    if(window.firebase && window.firebase.firestore) return;
    await chargerScript(SDKB + 'firebase-app-compat.js');
    await chargerScript(SDKB + 'firebase-auth-compat.js');
    await chargerScript(SDKB + 'firebase-firestore-compat.js');
    await chargerScript(SDKB + 'firebase-storage-compat.js');
  },
  async init(){
    const cfg = S.fb;
    if(!cfg || !cfg.apiKey){ this.etat = 'local'; return; }
    try{
      await this.sdk();
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      this.st = firebase.storage();
      this.etat = 'connexion'; render();
      try{ await firebase.auth().signInAnonymously(); }catch(e){}
      this.uid = (cfg.code || 'classeur').trim().replace(/[^a-zA-Z0-9_-]/g,'-');
      this.etat = 'sync';
      this.ecoute();
      render();
    }catch(e){ this.etat = 'erreur'; this.err = e.message; render(); }
  },
  ref(){ return this.db.collection('classeurs').doc(this.uid); },
  chemin(id){ return 'classeurs/' + this.uid + '/' + id; },
  ecoute(){
    if(this.unsub) this.unsub();
    this.unsub = this.ref().onSnapshot(d => {
      if(!d.exists){ this.envoyer(true); return; }
      const r = d.data() || {};
      if((r.maj || 0) > (S.maj || 0) + 500){
        try{
          const o = JSON.parse(r.json);
          o.fb = S.fb;
          S = migrer(o); S.maj = r.maj;
          disk.write(S); render();
        }catch(e){}
      }
    }, e => { this.etat = 'erreur'; this.err = e.message; render(); });
  },
  envoyer(direct){
    if(!this.uid || !this.db) return;
    clearTimeout(this.tmr);
    const envoi = () => {
      const o = Object.assign({}, S); delete o.fb;
      this.ref().set({json:JSON.stringify(o), maj:S.maj || Date.now()})
        .catch(e => { this.etat = 'erreur'; this.err = e.message; });
    };
    if(direct) envoi(); else this.tmr = setTimeout(envoi, 1500);
  },
  async envoiFichier(id, f){
    if(!this.uid || !this.st) return null;
    const r = this.st.ref(this.chemin(id));
    await r.put(f);
    return r.fullPath;
  },
  async lien(path){ return this.st.ref(path).getDownloadURL(); }
};
function etatSync(){
  return {local:'sur cet appareil', connexion:'connexion…', hors:'non connecté',
    sync:'synchronisé', erreur:'erreur : ' + CLOUD.err}[CLOUD.etat] || '';
}

const CAUSES = ['Méthode / rédaction','Cours mal su','Calcul, étourderie','Temps manqué','Consigne mal comprise'];
function profil(){
  return (S.eleve.profil || '').trim() ||
    'Il comprend les notions mais manque de méthode : rédaction incomplète, étapes non justifiées, résultats donnés sans raisonnement écrit. C\'est ce que disent tous ses professeurs.';
}
function lacunesMat(mid, max){
  const out = [];
  S.chapitres.filter(c => c.mid === mid).forEach(c => {
    (c.prereqs || []).concat(c.etapes || []).forEach(b => { if(etatBloc(b) === 'r') out.push(b.titre + ' (' + c.titre + ')'); });
  });
  return out.slice(0, max || 8);
}
function causesFreq(mid){
  const n = {};
  S.notes.filter(x => x.mid === mid).forEach(x => (x.causes || []).forEach(c => { n[c] = (n[c] || 0) + 1; }));
  return Object.keys(n).sort((a,b) => n[b] - n[a]);
}
function diagnostic(mid){
  return chapsDe(mid).map(c => {
    const nv = niveau(c), lac = lacunes(c);
    const prereqKo = (c.prereqs || []).filter(p => etatBloc(p) === 'r');
    const exosKo = (c.exos || []).filter(x => x.statut === 'bloque');
    const notesKo = S.notes.filter(x => x.cid === c.id && Number(x.note) / Number(x.sur) < 0.5);
    let score = prereqKo.length * 4 + lac.length * 3 + exosKo.length * 2 + notesKo.length * 4;
    if(nv.coul === 'r' && nv.pct !== null) score += 3; else if(nv.coul === 'o') score += 1;
    return {c, nv, lac, prereqKo, exosKo, notesKo, score};
  }).filter(d => d.score > 0).sort((a,b) => b.score - a.score);
}

async function appelClaude(prompt){
  const key = (S.cle || '').trim();

    method:'POST',
    headers:{'content-type':'application/json', 'x-api-key':key,
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6', max_tokens:6000, messages:[{role:'user', content:prompt}]})
  });
  if(!r.ok) throw new Error(r.status === 401 ? 'cle-invalide' : 'erreur ' + r.status);
  const data = await r.json();
  const txt = (data.content || []).filter(x => x.type === 'text').map(x => x.text).join('');
  const net = txt.replace(/```json|```/g,'').trim();
  return JSON.parse(net.slice(net.indexOf('{'), net.lastIndexOf('}') + 1));
}

function promptReprise(c){
  const m = mat(c.mid);

    'Élève : ' + profil() + '\n' +
    'Il a échoué sur :\n' + rates.join('\n') + '\n\n' +
    'Reprends ces points AUTREMENT, pour qu\'il comprenne et retienne.\n' +
    'Produis UNIQUEMENT un JSON valide :\n' +
    '{"reprises":[{"titre":"titre exact du point","autrement":"","exemple":"","memo":"","redaction":""}]}\n' +
    'Règles :\n- "autrement" : une explication différente de la première, très concrète, qui part de ce qu\'il a raté.\n' +
    '- "exemple" : un exemple simple entièrement résolu et rédigé.\n' +
    '- "memo" : un moyen de mémoriser (image, phrase, règle courte).\n' +
    '- "redaction" : comment rédiger ce type de réponse dans un devoir, en 2 ou 3 phrases-types.\n' +
    '- Reprends exactement les titres donnés.';
}
async function genererReprise(cid){
  const c = chap(cid);

  try{

      const b = (c.prereqs || []).concat(c.etapes || []).find(x => norm(x.titre) === norm(r.titre)) ||
        (c.prereqs || []).concat(c.etapes || []).filter(x => etatBloc(x) === 'r')[0];
      if(b) b.reprise = {autrement:r.autrement, exemple:r.exemple, memo:r.memo, redaction:r.redaction};
    });

  }catch(e){ UI.gen = null; render(); toast(e.message === 'sans-cle' ? 'Ajoute ta clé Claude dans Réglages.' : 'Impossible : ' + e.message); }

async function genererMatiere(mid){
  const l = chapsDe(mid).filter(c => !(c.etapes || []).length);
  if(!l.length){ toast('Tous les chapitres ont déjà leur parcours.'); return; }
  for(const c of l){

}


/* ===================== PRONOTE : collecte structurée ===================== */
function pronoteNeuf(){
  return {
    v:1, source:'PRONOTE',
    profil:{},
    etablissement:{},
    emploiDuTemps:[],
    devoirs:[],
    notes:[],
    moyennes:[],
    competences:[],
    matieres:[],
    enseignants:[],
    absences:[],
    retards:[],
    sanctions:[],
    messages:[],
    ressources:[],
    bulletins:[],
    conseilsDeClasse:[],
    evenements:[],
    pages:{},
    pont:{url:'http://127.0.0.1:8765', jeton:'', dernier:'', erreurs:[], compte:''},
    brut:[],
    imports:[]
  };
}
function assurerPronote(){
  S.pronote = S.pronote || pronoteNeuf();
  const d = pronoteNeuf();
  Object.keys(d).forEach(k => {
    if(k === 'v') return;
    if(S.pronote[k] == null) S.pronote[k] = d[k];
  });
  return S.pronote;
}
function pnCount(){
  const p = assurerPronote();
  return Object.keys(p).filter(k => Array.isArray(p[k])).reduce((n,k) => n + p[k].length, 0);
}
function pnText(v){
  if(v == null) return '';
  if(typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch(e){ return String(v); }
}
function pnFlatten(obj, path='', out=[]){
  if(obj == null) return out;
  if(typeof obj !== 'object'){ out.push({path, value:String(obj)}); return out; }
  if(Array.isArray(obj)){
    obj.forEach((v,i) => pnFlatten(v, path ? path+'['+i+']' : '['+i+']', out));
    return out;
  }
  Object.keys(obj).forEach(k => pnFlatten(obj[k], path ? path+'.'+k : k, out));
  return out;
}
function pnFindFirst(obj, keys){
  const wanted = keys.map(x => norm(x));
  const flat = pnFlatten(obj);
  for(const x of flat){
    const last = norm(x.path.split('.').pop().replace(/\[\d+\]$/,''));
    if(wanted.some(k => last === k || last.includes(k))) return x.value;
  }
  return '';
}
function pnDetect(obj, hint=''){
  const s = norm(hint + ' ' + pnText(obj).slice(0,12000));
  if(/bulletin|trimestre|appreciation|moyenne generale/.test(s)) return 'bulletins';
  if(/competence|acquis|maitrise|niveau de maitrise/.test(s)) return 'competences';
  if(/absence|absente|retard|retards/.test(s)) return /retard/.test(s) ? 'retards' : 'absences';
  if(/sanction|punition|retenue|exclusion/.test(s)) return 'sanctions';
  if(/message|messagerie|destinataire|expediteur/.test(s)) return 'messages';
  if(/ressource|document|piece jointe|fichier/.test(s)) return 'ressources';
  if(/devoir|travail a faire|travail\.?faire|a faire/.test(s)) return 'devoirs';
  if(/emploi du temps|horaire|seance|cours|professeur|enseignant|salle/.test(s)) return 'emploiDuTemps';
  if(/note|evaluation|coefficient|sur ?20|moyenne/.test(s)) return 'notes';
  if(/eleve|prenom|nom|classe|identite/.test(s)) return 'profil';
  return 'pages';
}
function pnToRows(obj){
  if(Array.isArray(obj)) return obj;
  if(!obj || typeof obj !== 'object') return [{valeur:obj}];
  const keys = Object.keys(obj);
  const arrays = keys.filter(k => Array.isArray(obj[k]));
  if(arrays.length){
    const biggest = arrays.sort((a,b)=>obj[b].length-obj[a].length)[0];
    if(obj[biggest].length) return obj[biggest];
  }
  return [obj];
}
function pnMergeCategory(cat, data, meta){
  const p = assurerPronote();
  if(cat === 'profil' || cat === 'etablissement'){
    p[cat] = Object.assign({}, p[cat] || {}, data && typeof data === 'object' && !Array.isArray(data) ? data : {valeur:data});
    return;
  }
  const rows = pnToRows(data);
  rows.forEach(row => p[cat].push({
    id:uid(), importId:meta.id, dateCollecte:meta.date,
    donnees:row
  }));
}
function pnImporter(obj, source, endpoint){
  const p = assurerPronote();
  const meta = {id:uid(), date:new Date().toISOString(), source:source || 'JSON', endpoint:endpoint || ''};
  const cat = pnDetect(obj, endpoint || source || '');
  pnMergeCategory(cat, obj, meta);
  p.brut.push({id:meta.id, date:meta.date, source:meta.source, endpoint:meta.endpoint, categorie:cat, donnees:obj});
  p.imports.push(meta);
  save(); render();
  return cat;
}

/* ---- récupération en ligne (pont local pronotepy) ---- */
const PN_CATS = ['emploiDuTemps','devoirs','notes','moyennes','competences','matieres','enseignants',
  'absences','retards','sanctions','messages','ressources','bulletins','conseilsDeClasse','evenements'];

function pnPont(){
  const p = assurerPronote();
  if(!p.pont || typeof p.pont !== 'object') p.pont = {url:'http://127.0.0.1:8765', jeton:'', dernier:'', erreurs:[], compte:''};
  return p.pont;
}
function pnUrlPont(chemin){
  const pont = pnPont();
  const base = (pont.url || 'http://127.0.0.1:8765').trim().replace(/\/+$/,'');
  return base + chemin + (pont.jeton ? '?jeton=' + encodeURIComponent(pont.jeton) : '');
}
async function pnAppelPont(chemin){
  const r = await fetch(pnUrlPont(chemin), {method:'GET', mode:'cors', cache:'no-store'});
  if(r.status === 401) throw new Error('jeton refusé par le pont');
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}
function pnAppliquerPaquet(paquet, source){
  const p = assurerPronote();
  const meta = {id:uid(), date:new Date().toISOString(), source:source || 'pont', endpoint:'/api/tout'};
  let n = 0;
  if(paquet.profil && typeof paquet.profil === 'object' && !Array.isArray(paquet.profil))
    p.profil = Object.assign({}, p.profil, paquet.profil);
  if(paquet.etablissement && typeof paquet.etablissement === 'object' && !Array.isArray(paquet.etablissement))
    p.etablissement = Object.assign({}, p.etablissement, paquet.etablissement);
  PN_CATS.forEach(k => {
    if(!Array.isArray(paquet[k])) return;
    p[k] = paquet[k].map(row => ({id:uid(), importId:meta.id, dateCollecte:meta.date, donnees:row}));
    n += paquet[k].length;
  });
  Object.assign(p.pont, {dernier:meta.date, erreurs:paquet.erreurs || [],
    compte:(paquet.profil && (paquet.profil.nom || paquet.profil.name)) || p.pont.compte || ''});
  p.brut.unshift({id:meta.id, date:meta.date, source:meta.source, endpoint:'/api/tout',
    categorie:'paquet complet', donnees:paquet});
  p.brut = p.brut.slice(0, 2);
  p.imports.push(meta);
  if(p.imports.length > 30) p.imports = p.imports.slice(-30);
  save(); render();
  return n;
}
async function pnTester(){
  toast('Test du pont…');
  try{
    const d = await pnAppelPont('/api/ping');
    toast(d.connecte ? 'Pont OK — ' + (d.nom || 'compte PRONOTE') + (d.etablissement ? ' · ' + d.etablissement : '')
      : 'Pont joignable mais pas connecté à PRONOTE (relance la connexion).');
  }catch(e){ toast('Pont injoignable : ' + e.message); }
}
async function pnRecuperer(){
  const pont = pnPont();
  if(UI.pnEnCours) return;
  UI.pnEnCours = true; render(); toast('Récupération PRONOTE en cours…');
  try{
    const paquet = await pnAppelPont('/api/tout');
    const n = pnAppliquerPaquet(paquet, 'pont');
    const err = (paquet.erreurs || []).length;
    toast(n + ' éléments récupérés' + (err ? ' · ' + err + ' rubrique(s) en échec' : '') + '.');
  }catch(e){
    pont.erreurs = ['Échec de la récupération : ' + e.message];
    save();
    toast('Échec : ' + e.message);
  }
  UI.pnEnCours = false; render();
}

          (e === 'g' ? 'Vérifier (' + (p.questions || []).length + ' questions)' : 'Refaire les questions') + '</button></div>' : '') + '</div>';
    }).join('');

function blocReprise(b){

function blocFichiers(c){

/* ===================== quiz ===================== */
function melange(a){ const t = a.slice(); for(let i = t.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [t[i],t[j]] = [t[j],t[i]]; } return t; }
function lancerQuiz(items, mid){
  if(!items.length){ toast('Aucune question pour l\'instant.'); return; }
  const c0 = items[0] && chap(items[0].cid);
  UI.quiz = {items, i:0, ok:0, rep:null, ordre:null, mid:mid || (c0 ? c0.mid : ''), fini:false};
  go('/quiz');
}
function questionsChap(cid){ const c = chap(cid); return melange(toutesQuestions(c).map(x => ({cid, qid:x.q.id}))); }
function questionsRevision(mid, n){
  const pool = [];
  S.chapitres.filter(c => !mid || c.mid === mid).forEach(c => toutesQuestions(c).forEach(xx => {
    const q = xx.q;
    let p = 1;
    if(q.last === 'ko') p = 6; else if((q.ko || 0) > (q.ok || 0)) p = 4; else if(q.ko) p = 2;
    for(let i = 0; i < p; i++) pool.push({cid:c.id, qid:q.id});
  }));
  const vu = {}, out = [];
  melange(pool).forEach(x => { const k = x.cid + x.qid; if(!vu[k]){ vu[k] = 1; out.push(x); } });
  return out.slice(0, n || 10);
}
function vueQuiz(){
  const Q = UI.quiz;
  if(!Q) return '<div class="empty">Aucun quiz en cours. <a href="#/jour">Retour</a></div>';
  if(Q.fini){
    const rates = Q.items.length - Q.ok, pct = Math.round(Q.ok * 100 / Q.items.length);
    return '<div class="quiz" style="text-align:center;padding-top:26px"><div class="score">' + Q.ok + '/' + Q.items.length + '</div>' +
      '<h1 style="margin:6px 0 10px">' + (pct >= 70 ? 'Bien' : pct >= 40 ? 'À consolider' : 'Reprends la leçon') + '</h1>' +
      '<p class="hint" style="margin-bottom:20px">' + (rates ? rates + ' question' + (rates > 1 ? 's reviendront' : ' reviendra') + ' en priorité.' : 'Tout est juste.') + '</p>' +
      '<div class="row" style="justify-content:center">' +
      (rates ? '<button class="btn primary" data-act="quiz-retry">Refaire les erreurs</button>' : '') +
      '<a class="btn" href="#/m/' + (Q.mid || '') + '">Retour à la matière</a></div></div>';
  }
  const it = Q.items[Q.i], c = chap(it.cid);
  const q = findQ(it.cid, it.qid);
  if(!q){ Q.i++; if(Q.i >= Q.items.length) Q.fini = true; return vueQuiz(); }
  if(!Q.ordre) Q.ordre = melange(q.ops.map((o,i) => i));
  let h = '<div class="quiz"><div class="row" style="justify-content:space-between">' +
    '<span class="hint">Question ' + (Q.i + 1) + '/' + Q.items.length + ' · ' + esc(c.titre) + '</span>' +
    '<a class="hint" href="#/m/' + (Q.mid || '') + '">Quitter</a></div>' +
    '<div class="jauge" style="margin-top:8px"><i style="width:' + Math.round(Q.i * 100 / Q.items.length) + '%"></i></div>' +
    '<div class="q-text">' + esc(q.q) + '</div>';
  h += Q.ordre.map(i => {
    let cl = 'opt';
    if(Q.rep !== null) cl += i === q.bonne ? ' bonne' : i === Q.rep ? ' fausse' : ' mute';
    return '<button class="' + cl + '"' + (Q.rep !== null ? ' disabled' : '') + ' data-act="rep" data-id="' + i + '">' + esc(q.ops[i]) + '</button>';
  }).join('');
  if(Q.rep !== null){
    const bon = Q.rep === q.bonne;
    h += '<div class="verdict' + (bon ? '' : ' faux') + '"><b>' + (bon ? 'Juste' : 'Faux — ' + esc(q.ops[q.bonne])) + '</b>' +
      esc(q.expl || (bon ? '' : 'Relis la leçon du chapitre.')) + '</div>' +
      '<button class="btn primary block" data-act="suivant">' + (Q.i + 1 >= Q.items.length ? 'Résultat' : 'Suivant') + '</button>';
  }
  return h + '</div>';
}

/* ===================== fichiers d'une matière ===================== */
function fichiersDe(mid){
  const out = [];
  S.chapitres.filter(c => c.mid === mid).forEach(c => {
    ['lecon','exemples'].forEach(ch => (c[ch] || []).forEach(d => { if(d.file)
      out.push({f:d.file, did:d.id, champ:ch, cid:c.id, mid:c.mid, chap:c.titre, ts:d.ts || 0}); }));
    (c.exos || []).forEach(d => { if(d.file)
      out.push({f:d.file, did:d.id, champ:'exos', cid:c.id, mid:c.mid, chap:c.titre, ts:d.ts || 0}); });
  });
  return out.sort((a,b) => b.ts - a.ts);
}
const NOMCHAMP = {lecon:'Leçon', exemples:'Exemples', exos:'Exercices'};

function poser(g, meta){
  let cid = g.cid;
  if(!cid || !chap(cid)){
    let sid = (sectionsDe(g.mid).find(s => s.titre === 'Hors programme') || {}).id;
    if(!sid){ sid = uid(); S.sections.push({id:sid, mid:g.mid, titre:'Hors programme', ord:99}); }
    const c = newChap(g.mid, sid, g.titre, chapsDeSection(sid).length);
    S.chapitres.push(c); cid = c.id;
  }
  const c = chap(cid);
  if(g.rub === 'exos') c.exos.push({id:uid(), enonce:g.titre, aide:'', file:meta, extrait:g.extrait || '', statut:'', ts:Date.now()});
  else c[g.rub === 'exemples' ? 'exemples' : 'lecon'].push({id:uid(), titre:g.titre, texte:'', file:meta, extrait:g.extrait || '', ts:Date.now()});
}

async function deposer(files, mid){
  const list = [...files];
  UI.analyse = list.map(f => f.name);
  render();
  let n = 0;
  for(const f of list){
    const txt = await extraireTexte(f);
    const g = devine(f.name, txt, mid);
    UI.analyse = UI.analyse.filter(x => x !== f.name);
    g.extrait = (txt || '').slice(0, 3000);
    if(chapsDe(mid).length && !g.cid){ UI.depot.push(Object.assign({f}, g)); render(); continue; }
    const meta = await storeFile(f);
    if(!meta){ render(); continue; }
    poser(g, meta); n++; save(); render();
  }
  UI.analyse = [];
  save(); render();
  if(n) toast(n + (n > 1 ? ' fichiers rangés' : ' fichier rangé') + (UI.depot.length ? ' · ' + UI.depot.length + ' à préciser' : ''));
  else if(UI.depot.length) toast('Indique le chapitre : je range ensuite.');
}

async function classerDepot(){
  const reste = [];
  let n = 0;
  for(const it of UI.depot){
    if(!it.cid){ reste.push(it); continue; }
    const meta = await storeFile(it.f);
    if(!meta){ reste.push(it); continue; }
    poser(it, meta); n++;
  }
  UI.depot = reste; save(); render();
  toast(n ? n + ' rangé' + (n > 1 ? 's' : '') : 'Choisis un chapitre.');
}

function repondre(i){
  const Q = UI.quiz;
  if(Q.rep !== null) return;
  const c = chap(Q.items[Q.i].cid), q = findQ(Q.items[Q.i].cid, Q.items[Q.i].qid);
  Q.rep = i;
  if(i === q.bonne){ q.ok = (q.ok || 0) + 1; q.last = 'ok'; Q.ok++; }
  else { q.ko = (q.ko || 0) + 1; q.last = 'ko'; }
  save(); render();
}

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'pnJsonFile' && t.files.length){
    const f = t.files[0], r = new FileReader();
    r.onload = () => { try{
      const obj = JSON.parse(r.result);
      pnImporter(obj, f.name, f.name);
      UI.pronoteTab = 'brut'; render(); toast('JSON PRONOTE importé.');
    }catch(e){ toast('JSON illisible.'); } };
    r.readAsText(f); t.value = ''; return;
  }
  if(t.id === 'pnHarFile' && t.files.length){
    const f = t.files[0], r = new FileReader();
    r.onload = () => {
      try{
        const har = JSON.parse(r.result), entries = (((har||{}).log||{}).entries||[]);
        let n = 0;
        entries.forEach(en => {
          const resp = en.response || {}, c = resp.content || {};
          let txt = c.text || '';
          if(!txt) return;
          if(c.encoding === 'base64'){
            try{ txt = atob(txt); }catch(e){ return; }
          }
          let obj;
          try{ obj = JSON.parse(txt); }catch(e){ return; }
          pnImporter(obj, 'HAR', (en.request && en.request.url) || '');
          n++;
        });
        UI.pronoteTab = 'brut'; render();
        toast(n ? n + ' réponses JSON importées depuis le HAR.' : 'Aucune réponse JSON exploitable trouvée dans ce HAR.');
      }catch(e){ toast('HAR illisible.'); }
    };
    r.readAsText(f); t.value = ''; return;
  }
  if(t.id === 'depotFile' && t.files.length){ deposer(t.files, t.dataset.mid); t.value = ''; return; }
  if(t.id === 'packFile' && t.files.length){
    const r = new FileReader();
    r.onload = () => { try{ appliquerPack(JSON.parse(r.result)); closeModal(); }catch(err){ toast('Pack illisible.'); } };
    r.readAsText(t.files[0]); t.value = ''; return;
  }
  if(t.id === 'progFile' && t.files.length){
    extraireTexte(t.files[0]).then(txt => {
      if(!txt) return toast('Fichier illisible : copie-colle le texte du programme.');
      UI.prog = txt; render();
    });
    t.value = ''; return;
  }
  if(t.dataset.dep){
    const it = UI.depot[+t.dataset.i];
    it[t.dataset.dep] = t.value;
    render();
  }
});

document.addEventListener('submit', async e => {
  const f = e.target;
  if(!f.dataset.form) return;
  e.preventDefault();
  const d = {};
  new FormData(f).forEach((v,k) => { d[k] = typeof v === 'string' ? v.trim() : v; });
  const type = f.dataset.form;

  if(type === 'prog'){ UI.prog = d.txt; render(); return; }
  if(type === 'pn-pont'){
    const pont = pnPont();
    pont.url = (d.url || 'http://127.0.0.1:8765').trim();
    pont.jeton = (d.jeton || '').trim();
    pont.auto = !!d.auto;
    save(); render(); toast('Pont enregistré.');
    return;
  }
  if(type === 'pn-import'){
    try{
      const a = (d.json || '').indexOf('{'), b = (d.json || '').lastIndexOf('}');
      if(a < 0 || b < a) throw 0;
      const obj = JSON.parse(d.json.slice(a,b+1));
      const cat = pnImporter(obj, 'JSON', d.endpoint || '');
      UI.pronoteTab = 'brut'; toast('Réponse importée et classée : ' + cat + '.');
    }catch(err){ toast('JSON PRONOTE illisible.'); }
    render(); return;
  }
  if(type === 'tache'){ if(!d.mid) return; S.taches.push({id:uid(), mid:d.mid, desc:d.desc, date:d.date}); UI.form = null; }
  if(type === 'item'){
    const c = chap(d.cid), champ = d.champ;
    const file = await readFile(f.querySelector('input[type=file]'));
    if(champ === 'notes'){ if(!d.texte) return; c.notes.push({id:uid(), texte:d.texte}); }
    else if(champ === 'exos') c.exos.push({id:uid(), enonce:d.titre, aide:d.texte, file, statut:'', ts:Date.now()});
    else c[champ].push({id:uid(), titre:d.titre || (file ? file.name : 'Document'), texte:d.texte, file, ts:Date.now()});
    UI.form = null;
  }
  if(type === 'quiz'){
    const ops = [d.o0, d.o1, d.o2].filter(x => x);
    if(ops.length < 2){ toast('Il faut deux propositions.'); return; }
    chap(d.cid).quiz.push({id:uid(), q:d.q, ops, bonne:0, expl:d.expl, ok:0, ko:0, last:null});
    UI.form = null;
  }
  if(type === 'note'){
    S.notes.push({id:uid(), mid:d.mid, cid:d.cid || '', titre:d.titre, note:d.note, sur:d.sur || 20,
      coef:d.coef || 1, date:d.date || today(), com:d.com || '', causes:new FormData(f).getAll('causes')});
    UI.form = null;
  }
  if(type === 'matiere'){ S.matieres.push({id:uid(), nom:d.nom, prof:d.prof, k:''}); closeModal(); }
  if(type === 'fb'){
    try{
      let t = (d.cfg || '').trim();
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if(a < 0) throw 0;
      t = t.slice(a, b + 1).replace(/([{,\s])([A-Za-z0-9_]+)\s*:/g, '$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
      const cfg = JSON.parse(t);
      if(!cfg.apiKey || !cfg.projectId) throw 0;
      cfg.code = (d.code || 'classeur').trim();
      S.fb = cfg; save(); closeModal();
      CLOUD.init(); toast('Firebase branché.');
    }catch(e){ toast('Configuration illisible : colle l\'objet firebaseConfig entier.'); }
    return;
  }
  if(type === 'profil'){ S.eleve.prenom = d.prenom; S.eleve.classe = d.classe; S.cle = d.cle || '';
    S.eleve.profil = d.profil || ''; closeModal(); }
  if(type === 'move'){
    const mv = UI.move, src = chap(mv.cid), dst = chap(d.cid);
    if(!src || !dst){ toast('Choisis un chapitre.'); return; }
    const arr = src[mv.champ], i = arr.findIndex(x => x.id === mv.did);
    if(i < 0) return;
    const doc = arr.splice(i,1)[0];
    const titre = doc.titre || doc.enonce || 'Document';
    if(d.champ === 'exos') dst.exos.push({id:doc.id, enonce:titre, aide:doc.aide || doc.texte || '', file:doc.file, statut:doc.statut || '', ts:doc.ts || Date.now()});
    else dst[d.champ].push({id:doc.id, titre, texte:doc.texte || doc.aide || '', file:doc.file, ts:doc.ts || Date.now()});
    closeModal(); toast('Déplacé.');
  }
  save();
  if(type !== 'prog') f.reset();
  render();
});

document.addEventListener('dragleave', e => { const z = $('dropzone'); if(z && !e.relatedTarget) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z0 = $('dropzone'); if(!z0) return; e.preventDefault();
  const z = $('dropzone'); if(z) z.classList.remove('over');
  if(e.dataTransfer && e.dataTransfer.files.length) deposer(e.dataTransfer.files, ($('depotFile') || {dataset:{}}).dataset.mid); });

function appliquerPack(o){
  let n = 0;
  (o.chapitres || []).forEach(x => {
    const c = S.chapitres.find(y => norm(y.titre) === norm(x.titre) &&
      (!x.matiere || norm(mat(y.mid).nom) === norm(x.matiere)));
    if(c){ poserContenu(c, x); n++; }
  });
  save(); render();
  toast(n ? n + ' chapitres préparés.' : 'Aucun titre ne correspond au programme enregistré.');
}

$('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o.matieres) throw 0;
      if(!confirm('Remplacer le contenu actuel ?')) return;
      S = migrer(o); save(); render(); toast('Sauvegarde restaurée.');
    }catch(err){ toast('Fichier de sauvegarde non reconnu.'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

render();
CLOUD.init();

/* récupération PRONOTE automatique à l'ouverture, si elle est activée */
(function pnAuto(){
  const pont = pnPont();
  if(!pont.auto || !pont.url) return;
  const ecart = pont.dernier ? Date.now() - new Date(pont.dernier).getTime() : Infinity;
  if(ecart < 30 * 60000) return;           // pas plus d'une fois par demi-heure
  setTimeout(() => { pnRecuperer(); }, 1500);
})();
