<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classeur — 2nde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F1; --page:#FFF; --rule:#E3E3DE; --rule2:#C8C8C1;
  --ink:#1A1A18; --ink2:#6C6C66;
  --acc:#2F5EA8; --acc-s:#EDF2FA;
  --ok:#1E7A46; --ok-s:#E8F4ED;
  --ko:#A93E33; --ko-s:#F8EDEB;
  --wa:#8A6100; --wa-s:#FBF2DE;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:grid;grid-template-columns:262px 1fr;height:100vh}
.side{background:var(--page);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.side-h{padding:14px 14px 10px;border-bottom:1px solid var(--rule)}
.side-h b{display:block;font-family:"Bricolage Grotesque";font-weight:700;font-size:16px;letter-spacing:-.03em}
.side-h span{font-size:12px;color:var(--ink2)}
.side-b{flex:1;overflow-y:auto;padding:10px 10px 20px}
.side-f{border-top:1px solid var(--rule);padding:9px 12px;display:flex;gap:6px;align-items:center;justify-content:space-between}

.grid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.5fr) minmax(280px,1.1fr);
  grid-template-rows:1fr 1fr;gap:10px;padding:10px;min-height:0;height:100vh}
.pan{background:var(--page);border:1px solid var(--rule);border-radius:9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pan-h{padding:9px 13px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}
.pan-h h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-family:inherit;font-weight:600}
.pan-b{flex:1;overflow-y:auto;padding:14px 15px}
.pan.cours{grid-row:1 / span 2;grid-column:2}
.pan.chap{grid-row:1;grid-column:1}
.pan.ret{grid-row:2;grid-column:1}
.pan.quiz{grid-row:1 / span 2;grid-column:3}
.pan.full{grid-row:1 / span 2;grid-column:1 / -1}

.tabsm{display:none}
@media (max-width:1000px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .side{position:static;border-right:none;border-bottom:1px solid var(--rule);max-height:46vh}
  .grid{display:block;height:auto;padding:0}
  .pan{border-radius:0;border-left:none;border-right:none;margin:0;display:none}
  .pan.on{display:flex;min-height:60vh}
  .pan-b{max-height:none}
  .tabsm{display:flex;position:sticky;top:0;z-index:10;background:var(--page);border-bottom:1px solid var(--rule)}
  .tabsm button{flex:1;border:none;background:none;padding:11px 4px;font-size:13px;color:var(--ink2);
    border-bottom:2px solid transparent;cursor:pointer}
  .tabsm button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
}

.mat-sel{display:flex;gap:6px;margin-bottom:10px}
.mat-sel select{flex:1}
.side .act{display:flex;gap:6px;margin-bottom:8px}
.side .act button{flex:1}
.sec-t{font-size:11px;letter-spacing:.07em;color:var(--ink2);text-transform:uppercase;margin:14px 0 4px;padding:0 6px}
.ch{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:none;background:none;
  padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1.35}
.ch:hover{background:var(--bg)}
.ch.on{background:var(--acc-s);color:var(--acc);font-weight:600}
.ch .n{color:var(--ink2);font-size:12px;flex:0 0 16px}
.ch .t{flex:1}
.pt{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--rule2);display:inline-block}
.pt.v{background:var(--ok)} .pt.o{background:var(--wa)} .pt.r{background:var(--ko)}
.modebar{display:flex;gap:6px;margin:2px 0 4px}
.modebar button{flex:1}
.modebar button.on{background:var(--acc);border-color:var(--acc);color:#fff}

.btn{border:1px solid var(--rule2);background:var(--page);border-radius:7px;padding:7px 11px;font-size:13.5px;
  cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:4px 9px;font-size:12.5px}
.btn.l{border:none;background:none;color:var(--acc);padding:3px 0;font-size:13px}
.btn.l:hover{text-decoration:underline;background:none}
.btn.d{border:none;background:none;color:var(--ink2);padding:3px 5px}
.btn.d:hover{color:var(--ko);background:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--rule2);
  border-radius:7px;padding:7px 10px;font-size:14px;background:#FDFDFC}
textarea{min-height:90px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.form{display:grid;gap:9px;margin:10px 0}

.vide{color:var(--ink2);font-size:13.5px;padding:10px 0}
.vide b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:14.5px}
.hint{font-size:12.5px;color:var(--ink2)}
.jauge{height:4px;background:var(--rule);border-radius:3px;overflow:hidden;margin:8px 0}
.jauge i{display:block;height:100%;background:var(--acc)}
.jauge.v i{background:var(--ok)} .jauge.o i{background:var(--wa)} .jauge.r i{background:var(--ko)}
.badge{font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--bg);color:var(--ink2)}
.badge.v{background:var(--ok-s);color:var(--ok)} .badge.o{background:var(--wa-s);color:var(--wa)}
.badge.r{background:var(--ko-s);color:var(--ko)}

.et{border-bottom:1px solid var(--rule);padding:12px 0}
.et:last-child{border-bottom:none}
.et h3{font-size:15.5px;margin-bottom:5px}
.et p{margin:0 0 9px;white-space:pre-wrap}
.ex{background:#FAFAF7;border-left:3px solid var(--rule2);padding:10px 12px;border-radius:0 6px 6px 0;
  white-space:pre-wrap;font-size:14px;margin-bottom:9px}
.ex b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:4px}
.ret{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;gap:9px}
.ret:last-child{border-bottom:none}
.ret .k{flex:0 0 auto;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);
  border:1px solid var(--rule);border-radius:10px;padding:1px 7px;height:fit-content}
.doc{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.doc:last-child{border-bottom:none}
.doc .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.q-num{font-size:12px;color:var(--ink2)}
.q-txt{font-family:"Bricolage Grotesque";font-size:18px;line-height:1.35;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:7px;border:1px solid var(--rule2);
  border-radius:8px;background:var(--page);cursor:pointer;font-size:14.5px;line-height:1.35}
.opt:hover{border-color:var(--acc)}
.opt.b{border-color:var(--ok);background:var(--ok-s);color:var(--ok);font-weight:600}
.opt.m{border-color:var(--ko);background:var(--ko-s);color:var(--ko);font-weight:600}
.opt.g{opacity:.5}
.verd{padding:11px 13px;border-radius:8px;font-size:14px;margin:4px 0 12px;background:var(--ok-s);color:var(--ok)}
.verd.f{background:var(--ko-s);color:var(--ko)}
.verd b{display:block;margin-bottom:3px}
.score{font-family:"Bricolage Grotesque";font-size:38px;font-weight:700;letter-spacing:-.03em}

.mbg{position:fixed;inset:0;background:rgba(26,26,24,.42);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:16px}
.mod{background:var(--page);border-radius:12px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px;position:relative}
.mod h2{font-size:17px;margin-bottom:10px}
.mclose{position:absolute;top:10px;right:10px;width:30px;height:30px;border:none;background:none;
  font-size:16px;color:var(--ink2);cursor:pointer;border-radius:50%;line-height:1}
.mclose:hover{background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 15px;border-radius:20px;font-size:13.5px;z-index:90;max-width:90%;text-align:center}
.charge{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13.5px;padding:10px 0}
.charge i{width:12px;height:12px;border:2px solid var(--rule2);border-top-color:var(--acc);border-radius:50%;
  animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.charge i{animation:none}}

/* évaluation */
.eval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.eval-card{border:1px solid var(--rule);border-radius:9px;padding:13px;background:#FDFDFC}
.eval-card.weak{border-left:4px solid var(--ko);background:var(--ko-s)}
.eval-card.mid{border-left:4px solid var(--wa);background:var(--wa-s)}
.eval-card.good{border-left:4px solid var(--ok);background:var(--ok-s)}
.eval-card h3{font-size:14.5px;margin-bottom:6px}
.eval-pct{font-family:"Bricolage Grotesque";font-size:26px;font-weight:700}

/* scanner */
.scan-video{width:100%;max-height:46vh;background:#111;border-radius:9px;object-fit:contain}
.scan-preview{width:100%;max-height:46vh;object-fit:contain;border-radius:9px;border:1px solid var(--rule);background:#111}
.scan-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.crop-wrap{position:relative;display:inline-block;max-width:100%;touch-action:none;user-select:none;background:#111;border-radius:9px}
.crop-wrap img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:9px;pointer-events:none}
.crop-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crop-svg polygon{fill:rgba(47,94,168,.18);stroke:var(--acc);stroke-width:2}
.corner{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:var(--acc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:grab;padding:0}
.corner:active{cursor:grabbing;transform:scale(1.15)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-h"><b>Classeur</b><span id="sousTitre">2nde</span></div>
    <div class="side-b" id="side"></div>
    <div class="side-f"><span class="hint" id="etat">local</span>
      <button class="btn s" data-a="reglages">Réglages</button></div>
  </aside>
  <div>
    <div class="tabsm" id="tabsm"></div>
    <div class="grid" id="mainGrid"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<script>
/* ===================== état ===================== */
const KEY = 'classeur_dayann_v3';
let MEM = null;
const disk = {
  read(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return MEM; } },
  write(o){ MEM = o; try{ localStorage.setItem(KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
};
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toast(m){ const h = $('toastHost'); h.innerHTML = '<div class="toast">' + esc(m) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => { h.innerHTML = ''; }, 3000); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function capital(s){ s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function poids(n){ return n > 999999 ? (n/1048576).toFixed(1) + ' Mo' : Math.max(1, Math.round(n/1024)) + ' Ko'; }
function today(){ return new Date().toISOString().slice(0,10); }

function neuf(){
  const noms = ['Mathématiques','Français','Physique-Chimie','SVT','Histoire-Géographie','Anglais','Espagnol'];
  return {v:3, eleve:{prenom:'', classe:'2nde', profil:''}, cle:'', fb:null,
    matieres:noms.map(n => ({id:uid(), nom:n})), sections:[], chapitres:[], docs:[], evaluations:[]};
}
function migrer(o){
  if(!o || !o.matieres) return neuf();
  o.docs = o.docs || [];
  o.evaluations = o.evaluations || [];
  o.sections = o.sections || [];
  (o.chapitres || []).forEach(c => {
    c.cours = c.cours || [];
    c.retenir = c.retenir || [];
    c.quiz = c.quiz || [];
    c.prog = c.prog || {i:0, fini:false};
    if(typeof c.ord !== 'number') c.ord = 0;
  });
  o.v = 3;
  return o;
}
let S = migrer(disk.read());
/* Configuration Firebase intégrée : connecte automatiquement tout nouvel
   appareil au même classeur, sans passer par Réglages. */
const FB_PAR_DEFAUT = {"apiKey":"AIzaSyDHbiAC8mfdg2ToiqytMgPUxWGEYNYf5RU","authDomain":"ddms-architectures.firebaseapp.com","projectId":"ddms-architectures","storageBucket":"ddms-architectures.firebasestorage.app","appId":"1:767552965189:web:5b0c5ab6cd5bf97a5fb12c","code":"dayann-2nde"};
if(!S.fb) S.fb = FB_PAR_DEFAUT;
function save(){
  S.maj = Date.now();
  if(!disk.write(S)) toast('Mémoire pleine : fais une sauvegarde.');
  if(typeof CLOUD !== 'undefined') CLOUD.envoyer();
}

/* ===================== modèle ===================== */
function mat(id){ return S.matieres.find(m => m.id === id) || {nom:'', id:''}; }
function chap(id){ return S.chapitres.find(c => c.id === id); }
function sectionsDe(mid){ return S.sections.filter(s => s.mid === mid).sort((a,b) => a.ord - b.ord); }
function chapsDeSection(sid){ return S.chapitres.filter(c => c.sid === sid).sort((a,b) => a.ord - b.ord); }
function chapsDe(mid){
  const out = [];
  sectionsDe(mid).forEach(s => chapsDeSection(s.id).forEach(c => out.push(c)));
  S.chapitres.filter(c => c.mid === mid && !S.sections.some(s => s.id === c.sid)).forEach(c => out.push(c));
  return out;
}
function sectionDe(c){ return S.sections.find(s => s.id === c.sid); }
function numero(c){ return chapsDe(c.mid).findIndex(x => x.id === c.id) + 1; }
function newChap(mid, sid, titre, ord){
  return {id:uid(), mid, sid, titre, ord, cours:[], retenir:[], quiz:[], prog:{i:0, fini:false}, genere:0, acquis:false};
}
function docsDe(mid, cid){
  return S.docs.filter(d => d.mid === mid && (!cid || d.cid === cid));
}

/* ===================== progression ===================== */
function etat(c){
  const q = c.quiz || [];
  const testees = q.filter(x => x.last).length;
  const ok = q.filter(x => x.last === 'ok').length;
  const pct = q.length ? Math.round(ok * 100 / q.length) : 0;
  let coul = '', mot = 'Pas commencé';
  if(!q.length) mot = c.genere ? 'À tester' : 'Vide';
  else if(!testees) mot = 'Pas commencé';
  else if(pct >= 80){ coul = 'v'; mot = 'Maîtrisé'; }
  else if(pct >= 40){ coul = 'o'; mot = 'En cours'; }
  else { coul = 'r'; mot = 'À retravailler'; }
  return {pct, coul, mot, ok, testees, total:q.length, rates:q.filter(x => x.last === 'ko')};
}
function profil(){
  return (S.eleve.profil || '').trim() ||
    'Élève de seconde. Il comprend les notions mais manque de méthode : rédaction incomplète, étapes non justifiées, points perdus en devoir. Il faut donc toujours montrer la rédaction attendue.';
}

/* ===================== interface : état ===================== */
let UI = {mid:'', cid:'', gen:'', genMsg:'', tab:'chap', mode:'chapitre', modal:null, prog:'', ouvert:{}, scanStream:null, scanImage:null};
if(S.matieres.length) UI.mid = S.matieres[0].id;

/* ===================== fichiers ===================== */
const FS = {
  db:null,
  open(){ return new Promise((res, rej) => {
    if(FS.db) return res(FS.db);
    if(!window.indexedDB) return rej('no');
    let r; try{ r = indexedDB.open('classeur2nde_files', 1); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => { FS.db = r.result; res(FS.db); };
    r.onerror = () => rej(r.error);
  }); },
  async put(id, b){ const db = await FS.open(); return new Promise((res, rej) => {
    const t = db.transaction('f','readwrite'); t.objectStore('f').put(b, id);
    t.oncomplete = () => res(1); t.onerror = () => rej(t.error); }); },
  async get(id){ const db = await FS.open(); return new Promise((res, rej) => {
    const t = db.transaction('f','readonly'), q = t.objectStore('f').get(id);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};
function toDataURL(f){ return new Promise(r => { const x = new FileReader(); x.onload = () => r(x.result); x.readAsDataURL(f); }); }
async function storeFile(f){
  if(!f) return null;
  const meta = {id:uid(), name:f.name, type:f.type, size:f.size};
  try{ meta.cloud = await CLOUD.envoiFichier(meta.id, f); }catch(e){}
  try{ await FS.put(meta.id, f); }
  catch(e){
    if(meta.cloud) return meta;
    if(f.size > 1400000){ toast('« ' + f.name + ' » est trop lourd pour ce navigateur.'); return null; }
    meta.data = await toDataURL(f);
  }
  return meta;
}
async function readFile(input){ const f = input && input.files && input.files[0]; return f ? storeFile(f) : null; }
async function ouvrir(meta){
  if(!meta) return;
  let href = meta.data;
  if(!href){
    try{ const b = await FS.get(meta.id); if(b) href = URL.createObjectURL(b); }catch(e){}
  }
  if(!href && meta.cloud){
    try{ href = await CLOUD.lien(meta.cloud); }catch(e){}
  }
  if(!href){ toast('Fichier introuvable. Connecte-toi pour le récupérer.'); return; }
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  const t = meta.type || '';
  if(!(t.startsWith('image/') || t === 'application/pdf' || t.startsWith('text/'))) a.download = meta.name;
  document.body.appendChild(a); a.click(); a.remove();
  if(href.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(href), 20000);
}

/* ---- lecture du contenu ---- */
let PDFLIB = null, PDFKO = false;
async function loadPdfjs(){
  if(PDFLIB) return PDFLIB;
  if(PDFKO) throw 'ko';
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = base + 'pdf.min.js'; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc); setTimeout(rej, 9000);
  }).catch(() => { PDFKO = true; throw 'ko'; });
  const lib = window.pdfjsLib;
  if(!lib){ PDFKO = true; throw 'ko'; }
  try{ const w = await fetch(base + 'pdf.worker.min.js').then(r => r.text());
    lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], {type:'text/javascript'})); }catch(e){}
  PDFLIB = lib; return lib;
}
async function extraireTexte(f){
  const n = norm(f.name), t = f.type || '';
  try{
    if(t.startsWith('text/') || /\.(txt|md|csv|rtf)$/.test(n)) return (await f.text()).slice(0, 8000);
    if(t === 'application/pdf' || /\.pdf$/.test(n)){
      const lib = await loadPdfjs();
      const doc = await lib.getDocument({data:await f.arrayBuffer(), isEvalSupported:false}).promise;
      let out = '';
      for(let i = 1; i <= Math.min(4, doc.numPages); i++){
        const c = await (await doc.getPage(i)).getTextContent();
        out += c.items.map(x => x.str).join(' ') + ' ';
        if(out.length > 8000) break;
      }
      return out.slice(0, 8000);
    }
  }catch(e){}
  return '';
}


/* ===================== programme ===================== */
function nettoieTitre(t){
  return capital(String(t || '').replace(/^[\s:\-–—•*.\d)]+/,'').replace(/\s+/g,' ').trim());
}
function parseProgramme(txt){
  const out = [];
  let cur = null;
  const pushChap = t => {
    t = nettoieTitre(t);
    if(!t || t.length < 2) return;
    if(!cur){ cur = {titre:'Programme', chapitres:[]}; out.push(cur); }
    cur.chapitres.push(t);
  };
  String(txt || '').split(/\r?\n/).forEach(raw => {
    let l = raw.trim().replace(/^[•\-*\u2022\u25AA]\s*/,'');
    if(!l) return;
    let m;
    if((m = l.match(/^(section|partie|th[eè]me|module|unit[eé]|bloc|domaine)\b[\s:.\-–—]*[\dIVX]*[\s:.\-–—]*(.*)$/i))){
      cur = {titre:nettoieTitre(m[2] || l) || 'Section ' + (out.length + 1), chapitres:[]};
      out.push(cur); return;
    }
    if((m = l.match(/^(chapitre|chap\.?|le[çc]on)\b\s*n?°?\s*[\dIVX]*[\s:.\-–—]*(.*)$/i))){ pushChap(m[2] || l); return; }
    if(l.length < 80 && l === l.toUpperCase() && /[A-ZÀ-Ý]{3}/.test(l)){
      cur = {titre:nettoieTitre(l), chapitres:[]}; out.push(cur); return;
    }
    if((m = l.match(/^\d{1,2}\s*[.)\-–]\s*(.+)$/))){ pushChap(m[1]); return; }
    pushChap(l);
  });
  return out.filter(s => s.chapitres.length);
}
function appliquerProgramme(mid, parsed){
  const anciens = S.chapitres.filter(c => c.mid === mid);
  const pris = {};
  S.sections = S.sections.filter(s => s.mid !== mid);
  parsed.forEach((sec, i) => {
    const sid = uid();
    S.sections.push({id:sid, mid, titre:sec.titre, ord:i});
    sec.chapitres.forEach((t, j) => {
      const ex = anciens.find(c => !pris[c.id] && norm(c.titre) === norm(t));
      if(ex){ pris[ex.id] = 1; ex.sid = sid; ex.ord = j; ex.titre = t; }
      else S.chapitres.push(newChap(mid, sid, t, j));
    });
  });
  const restes = anciens.filter(c => !pris[c.id] &&
    ((c.lecon || []).length + (c.exemples || []).length + (c.exos || []).length + (c.quiz || []).length + (c.notes || []).length));
  const vides = anciens.filter(c => !pris[c.id] && restes.indexOf(c) < 0);
  S.chapitres = S.chapitres.filter(c => vides.indexOf(c) < 0);
  if(restes.length){
    const sid = uid();
    S.sections.push({id:sid, mid, titre:'Hors programme', ord:99});
    restes.forEach((c, j) => { c.sid = sid; c.ord = j; });
  }
  save();
}


/* ===================== synchronisation Firebase ===================== */
const SDKB = 'https://www.gstatic.com/firebasejs/10.12.2/';
function chargerScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => rej(new Error('réseau'));
    document.head.appendChild(el);
  });
}
const CLOUD = {
  db:null, st:null, uid:null, unsub:null, tmr:null, etat:'local', err:'',
  async sdk(){
    if(window.firebase && window.firebase.firestore) return;
    await chargerScript(SDKB + 'firebase-app-compat.js');
    await chargerScript(SDKB + 'firebase-auth-compat.js');
    await chargerScript(SDKB + 'firebase-firestore-compat.js');
    await chargerScript(SDKB + 'firebase-storage-compat.js');
  },
  async init(){
    const cfg = S.fb;
    if(!cfg || !cfg.apiKey){ this.etat = 'local'; return; }
    try{
      await this.sdk();
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      this.st = firebase.storage();
      this.etat = 'connexion'; render();
      try{ await firebase.auth().signInAnonymously(); }catch(e){}
      this.uid = (cfg.code || 'classeur').trim().replace(/[^a-zA-Z0-9_-]/g,'-');
      this.etat = 'sync';
      this.ecoute();
      render();
    }catch(e){ this.etat = 'erreur'; this.err = e.message; render(); }
  },
  ref(){ return this.db.collection('classeurs').doc(this.uid); },
  chemin(id){ return 'classeurs/' + this.uid + '/' + id; },
  ecoute(){
    if(this.unsub) this.unsub();
    this.unsub = this.ref().onSnapshot(d => {
      if(!d.exists){ this.envoyer(true); return; }
      const r = d.data() || {};
      if((r.maj || 0) > (S.maj || 0) + 500){
        try{
          const o = JSON.parse(r.json);
          o.fb = S.fb;
          S = migrer(o); S.maj = r.maj;
          disk.write(S); render();
        }catch(e){}
      }
    }, e => { this.etat = 'erreur'; this.err = e.message; render(); });
  },
  envoyer(direct){
    if(!this.uid || !this.db) return;
    clearTimeout(this.tmr);
    const envoi = () => {
      const o = Object.assign({}, S); delete o.fb;
      this.ref().set({json:JSON.stringify(o), maj:S.maj || Date.now()})
        .catch(e => { this.etat = 'erreur'; this.err = e.message; });
    };
    if(direct) envoi(); else this.tmr = setTimeout(envoi, 1500);
  },
  async envoiFichier(id, f){
    if(!this.uid || !this.st) return null;
    const r = this.st.ref(this.chemin(id));
    await r.put(f);
    return r.fullPath;
  },
  async lien(path){ return this.st.ref(path).getDownloadURL(); }
};
function etatSync(){
  return {local:'sur cet appareil', connexion:'connexion…', hors:'non connecté',
    sync:'synchronisé', erreur:'erreur : ' + CLOUD.err}[CLOUD.etat] || '';
}


async function appelClaude(prompt){
  const key = (S.cle || '').trim();
  if(!key) throw new Error('sans-cle');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json', 'x-api-key':key,
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6', max_tokens:6000, messages:[{role:'user', content:prompt}]})
  });
  if(!r.ok) throw new Error(r.status === 401 ? 'cle-invalide' : 'erreur ' + r.status);
  const data = await r.json();
  const txt = (data.content || []).filter(x => x.type === 'text').map(x => x.text).join('');
  const net = txt.replace(/```json|```/g,'').trim();
  return JSON.parse(net.slice(net.indexOf('{'), net.lastIndexOf('}') + 1));
}

/* ===================== documents : contexte pour l'IA ===================== */
function docsUtiles(c){
  const liees = S.docs.filter(d => d.cid === c.id && d.texte);
  if(liees.length) return liees;
  const mots = norm(c.titre).split(/[^a-z0-9]+/).filter(w => w.length > 4);
  return S.docs.filter(d => d.mid === c.mid && d.texte && mots.some(w => norm(d.texte).includes(w))).slice(0,3);
}
function extraitsDocs(c){
  const l = docsUtiles(c);
  if(!l.length) return '';
  let t = '';
  l.forEach(d => { t += '\n--- ' + d.nom + ' ---\n' + String(d.texte).slice(0, 2200) + '\n'; });
  return '\nDocuments de l\'élève à utiliser en priorité (son cours, ses devoirs) :\n' + t.slice(0, 5000) + '\n';
}

async function genererChapitre(cid, silencieux){

    c.retenir = (o.retenir || []).map(x => ({id:uid(), k:x.k || 'À retenir', texte:x.texte}));
    c.quiz = (o.quiz || []).map(x => ({id:uid(), q:x.q, ops:(x.ops || []).slice(0,4), bonne:0,
      expl:x.expl, notion:x.notion, ok:0, ko:0, last:null}));

/* ===================== évaluation ===================== */
function quizStats(mid){
  const by = {};
  chapsDe(mid).forEach(c => (c.quiz || []).forEach(q => {
    if(!q.last) return;
    const n = q.notion || c.titre;
    if(!by[n]) by[n] = {ok:0, total:0, cid:c.id};
    by[n].total++;
    if(q.last === 'ok') by[n].ok++;
  }));
  return by;
}
function evaluationsDe(mid){ return (S.evaluations || []).filter(e => e.mid === mid); }
function faiblessesMat(mid){
  const out = [];
  const qs = quizStats(mid);
  Object.keys(qs).forEach(n => {
    const x = qs[n], pct = x.total ? Math.round(x.ok * 100 / x.total) : 0;
    out.push({notion:n, pct, source:'Quiz', cid:x.cid});
  });
  evaluationsDe(mid).forEach(e => {
    const pct = e.max ? Math.round(Number(e.score) / Number(e.max) * 100) : 0;
    out.push({notion:e.chap && chap(e.chap) ? chap(e.chap).titre : (e.notion || e.titre || 'Évaluation'),
      pct, source:(e.type || 'Devoir') + (e.titre ? ' · ' + e.titre : ''), cid:e.chap || ''});
  });
  return out.sort((a,b) => a.pct - b.pct);
}

  if(!q){ c.prog.i++; save(); renderQuiz(c); return; }
  if(!UI.ordre || UI.ordreQ !== q.id){ UI.ordre = melange(q.ops.map((o,k) => k)); UI.ordreQ = q.id; }
  let h = '<div class="q-num">Question ' + (i + 1) + ' sur ' + serie.length + (q.notion ? ' · ' + esc(q.notion) : '') + '</div>' +
    '<div class="q-txt">' + esc(q.q) + '</div>';
  h += UI.ordre.map(k => {

  }).join('');
  if(UI.rep != null){
    const bon = UI.rep === q.bonne;
    h += '<div class="verd' + (bon ? '' : ' f') + '"><b>' + (bon ? 'Juste' : 'Faux — ' + esc(q.ops[q.bonne])) + '</b>' +

      (i + 1 >= serie.length ? 'Voir le résultat' : 'Question suivante') + '</button>';
  }
  host.innerHTML = h;
}
function melange(a){ const t = a.slice(); for(let i = t.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [t[i],t[j]] = [t[j],t[i]]; } return t; }

document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-a="corner-down"]');

/* ===================== scanner : traitement d'image ===================== */
function scanGray(data,w,h){
  const g=new Uint8Array(w*h);
  for(let i=0,p=0;i<g.length;i++,p+=4) g[i]=Math.round(.299*data[p]+.587*data[p+1]+.114*data[p+2]);
  return g;
}
function detectDocumentCorners(canvas){
  const maxW=720,maxH=540,scale=Math.min(1,maxW/canvas.width,maxH/canvas.height);
  const w=Math.max(180,Math.round(canvas.width*scale)),h=Math.max(180,Math.round(canvas.height*scale));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d',{willReadFrequently:true}); cx.drawImage(canvas,0,0,w,h);
  const im=cx.getImageData(0,0,w,h),d=im.data,g=scanGray(d,w,h);
  const vals=[];
  for(let i=0;i<g.length;i+=7) vals.push(g[i]);
  vals.sort((a,b)=>a-b);
  const q50=vals[Math.floor(vals.length*.50)]||130;
  const q70=vals[Math.floor(vals.length*.70)]||165;
  const thr=Math.max(115,Math.min(205,Math.round(q50*.42+q70*.58)));
  const mask=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x,p=i*4,r=d[p],gg=d[p+1],b=d[p+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);
    const sat=mx-mn;
    mask[i]=(g[i]>=thr && sat<105)?1:0;
  }
  const dil=new Uint8Array(w*h),close=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    let hit=0;
    for(let yy=-1;yy<=1&&!hit;yy++)for(let xx=-1;xx<=1;xx++) if(mask[(y+yy)*w+x+xx]){hit=1;break;}
    dil[y*w+x]=hit;
  }
  for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){
    let ok=1;
    for(let yy=-1;yy<=1&&ok;yy++)for(let xx=-1;xx<=1;xx++) if(!dil[(y+yy)*w+x+xx]){ok=0;break;}
    close[y*w+x]=ok;
  }
  const seen=new Uint8Array(w*h),queue=new Int32Array(w*h),comps=[];
  for(let sy=2;sy<h-2;sy+=2)for(let sx=2;sx<w-2;sx+=2){
    const seed=sy*w+sx;
    if(!close[seed]||seen[seed])continue;
    let head=0,tail=0,count=0,minx=w,maxx=0,miny=h,maxy=0;
    queue[tail++]=seed;seen[seed]=1;
    while(head<tail){
      const idx=queue[head++], y=(idx/w)|0, x=idx-y*w; count++;
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      if(x>1){const n=idx-1;if(close[n]&&!seen[n]){seen[n]=1;queue[tail++]=n;}}
      if(x<w-2){const n=idx+1;if(close[n]&&!seen[n]){seen[n]=1;queue[tail++]=n;}}
      if(y>1){const n=idx-w;if(close[n]&&!seen[n]){seen[n]=1;queue[tail++]=n;}}
      if(y<h-2){const n=idx+w;if(close[n]&&!seen[n]){seen[n]=1;queue[tail++]=n;}}
    }
    const bw=maxx-minx+1,bh=maxy-miny+1,area=bw*bh;
    if(count>w*h*.012 && bw>w*.22 && bh>h*.22) comps.push({count,minx,maxx,miny,maxy,bw,bh,area});
  }
  if(!comps.length)return null;
  comps.sort((a,b)=>b.area-a.area);
  let comp=comps[0];
  const scored=comps.slice(0,12).map(q=>{
    const ratio=Math.max(q.bw/q.bh,q.bh/q.bw);
    const rectangular=ratio<3.0?1:0.35;
    const fill=q.count/Math.max(1,q.area);
    return {q,score:q.area*rectangular*(.65+.35*Math.min(1,fill*1.8))};
  }).sort((a,b)=>b.score-a.score);
  comp=scored[0].q;
  const boundary=[];
  const step=Math.max(1,Math.round(Math.max(w,h)/700));
  for(let y=comp.miny;y<=comp.maxy;y+=step)for(let x=comp.minx;x<=comp.maxx;x+=step){
    const idx=y*w+x;if(!close[idx])continue;
    if(!close[idx-1]||!close[idx+1]||!close[idx-w]||!close[idx+w]) boundary.push({x,y});
  }
  if(boundary.length<20)return null;
  boundary.sort((a,b)=>a.x-b.x||a.y-b.y);
  const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lower=[];
  for(const p of boundary){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}
  const upper=[];
  for(let i=boundary.length-1;i>=0;i--){const p=boundary[i];while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}
  upper.pop();lower.pop();
  const hull=lower.concat(upper);
  if(hull.length<4)return null;
  const n=hull.length;
  const candidates=[];
  const radius=Math.max(3,Math.round(n*.035));
  for(let i=0;i<n;i++){
    const p=hull[i],a=hull[(i-radius+n)%n],b=hull[(i+radius)%n];
    const ax=a.x-p.x,ay=a.y-p.y,bx=b.x-p.x,by=b.y-p.y;
    const na=Math.hypot(ax,ay)||1,nb=Math.hypot(bx,by)||1;
    const cos=Math.max(-1,Math.min(1,(ax*bx+ay*by)/(na*nb)));
    const angle=Math.acos(cos);
    candidates.push({p,sharp:Math.PI-angle});
  }
  candidates.sort((a,b)=>b.sharp-a.sharp);
  const picked=[];
  const minSep=Math.max(8,n*.10);
  for(const cnd of candidates){
    if(picked.every(x=>Math.hypot(x.p.x-cnd.p.x,x.p.y-cnd.p.y)>minSep)) picked.push(cnd);
    if(picked.length===4)break;
  }
  if(picked.length<4){
    const ex=[
      hull.reduce((a,p)=>p.x+p.y<a.x+a.y?p:a,hull[0]),
      hull.reduce((a,p)=>p.x-p.y>a.x-a.y?p:a,hull[0]),
      hull.reduce((a,p)=>p.x+p.y>a.x+a.y?p:a,hull[0]),
      hull.reduce((a,p)=>p.y-p.x>a.y-a.x?p:a,hull[0])
    ];
    picked.splice(0,picked.length,...ex.map(p=>({p,sharp:1})));
  }
  const pts=picked.map(x=>x.p);
  const ordered=orderedCorners(pts);
  const polyArea=Math.abs(ordered.reduce((sum,p,i)=>{const q=ordered[(i+1)%4];return sum+p.x*q.y-q.x*p.y;},0))/2;
  if(polyArea/(w*h)<.16)return null;
  const lens=[];for(let i=0;i<4;i++){const a=ordered[i],b=ordered[(i+1)%4];lens.push(Math.hypot(b.x-a.x,b.y-a.y));}
  if(Math.min(...lens)<Math.min(w,h)*.18)return null;
  return ordered.map(p=>({x:p.x/scale,y:p.y/scale}));
}
function orderedCorners(p){
  const a=p.slice().sort((u,v)=>(u.x+u.y)-(v.x+v.y));
  const tl=a[0],br=a[3],r=a.slice(1,3);
  const tr=r[0].x>r[1].x?r[0]:r[1],bl=r[0].x>r[1].x?r[1]:r[0];
  return [tl,tr,br,bl];
}
function projectiveCoefficients(src,dst){
  const A=[],B=[];
  for(let i=0;i<4;i++){
    const x=dst[i].x,y=dst[i].y,u=src[i].x,v=src[i].y;
    A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v);
  }
  for(let c=0;c<8;c++){
    let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[B[c],B[p]]=[B[p],B[c]];
    const z=A[c][c]||1;for(let j=c;j<8;j++)A[c][j]/=z;B[c]/=z;
    for(let r=0;r<8;r++)if(r!==c){const q=A[r][c];if(!q)continue;for(let j=c;j<8;j++)A[r][j]-=q*A[c][j];B[r]-=q*B[c];}
  }
  return B;
}
function warpPerspectiveCanvas(canvas,corners){
  const [tl,tr,br,bl]=orderedCorners(corners);
  const top=Math.hypot(tr.x-tl.x,tr.y-tl.y),bot=Math.hypot(br.x-bl.x,br.y-bl.y);
  const left=Math.hypot(bl.x-tl.x,bl.y-tl.y),right=Math.hypot(br.x-tr.x,br.y-tr.y);
  const sourceW=(top+bot)/2,sourceH=(left+right)/2;
  const portrait=sourceH >= sourceW*0.88;
  const W=portrait?1240:1754,H=portrait?1754:1240;
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d'),od=oc.createImageData(W,H);
  const src=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);
  const target=[{x:0,y:0},{x:W-1,y:0},{x:W-1,y:H-1},{x:0,y:H-1}];
  const inv=projectiveCoefficients(target,[tl,tr,br,bl]);
  const [a,b,c,d,e,f,g,h]=inv,sd=src.data,dd=od.data,sw=src.width,sh=src.height;
  for(let y=0,p=0;y<H;y++)for(let x=0;x<W;x++,p+=4){
    const den=g*x+h*y+1,sx=(a*x+b*y+c)/den,sy=(d*x+e*y+f)/den;
    if(sx<0||sy<0||sx>=sw-1||sy>=sh-1){dd[p]=dd[p+1]=dd[p+2]=255;dd[p+3]=255;continue;}
    const ix=sx|0,iy=sy|0,fx=sx-ix,fy=sy-iy,i=(iy*sw+ix)*4,j=i+4,k=i+sw*4,l=k+4;
    for(let ch=0;ch<3;ch++){
      const q=sd[i+ch]*(1-fx)+sd[j+ch]*fx,r=sd[k+ch]*(1-fx)+sd[l+ch]*fx;
      dd[p+ch]=q*(1-fy)+r*fy;
    }
    dd[p+3]=255;
  }
  oc.putImageData(od,0,0);return out;
}
function enhanceScanCanvas(canvas,mode){
  const max=1800,sc=Math.min(1,max/Math.max(canvas.width,canvas.height));
  const w=Math.round(canvas.width*sc),h=Math.round(canvas.height*sc),out=document.createElement('canvas');
  out.width=w;out.height=h;const ctx=out.getContext('2d',{willReadFrequently:true});ctx.drawImage(canvas,0,0,w,h);
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){
    const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    let z=(y-128)*1.18+128;
    if(mode==='bw') z=z<145?Math.max(0,z-22):Math.min(255,z+18);
    z=Math.max(0,Math.min(255,z));
    if(mode==='bw') d[i]=d[i+1]=d[i+2]=z;
    else {d[i]=Math.min(255,d[i]*.92+z*.08);d[i+1]=Math.min(255,d[i+1]*.92+z*.08);d[i+2]=Math.min(255,d[i+2]*.92+z*.08);}
  }
  const src=new Uint8ClampedArray(d), radius=2;
  for(let y=radius;y<h-radius;y++)for(let x=radius;x<w-radius;x++){
    const p=(y*w+x)*4;
    for(let ch=0;ch<3;ch++){
      const blur=(src[p-radius*4+ch]+src[p+radius*4+ch]+src[p-radius*w*4+ch]+src[p+radius*w*4+ch])/4;
      const sharp=src[p+ch]+(src[p+ch]-blur)*.32;
      d[p+ch]=Math.max(0,Math.min(255,sharp));
    }
  }
  ctx.putImageData(im,0,0);return out;
}
function rotateCanvas90(src,deg){
  const out=document.createElement('canvas'),ctx=out.getContext('2d');
  out.width=src.height;out.height=src.width;ctx.translate(out.width/2,out.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(src,-src.width/2,-src.height/2);return out;
}
function chargerImage(dataUrl){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=dataUrl; });
}
async function baseDe(dataUrl,max){
  const img = await chargerImage(dataUrl);
  const sc = Math.min(1, (max||1600)/Math.max(img.width,img.height));
  const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
  const base = document.createElement('canvas'); base.width=w; base.height=h;
  base.getContext('2d').drawImage(img,0,0,w,h);
  return base;
}
/* Détection automatique : renvoie les 4 coins en fraction (0..1) de l'image
   d'origine, ou null si la feuille n'a pas pu être isolée (main sur un coin,
   fond peu contrasté, feuille trop proche du bord...). Les fractions sont
   indépendantes de la résolution, donc réutilisables telles quelles. */
async function detecterCoinsFrac(dataUrl){
  const base = await baseDe(dataUrl, 1600);
  const corners = detectDocumentCorners(base);
  if(!corners) return null;
  return corners.map(p => ({x:p.x/base.width, y:p.y/base.height}));
}
function coinsParDefaut(){
  return [{x:.08,y:.08},{x:.92,y:.08},{x:.92,y:.92},{x:.08,y:.92}];
}
/* Applique le redressement à partir de 4 coins choisis (auto ou manuel),
   donnés en fraction de l'image d'origine. */
async function redresserAvecCoins(dataUrl, coinsFrac, mode){
  const base = await baseDe(dataUrl, 1800);
  const corners = coinsFrac.map(p => ({x:p.x*base.width, y:p.y*base.height}));
  let result = warpPerspectiveCanvas(base, corners);
  result = enhanceScanCanvas(result, mode || 'auto');
  return result.toDataURL('image/jpeg', .95);
}
/* Sans recadrage : la photo est seulement contrastée et éclaircie. */
async function ameliorerSansRecadrer(dataUrl, mode){
  const base = await baseDe(dataUrl, 1800);
  const result = enhanceScanCanvas(base, mode || 'auto');
  return result.toDataURL('image/jpeg', .95);
}
function rotateDataUrl(dataUrl,deg){
  return new Promise((resolve,reject)=>{
    const img=new Image();img.onload=()=>{
      const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=img.height;c.height=img.width;
      ctx.translate(c.width/2,c.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(img,-img.width/2,-img.height/2);
      resolve(c.toDataURL('image/jpeg',.95));
    };img.onerror=reject;img.src=dataUrl;
  });
}
function stopScan(){ if(UI.scanStream){ UI.scanStream.getTracks().forEach(t=>t.stop()); UI.scanStream=null; } const v=$('scanVideo'); if(v) v.style.display='none'; }

/* Point d'entrée après une capture ou un import : tente la détection
   automatique des coins. Si elle échoue, ouvre directement le réglage
   manuel plutôt que de rendre une photo non recadrée sans le dire. */
async function traiterScan(raw){
  UI.scanRaw = raw;
  UI.scanImage = null; UI.scanAjust = false; UI.scanCorners = null;
  render();
  const st = () => $('scanStatus');
  if(st()) st().textContent = 'Analyse de la feuille…';
  let coins = null;
  try{ coins = await detecterCoinsFrac(raw); }catch(e){}
  if(coins){
    UI.scanCorners = coins;
    try{
      UI.scanImage = await redresserAvecCoins(raw, coins, 'auto');
      if(st()) st().textContent = 'Feuille détectée et redressée automatiquement. Ajuste les coins si le cadrage n\'est pas parfait.';
    }catch(e){
      UI.scanImage = raw;
      if(st()) st().textContent = 'Redressement impossible, photo brute conservée.';
    }
    render();
  } else {
    UI.scanCorners = coinsParDefaut();
    UI.scanAjust = true;
    if(st()) st().textContent = 'Feuille non détectée automatiquement — place les 4 points sur les coins de la feuille.';
    render();
  }
}
function ouvrirAjusteur(){
  if(!UI.scanRaw) return;
  if(!UI.scanCorners) UI.scanCorners = coinsParDefaut();
  UI.scanAjust = true; render();
}
async function validerCoins(){
  if(!UI.scanRaw || !UI.scanCorners) return;
  const st = $('scanStatus'); if(st) st.textContent = 'Recadrage en cours…';
  try{ UI.scanImage = await redresserAvecCoins(UI.scanRaw, UI.scanCorners, 'auto'); }
  catch(e){ toast('Recadrage impossible.'); }
  UI.scanAjust = false; render();
}
async function sansRecadrer(){
  if(!UI.scanRaw) return;
  try{ UI.scanImage = await ameliorerSansRecadrer(UI.scanRaw, 'auto'); }
  catch(e){ UI.scanImage = UI.scanRaw; }
  UI.scanAjust = false; render();
}
async function sauvegarderScan(){
  if(!UI.scanImage) return toast('Prends d\'abord une photo.');
  const cid = ($('scanChap') || {}).value || '';
  const blob = await (await fetch(UI.scanImage)).blob();
  const file = new File([blob], 'scan-' + today() + '-' + Date.now() + '.jpg', {type:'image/jpeg'});
  const meta = await storeFile(file);
  if(!meta) return;
  S.docs.push({id:uid(), mid:UI.mid, cid, nom:file.name, type:file.type, taille:file.size, file:meta, texte:'', source:'scanner'});
  UI.scanImage = null; stopScan(); save(); render();
  toast('Document enregistré dans ' + mat(UI.mid).nom + (cid && chap(cid) ? ' · ' + chap(cid).titre : '') + '.');
}

/* ===================== évènements ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if(!t) return;
  if(t.dataset.a === 'fermer' && e.target.closest('[data-stop]')) return;
  const a = t.dataset.a, i = t.dataset.i, v = t.dataset.v;
  const A = {
    fermer: () => fermer(),
    'fermer-btn': () => fermer(),
    mode: () => { UI.mode = i; render(); },
    tab: () => { UI.tab = i; render(); },
    chap: () => { UI.mode = 'chapitre'; UI.cid = i; UI.rep = null; UI.ordre = null; UI.tab = 'cours'; render(); },
    reviser: () => {
      UI.mode = 'chapitre'; UI.cid = i; UI.rep = null; UI.ordre = null; UI.tab = 'quiz';
      const c = chap(i), rates = c ? c.quiz.filter(q => q.last === 'ko').map(q => q.id) : [];
      if(c && rates.length) c.prog = {i:0, fini:false, serie:rates};
      render();
    },
    'mat-new': () => {
      const n = prompt('Nom de la matière');
      if(!n) return;
      const mm = {id:uid(), nom:n.trim()};
      S.matieres.push(mm); UI.mid = mm.id; UI.cid = ''; UI.mode = 'chapitre'; save(); render();
    },
    programme: () => modalProgramme(),
    documents: () => modalDocs(),
    reglages: () => modalReglages(),
    'prog-ok': () => {
      appliquerProgramme(UI.mid, parseProgramme(UI.prog));
      const cs = chapsDe(UI.mid);
      UI.cid = cs.length ? cs[0].id : ''; UI.mode = 'chapitre';
      fermer(); render(); toast('Programme enregistré.');
    },
    gen: () => genererChapitre(i),
    'gen-mat': () => genererMatiere(UI.mid),
    acquis: () => { const c = chap(i); c.acquis = !c.acquis; save(); render(); },
    rep: () => repondre(+i),
    suivant: () => {
      const c = chap(i);
      const serie = (c.prog.serie && c.prog.serie.length) ? c.prog.serie : c.quiz.map(q => q.id);
      c.prog.i = (c.prog.i || 0) + 1;
      if(c.prog.i >= serie.length) c.prog.fini = true;
      UI.rep = null; UI.ordre = null; save(); render();
    },
    'quiz-reset': () => { const c = chap(i); c.prog = {i:0, fini:false, serie:c.quiz.map(q => q.id)}; UI.rep = null; save(); render(); },
    'quiz-rates': () => {
      const c = chap(i), r = c.quiz.filter(q => q.last === 'ko').map(q => q.id);
      if(!r.length) return;
      c.prog = {i:0, fini:false, serie:r}; UI.rep = null; UI.tab = 'quiz'; save(); render();
    },
    'ret-form': () => { UI.ouvert.ret = true; render(); },
    'ret-del': () => { const c = chap(i); c.retenir = c.retenir.filter(x => x.id !== v); save(); render(); },
    'doc-open': () => { const d = S.docs.find(x => x.id === i); if(d) ouvrir(d.file); },
    'doc-del': () => { S.docs = S.docs.filter(x => x.id !== i); save(); modalDocs(); render(); },
    'eval-add': () => modalEval(),
    'eval-del': () => { S.evaluations = (S.evaluations || []).filter(x => x.id !== i); save(); render(); },
    'scan-start': async () => {
      try{
        if(UI.scanStream) return;
        UI.scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
        const vv = $('scanVideo'); if(vv){ vv.style.display = 'block'; vv.srcObject = UI.scanStream; await vv.play(); }
        toast('Caméra activée.');
      }catch(err){ toast('Caméra indisponible ici : utilise « Importer une photo ».'); }
    },
    'scan-capture': async () => {
      const vv = $('scanVideo'), cc = $('scanCanvas');
      if(!vv || !vv.videoWidth) return toast('Active d\'abord la caméra, ou importe une photo.');
      cc.width = vv.videoWidth; cc.height = vv.videoHeight; cc.getContext('2d').drawImage(vv, 0, 0, cc.width, cc.height);
      await traiterScan(cc.toDataURL('image/jpeg', 0.94));
    },
    'scan-rot-l': async () => { if(!UI.scanImage) return; UI.scanImage = await rotateDataUrl(UI.scanImage, -90); const p = $('scanPreview'); if(p) p.src = UI.scanImage; },
    'scan-rot-r': async () => { if(!UI.scanImage) return; UI.scanImage = await rotateDataUrl(UI.scanImage, 90); const p = $('scanPreview'); if(p) p.src = UI.scanImage; },
    'scan-save': () => sauvegarderScan(),
    'scan-stop': () => { stopScan(); toast('Caméra arrêtée.'); },
    'scan-ajuster': () => ouvrirAjusteur(),
    'scan-valider': () => validerCoins(),
    'scan-sans-recadrer': () => sansRecadrer(),
    'scan-annuler-ajust': () => { UI.scanAjust = false; if(!UI.scanImage) UI.scanImage = UI.scanRaw; render(); },
    export: () => {
      const b = new Blob([JSON.stringify(S)], {type:'application/json'});
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(b);
      a2.download = 'classeur-' + today() + '.json'; a2.click();
      setTimeout(() => URL.revokeObjectURL(a2.href), 1500);
    },
    import: () => $('importFile').click()
  };
  if(A[a]){ e.preventDefault(); A[a](); }
});

function repondre(k){
  const c = chap(UI.cid);
  if(!c || UI.rep != null) return;
  const serie = (c.prog.serie && c.prog.serie.length) ? c.prog.serie : c.quiz.map(q => q.id);
  const q = c.quiz.find(x => x.id === serie[c.prog.i || 0]);
  if(!q) return;
  UI.rep = k;
  if(k === q.bonne){ q.ok = (q.ok || 0) + 1; q.last = 'ok'; }
  else { q.ko = (q.ko || 0) + 1; q.last = 'ko'; c.acquis = false; }
  save(); render();
}

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.a === 'mat'){ UI.mid = t.value; UI.cid = ''; UI.mode = 'chapitre'; render(); return; }
  if(t.dataset.a === 'doc-chap'){
    const d = S.docs.find(x => x.id === t.dataset.i);
    if(d){ d.cid = t.value; save(); render(); }
    return;
  }
  if(t.id === 'docFile' && t.files.length){ chargerDocs(t.files); t.value = ''; return; }
  if(t.id === 'scanFile' && t.files.length){
    toDataURL(t.files[0]).then(raw => traiterScan(raw));
    t.value = ''; return;
  }
  if(t.id === 'progFile' && t.files.length){
    extraireTexte(t.files[0]).then(txt => {
      if(!txt) return toast('Fichier illisible : copie-colle le texte.');
      UI.prog = txt; modalProgramme();
    });
    t.value = '';
  }
});

document.addEventListener('submit', async e => {
  const f = e.target;
  if(!f.dataset.f) return;
  e.preventDefault();
  const d = {};
  new FormData(f).forEach((v,k) => { d[k] = typeof v === 'string' ? v.trim() : v; });
  const type = f.dataset.f;
  if(type === 'prog'){ UI.prog = d.txt; modalProgramme(); return; }
  if(type === 'ret'){
    const c = chap(d.cid);
    c.retenir.push({id:uid(), k:d.k, texte:d.texte});
    UI.ouvert.ret = false; save(); render(); return;
  }
  if(type === 'eval'){
    S.evaluations = S.evaluations || [];
    S.evaluations.push({id:uid(), mid:d.mid, titre:d.titre, type:d.type, score:d.score, max:d.max || 20, chap:d.chap || ''});
    save(); fermer(); render(); toast('Note enregistrée.'); return;
  }
  if(type === 'reg'){
    S.eleve.prenom = d.prenom; S.eleve.classe = d.classe; S.eleve.profil = d.profil; S.cle = d.cle || '';
    save(); fermer(); render(); toast('Enregistré.'); return;
  }
  if(type === 'fb'){
    try{
      let t = (d.cfg || '').trim();
      /* Si le bloc entier de Firebase (imports, commentaires, initializeApp...)
         a été collé, on isole d'abord le seul objet firebaseConfig. */
      const m = t.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})\s*;/);
      if(m) t = m[1];
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      if(a < 0) throw 0;
      t = t.slice(a, b + 1)
        .replace(/\/\/.*$/gm, '')
        .replace(/([{,\s])([A-Za-z0-9_]+)\s*:/g, '$1"$2":')
        .replace(/'/g,'"')
        .replace(/,\s*}/g,'}');
      const cfg = JSON.parse(t);
      if(!cfg.apiKey || !cfg.projectId) throw 0;
      cfg.code = (d.code || 'classeur').trim();
      S.fb = cfg; save(); fermer();
      CLOUD.init(); toast('Firebase branché.');
    }catch(err){ toast('Configuration illisible : colle l\'objet firebaseConfig (ou le bloc entier, ça marche aussi).'); }
  }
});

$('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o.matieres) throw 0;
      if(!confirm('Remplacer le contenu actuel ?')) return;
      S = migrer(o); UI.mid = S.matieres[0] ? S.matieres[0].id : ''; UI.cid = ''; UI.mode = 'chapitre';
      save(); render(); toast('Restauré.');
    }catch(err){ toast('Fichier non reconnu.'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

render();
if(typeof CLOUD !== 'undefined') CLOUD.init();

</script>
