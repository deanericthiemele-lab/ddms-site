<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi 2nd</title>
<style>
  :root{
    --bg:#FAFAF7;
    --panel:#FFFFFF;
    --border:#E4E1D9;
    --text:#1E1E1C;
    --muted:#8A8578;
    --accent:#FF7900;
    --accent-soft:#FFF1E2;
    --ok:#2F7A3D;
    --ok-soft:#EAF4EA;
    --warn:#B4472B;
    --warn-soft:#FBEBE5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:32px 28px 20px;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:14px;
  }
  main{
    max-width:1180px;
    margin:0 auto;
    padding:24px 20px 60px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr;}
  }
  section.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    min-height:420px;
  }
  .card-head{
    padding:18px 18px 14px;
    border-bottom:1px solid var(--border);
  }
  .card-head h2{
    margin:0;
    font-size:16px;
    font-weight:600;
  }
  .card-head span{
    display:block;
    margin-top:3px;
    font-size:12.5px;
    color:var(--muted);
  }
  .list{
    padding:8px 10px;
    flex:1;
    overflow-y:auto;
    max-height:420px;
  }
  .empty{
    padding:24px 12px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .item{
    padding:11px 10px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .item:last-child{border-bottom:none;}
  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .item-title{
    font-size:14px;
    font-weight:600;
    line-height:1.3;
  }
  .item-sub{
    font-size:12.5px;
    color:var(--muted);
  }
  .item-desc{
    font-size:13px;
    color:#4A473F;
    line-height:1.4;
  }
  .item-actions{
    display:flex;
    gap:6px;
    align-items:center;
    flex-shrink:0;
  }
  .pill{
    font-size:11.5px;
    padding:3px 8px;
    border-radius:20px;
    cursor:pointer;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .pill.todo{background:var(--accent-soft);color:var(--accent);}
  .pill.done{background:var(--ok-soft);color:var(--ok);}
  .prio{
    font-size:11.5px;
    padding:3px 8px;
    border-radius:20px;
  }
  .prio.faible{background:var(--ok-soft);color:var(--ok);}
  .prio.moyen{background:var(--accent-soft);color:var(--accent);}
  .prio.fort{background:var(--warn-soft);color:var(--warn);}
  .del{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:2px 4px;
  }
  .del:hover{color:var(--warn);}
  .link{
    font-size:12.5px;
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
  }
  .link:hover{text-decoration:underline;}
  .add-form{
    padding:14px 16px 16px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .add-form input[type=text],
  .add-form input[type=date],
  .add-form textarea,
  .add-form select{
    width:100%;
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 10px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
  }
  .add-form textarea{resize:vertical;min-height:44px;}
  .row2{display:flex;gap:8px;}
  .row2 > *{flex:1;}
  .file-input{
    font-size:12.5px;
    color:var(--muted);
  }
  .file-input input{font-size:12.5px;}
  button.submit{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 12px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  button.submit:hover{opacity:0.92;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<header>
  <h1>Suivi 2nd</h1>
  <p>Devoirs, cours et points de vigilance — mis à jour en local sur cet appareil.</p>
</header>

<main>

  <!-- COURS -->
  <section class="card">
    <div class="card-head">
      <h2>Cours</h2>
      <span>Documents de cours par matière</span>
    </div>
    <div class="list" id="listCours"></div>
    <form class="add-form" id="formCours">
      <input type="text" id="coursMatiere" placeholder="Matière" required>
      <input type="text" id="coursTitre" placeholder="Titre du cours (ex : Chapitre 3 - Fonctions)">
      <div class="file-input"><input type="file" id="coursFile"></div>
      <button type="submit" class="submit">Ajouter le cours</button>
    </form>
  </section>

  <!-- DEVOIRS -->
  <section class="card">
    <div class="card-head">
      <h2>Devoirs</h2>
      <span>Ajouter et suivre les devoirs réalisés</span>
    </div>
    <div class="list" id="listDevoirs"></div>
    <form class="add-form" id="formDevoirs">
      <input type="text" id="devMatiere" placeholder="Matière" required>
      <textarea id="devDesc" placeholder="Description du devoir"></textarea>
      <div class="row2">
        <input type="date" id="devDate">
        <div class="file-input"><input type="file" id="devFile"></div>
      </div>
      <button type="submit" class="submit">Ajouter le devoir</button>
    </form>
  </section>

  <!-- REVISIONS -->
  <section class="card">
    <div class="card-head">
      <h2>Révisions</h2>
      <span>Points à travailler en priorité</span>
    </div>
    <div class="list" id="listFaiblesses"></div>
    <form class="add-form" id="formFaiblesses">
      <input type="text" id="faibMatiere" placeholder="Matière" required>
      <textarea id="faibDesc" placeholder="Ce qui pose difficulté"></textarea>
      <select id="faibPrio">
        <option value="faible">Vigilance faible</option>
        <option value="moyen" selected>Vigilance moyenne</option>
        <option value="fort">Vigilance forte</option>
      </select>
      <button type="submit" class="submit">Ajouter</button>
    </form>
  </section>

</main>

<script>
  const store = {
    get(key){ try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; } },
    set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
  };

  function fmtDate(d){
    if(!d) return '';
    const parts = d.split('-');
    if(parts.length !== 3) return d;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  window.downloadFile = async function(storeKey, index){
    const items = store.get(storeKey);
    const file = items[index] && items[index].file;
    if(!file) return;
    try{
      const res = await fetch(file.data);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }catch(e){
      window.open(file.data, '_blank');
    }
  }

  function readFile(input){
    return new Promise((resolve) => {
      const f = input.files[0];
      if(!f){ resolve(null); return; }
      const reader = new FileReader();
      reader.onload = () => resolve({ name: f.name, data: reader.result });
      reader.readAsDataURL(f);
    });
  }

  /* ---------- DEVOIRS ---------- */
  function renderDevoirs(){
    const items = store.get('devoirs_2nd');
    const el = document.getElementById('listDevoirs');
    if(items.length === 0){ el.innerHTML = '<div class="empty">Aucun devoir enregistré</div>'; return; }
    items.sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999'));
    el.innerHTML = items.map((it, i) => `
      <div class="item">
        <div class="item-top">
          <div>
            <div class="item-title">${it.matiere}</div>
            ${it.date ? `<div class="item-sub">Pour le ${fmtDate(it.date)}</div>` : ''}
          </div>
          <div class="item-actions">
            <span class="pill ${it.done ? 'done' : 'todo'}" onclick="toggleDevoir(${i})">${it.done ? 'Fait' : 'À faire'}</span>
            <button class="del" onclick="delDevoir(${i})" title="Supprimer">✕</button>
          </div>
        </div>
        ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ''}
        ${it.file ? `<a class="link" href="javascript:void(0)" onclick="downloadFile('devoirs_2nd', ${i})">${it.file.name}</a>` : ''}
      </div>
    `).join('');
  }
  window.toggleDevoir = function(i){
    const items = store.get('devoirs_2nd');
    items[i].done = !items[i].done;
    store.set('devoirs_2nd', items);
    renderDevoirs();
  }
  window.delDevoir = function(i){
    const items = store.get('devoirs_2nd');
    items.splice(i,1);
    store.set('devoirs_2nd', items);
    renderDevoirs();
  }
  document.getElementById('formDevoirs').addEventListener('submit', async (e) => {
    e.preventDefault();
    const matiere = document.getElementById('devMatiere').value.trim();
    const desc = document.getElementById('devDesc').value.trim();
    const date = document.getElementById('devDate').value;
    const fileInput = document.getElementById('devFile');
    const file = await readFile(fileInput);
    if(!matiere) return;
    const items = store.get('devoirs_2nd');
    items.push({ matiere, desc, date, file, done:false });
    store.set('devoirs_2nd', items);
    e.target.reset();
    renderDevoirs();
  });

  /* ---------- COURS ---------- */
  function renderCours(){
    const items = store.get('cours_2nd');
    const el = document.getElementById('listCours');
    if(items.length === 0){ el.innerHTML = '<div class="empty">Aucun cours ajouté</div>'; return; }
    el.innerHTML = items.map((it, i) => `
      <div class="item">
        <div class="item-top">
          <div>
            <div class="item-title">${it.matiere}</div>
            ${it.titre ? `<div class="item-sub">${it.titre}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="del" onclick="delCours(${i})" title="Supprimer">✕</button>
          </div>
        </div>
        ${it.file ? `<a class="link" href="javascript:void(0)" onclick="downloadFile('cours_2nd', ${i})">${it.file.name}</a>` : '<div class="item-sub">Aucun fichier joint</div>'}
      </div>
    `).join('');
  }
  window.delCours = function(i){
    const items = store.get('cours_2nd');
    items.splice(i,1);
    store.set('cours_2nd', items);
    renderCours();
  }
  document.getElementById('formCours').addEventListener('submit', async (e) => {
    e.preventDefault();
    const matiere = document.getElementById('coursMatiere').value.trim();
    const titre = document.getElementById('coursTitre').value.trim();
    const fileInput = document.getElementById('coursFile');
    const file = await readFile(fileInput);
    if(!matiere) return;
    const items = store.get('cours_2nd');
    items.push({ matiere, titre, file });
    store.set('cours_2nd', items);
    e.target.reset();
    renderCours();
  });

  /* ---------- FAIBLESSES ---------- */
  const prioLabel = { faible:'Faible', moyen:'Moyenne', fort:'Forte' };
  function renderFaiblesses(){
    const items = store.get('faiblesses_2nd');
    const el = document.getElementById('listFaiblesses');
    if(items.length === 0){ el.innerHTML = '<div class="empty">Aucune révision notée</div>'; return; }
    const order = { fort:0, moyen:1, faible:2 };
    items.sort((a,b) => order[a.prio] - order[b.prio]);
    el.innerHTML = items.map((it, i) => `
      <div class="item">
        <div class="item-top">
          <div class="item-title">${it.matiere}</div>
          <div class="item-actions">
            <span class="prio ${it.prio}">${prioLabel[it.prio]}</span>
            <button class="del" onclick="delFaiblesse(${i})" title="Supprimer">✕</button>
          </div>
        </div>
        ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ''}
      </div>
    `).join('');
  }
  window.delFaiblesse = function(i){
    const items = store.get('faiblesses_2nd');
    items.splice(i,1);
    store.set('faiblesses_2nd', items);
    renderFaiblesses();
  }
  document.getElementById('formFaiblesses').addEventListener('submit', (e) => {
    e.preventDefault();
    const matiere = document.getElementById('faibMatiere').value.trim();
    const desc = document.getElementById('faibDesc').value.trim();
    const prio = document.getElementById('faibPrio').value;
    if(!matiere) return;
    const items = store.get('faiblesses_2nd');
    items.push({ matiere, desc, prio });
    store.set('faiblesses_2nd', items);
    e.target.reset();
    document.getElementById('faibPrio').value = 'moyen';
    renderFaiblesses();
  });

  renderDevoirs();
  renderCours();
  renderFaiblesses();
</script>

</body>
</html>
