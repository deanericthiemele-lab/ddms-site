.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px;}

.zone.selected{stroke:#ff7900;stroke-width:2.5;}
.lbl{font-size:11px;fill:#222;pointer-events:none;text-anchor:middle;font-weight:bold;}
.lbl2{font-size:10px;fill:#444;pointer-events:none;text-anchor:middle;}
.water{fill:#e8f2fb;}
.watertxt{font-size:12px;fill:#7aa;font-style:italic;pointer-events:none;text-anchor:middle;}

#tooltip td{padding:2px 6px;border-bottom:1px solid #eee;}
#tooltip td.num{text-align:right;}
.side{flex:0 0 420px;max-width:100%;}
table.data{border-collapse:collapse;width:100%;}
table.data th,table.data td{border:1px solid #ccc;padding:5px 7px;font-size:12px;}
table.data th{background:#f2f2f2;}
table.data td.num{text-align:right;}
table.data tr.sel td{background:#fff3e6;}
table.data tr{cursor:pointer;}
.legend{font-size:11px;color:#555;margin-top:6px;}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
.kpi div{border:1px solid #ccc;border-radius:6px;padding:6px 12px;background:#fff;}

@media print{button,select,.topbar .right{display:none;}}

 {id:"Bingerville",d:"M790,200 L920,260 L920,520 L800,520 Z"},
 {id:"Treichville",d:"M410,620 L530,620 L530,720 L410,720 Z"},
 {id:"Marcory",    d:"M530,620 L660,620 L660,720 L530,720 Z"},
 {id:"Koumassi",   d:"M660,620 L800,620 L800,720 L660,720 Z"},
 {id:"Port-Bouët", d:"M410,760 L920,760 L920,880 L410,880 Z"}
];

/* ===== Reconnaissance des localisations ===== */
const COMMUNES={
 "Cocody":["COCODY","COC","RIVIERA","RIV","RIV4","ANGRE","PALMERAIE","DANGA","VALLON","VALLONS","2 PLATEAU","2PLATEAUX","2 PLATEAUX","DEUX PLATEAUX","2 PLTX","2PLTX","MERMOZ","AKOUEDO","ABATTA","M'BADON","BONOUMIN","INADES","7EM TRANCHE","GOLF"],
 "Plateau":["PLATEAU","PLTX"],
 "Treichville":["TREICHVILLE","TREICHEVILLE","TRV"],
 "Marcory":["MARCORY","ZONE 4","ZONE4","BIETRY"],
 "Koumassi":["KOUMASSI"],
 "Port-Bouët":["PORT BOUET","PORT-BOUET","PORT-POUET","VRIDI"],
 "Yopougon":["YOPOUGON","PK23","PK24"],
 "Abobo":["ABOBO","PK18"],
 "Adjamé":["ADJAME","WILLIAMSVILLE","WILLIAMCIVILLE"],
 "Attécoubé":["ATTECOUBE"],
 "Bingerville":["BINGERVILLE","BING"],
 "Anyama":["ANYAMA","ATTINGUIE"],
 "Songon":["SONGON"]
};
const VILLES={
 "Lagunes":["ABIDJAN","ABJ","ABD","DABOU","GRAND LAHOU","JACQUEVILLE"],
 "Sud-Comoé":["BASSAM","VITIB","BONOUA","ABOISSO","ADIAKE","MONDOUKOU","YAOU"],
 "Agnéby":["AGBOVILLE","ADZOPE"],
 "Vallée du Bandama":["BOUAKE","BKE","KATIOLA","DJEBONOUA","DABAKALA"],
 "Savanes":["KORHOGO","FERKE","BOUNDIALI","TENGRELA","KOUTO","KONG"],
 "Zanzan":["BONDOUKOU","BOUNA","TANDA"],
 "Bas-Sassandra":["SAN PEDRO","SAN-PEDRO","SANPEDRO","SASSANDRA","SOUBRE","TABOU"],
 "Lacs":["YAKRO","YAMOUSSOUKRO","TOUMODI","TAABO"],
 "N'zi-Comoé":["DIMBOKRO","BONGOUANOU","M'BAHIAKRO","OUELLE"],
 "Haut-Sassandra":["DALOA","ISSIA"],
 "Marahoué":["BOUAFLE"],
 "Fromager":["GAGNOA"],
 "Sud-Bandama":["DIVO"],
 "Dix-Huit Montagnes":["MAN","DANANE"],
 "Moyen-Comoé":["ABENGOUROU","ABENG","AGNIBLEKRO"],
 "Denguélé":["ODIENNE","GBELEBAN","GOULIA"],
 "Bafing":["TOUBA"],
 "Worodougou":["SEGUELA","MANKONO"],
 "Cavally":["GUIGLO","TOULEPLEU"]
};
function norm(s){
 return String(s||"").toUpperCase().replace(/\u00a0/g," ").replace(/’/g,"'")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
function hasKw(txt,kw){
 const k=kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
 return new RegExp("(^|[^A-Z0-9])"+k+"([^A-Z0-9]|$)").test(txt);
}
function localiser(loc){
 let t=norm(loc);
 if(t.includes(">")){ const parts=t.split(">").map(x=>x.trim()).filter(Boolean); t=parts[parts.length-1]||t; }
 for(const [c,kws] of Object.entries(COMMUNES)){ for(const k of kws){ if(hasKw(t,k)) return {commune:c,region:"Lagunes"}; } }
 for(const [r,kws] of Object.entries(VILLES)){ for(const k of kws){ if(hasKw(t,k)) return {commune:null,region:r}; } }
 return {commune:null,region:null};
}

/* ===== Données ===== */
let allRows=[], view="ci", selectedZone=null;

function parseDate(v){
 if(!v) return null;
 if(v instanceof Date) return isNaN(v)?null:v;
 if(typeof v==="number"){ const p=XLSX.SSF.parse_date_code(v); return p?new Date(p.y,p.m-1,p.d):null; }
 const d=new Date(v); return isNaN(d)?null:d;
}
function loadExcel(){
 return fetch("Input.xlsx?v="+Date.now()).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.arrayBuffer(); }).then(b=>{
  const wb=XLSX.read(b,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const headers=raw[0].map(h=>String(h).replace(/\s+/g," ").trim());
  const iLoc=headers.indexOf("Localisation"), iProd=headers.indexOf("Libéllé Produit"),
        iTot=headers.indexOf("Total"), iMes=headers.indexOf("Date MES & MEF"),
        iCre=headers.indexOf("Date de création"), iCli=headers.indexOf("Client");
  allRows=raw.slice(1).filter(r=>r.some(c=>c!=="")).map(r=>{
   const d=parseDate(r[iMes])||parseDate(r[iCre]);
   const z=localiser(r[iLoc]);
   return {client:r[iCli],produit:String(r[iProd]||"").trim()||"(vide)",loc:r[iLoc],
           total:typeof r[iTot]==="number"?r[iTot]:0,annee:d?d.getFullYear():null,
           commune:z.commune,region:z.region};
  });
  fillSelects();
 });
}
function fillSelects(){
 const years=[...new Set(allRows.map(r=>r.annee).filter(Boolean))].sort((a,b)=>b-a);
 const ys=document.getElementById("anneeSelect");
 ys.innerHTML='<option value="">Toutes</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join("");
 if(years.length) ys.value=years[0];
 const prods=[...new Set(allRows.map(r=>r.produit))].sort();
 document.getElementById("produitSelect").innerHTML='<option value="">Tous</option>'+prods.map(p=>`<option>${p}</option>`).join("");
}
function filteredRows(){
 const y=document.getElementById("anneeSelect").value, p=document.getElementById("produitSelect").value;
 return allRows.filter(r=>(!y||String(r.annee)===y)&&(!p||r.produit===p));
}
/* agrégation par zone */
function aggregate(){
 const rows=filteredRows();
 const key=view==="abj"?"commune":"region";
 const agg={}; let unloc=0;
 rows.forEach(r=>{
  if(view==="abj" && r.region!=="Lagunes") return;
  const k=r[key];
  if(!k){ unloc++; return; }
  agg[k]=agg[k]||{n:0,total:0,prod:{}};
  agg[k].n++; agg[k].total+=r.total;
  agg[k].prod[r.produit]=agg[k].prod[r.produit]||{n:0,total:0};
  agg[k].prod[r.produit].n++; agg[k].prod[r.produit].total+=r.total;
 });
 return {agg,unloc,rows};
}

/* ===== Rendu ===== */
const fmt=n=>Math.round(n).toLocaleString("fr-FR");
function color(v,max){
 if(!v) return "#e6e6e6";
 const t=Math.sqrt(v/max);            /* 0 = faible, 1 = fort */
 /* dégradé vert : #e5f5e0 (faible) -> #006d2c (fort) */
 const r=Math.round(229-(229-0)*t), g=Math.round(245-(245-109)*t), b=Math.round(224-(224-44)*t);
 return `rgb(${r},${g},${b})`;
}
function render(){
 const {agg,unloc,rows}=aggregate();
 const zones=view==="abj"?ABJ:REGIONS;
 const max=Math.max(1,...Object.values(agg).map(a=>a.n));
 const svg=document.getElementById("map");
 let s="";
 if(view==="abj"){
  s+='<rect class="water" x="0" y="0" width="940" height="940"/>';
  s+='<text class="watertxt" x="640" y="590">Lagune Ébrié</text><text class="watertxt" x="660" y="920">Océan Atlantique</text>';
 }
 zones.forEach(z=>{
  const a=agg[z.id];
  s+=`<path class="zone${selectedZone===z.id?' selected':''}" data-id="${z.id}" d="${z.d}" fill="${color(a?a.n:0,max)}"/>`;
 });
 zones.forEach(z=>{
  const a=agg[z.id]; let cx=z.cx,cy=z.cy;
  if(cx===undefined){ const m=z.d.match(/-?[\d.]+,-?[\d.]+/g).map(p=>p.split(",").map(Number)); cx=m.reduce((t,p)=>t+p[0],0)/m.length; cy=m.reduce((t,p)=>t+p[1],0)/m.length; }
  s+=`<text class="lbl" x="${cx}" y="${cy}">${z.id}</text>`;
  if(a) s+=`<text class="lbl2" x="${cx}" y="${cy+13}">${a.n} dossier(s)</text>`;
 });
 svg.innerHTML=s;
 svg.querySelectorAll(".zone").forEach(p=>{
  p.addEventListener("mousemove",e=>showTip(e,p.dataset.id,agg[p.dataset.id]));
  p.addEventListener("mouseleave",hideTip);
  p.addEventListener("click",()=>{ selectedZone=selectedZone===p.dataset.id?null:p.dataset.id; render(); });
 });
 /* KPI + titre */
 const n=rows.filter(r=>view!=="abj"||r.region==="Lagunes").length;
 document.getElementById("kpiN").textContent=fmt(n);
 document.getElementById("kpiZ").textContent=Object.keys(agg).length;
 document.getElementById("kpiU").textContent=unloc;
 const y=document.getElementById("anneeSelect").value||"toutes années";
 document.getElementById("titre").textContent=(view==="abj"?"Abidjan – production par commune":"Côte d'Ivoire – production par région")+" ("+y+")";
 renderTable(agg,zones);
}
function showTip(e,id,a){
 const tip=document.getElementById("tooltip");
 let h=`<b>${id}</b>`;
 if(!a){ h+="<div style='color:#888;margin-top:4px'>Aucune production</div>"; }
 else{
  h+=`<div><b>${a.n} dossier(s)</b></div><table>`;
  Object.entries(a.prod).sort((x,y)=>y[1].n-x[1].n).forEach(([p,d])=>{ h+=`<tr><td>${p}</td><td class="num">${d.n}</td></tr>`; });
  h+="</table>";
 }
 tip.innerHTML=h; tip.style.display="block";
 const box=tip.parentElement.getBoundingClientRect();
 let x=e.clientX-box.left+14, yy=e.clientY-box.top+14;
 if(x+tip.offsetWidth>box.width) x-=tip.offsetWidth+28;
 tip.style.left=x+"px"; tip.style.top=yy+"px";
}
function hideTip(){ document.getElementById("tooltip").style.display="none"; }

function renderTable(agg,zones){
 const prods=[...new Set(Object.values(agg).flatMap(a=>Object.keys(a.prod)))].sort();
 document.getElementById("thZones").innerHTML="<th>"+(view==="abj"?"Commune":"Région")+"</th><th>Dossiers</th>"+prods.map(p=>`<th>${p}</th>`).join("");
 const tb=document.querySelector("#tableZones tbody");
 const list=Object.entries(agg).sort((x,y)=>y[1].n-x[1].n);
 tb.innerHTML=list.map(([k,a])=>`<tr data-id="${k}" class="${selectedZone===k?'sel':''}"><td>${k}</td><td class="num">${a.n}</td>`+
   prods.map(p=>`<td class="num">${a.prod[p]?a.prod[p].n:""}</td>`).join("")+"</tr>").join("")
  +(list.length?`<tr style="font-weight:bold"><td>TOTAL</td><td class="num">${list.reduce((t,x)=>t+x[1].n,0)}</td>${prods.map(()=>"<td></td>").join("")}</tr>`:"<tr><td colspan='2'>Aucune donnée</td></tr>");
 tb.querySelectorAll("tr[data-id]").forEach(tr=>tr.addEventListener("click",()=>{ selectedZone=selectedZone===tr.dataset.id?null:tr.dataset.id; render(); }));
}

function setView(v){
 view=v; selectedZone=null;
 document.getElementById("btnCI").classList.toggle("active",v==="ci");
 document.getElementById("btnABJ").classList.toggle("active",v==="abj");
 render();
}
function exportExcel(){
 const {agg,rows}=aggregate();
 if(!Object.keys(agg).length){ alert("Aucune donnée à exporter"); return; }
 const key=view==="abj"?"Commune":"Région";
 const data=Object.entries(agg).sort((x,y)=>y[1].n-x[1].n).map(([k,a])=>{
  const o={}; o[key]=k; o["Dossiers"]=a.n;
  Object.entries(a.prod).forEach(([p,d])=>{ o[p]=d.n; });
  return o;
 });
 const detail=rows.filter(r=>view!=="abj"||r.region==="Lagunes").map(r=>({Client:r.client,"Libéllé Produit":r.produit,Localisation:r.loc,Région:r.region||"Non localisé",Commune:r.commune||"",Année:r.annee}));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"Par zone");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detail),"Détail");
 XLSX.writeFile(wb,"export_map_"+(view==="abj"?"abidjan":"ci")+".xlsx");
}
function refreshData(){
 document.getElementById("produitSelect").value=""; selectedZone=null;
 loadExcel().then(render);
}
document.getElementById("anneeSelect").addEventListener("change",render);
document.getElementById("produitSelect").addEventListener("change",render);
loadExcel().then(render).catch(e=>{ document.getElementById("titre").textContent="Erreur chargement Input.xlsx : "+e; });
</script>
