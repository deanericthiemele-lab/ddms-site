let migSeedBusy=false;
function migSeedKey(t){
  return ((migGet(t,'source')||'CIC')+'|'+migGet(t,'ref')+'|'+String(migGet(t,'client')||'').slice(0,60))
    .toUpperCase().replace(/\s+/g,' ').trim();
}
async function migLoadSeed(p,{silent=false}={}){
  if(migSeedBusy || !p) return;
  migSeedBusy=true;
  if(!p.taches) p.taches=[];
  const existing=new Map(p.taches.map((t,i)=>[migSeedKey(t),i]));
  let added=0, updated=0;
  MIG_SEED.forEach(o=>{
    const line={...o};
    const ix=existing.get(migSeedKey(line));
    if(ix===undefined){ p.taches.push(line); added++; }
    else { p.taches[ix]={...p.taches[ix],...line}; updated++; }
  });
  p.migSeeded=true;
  JOURNAL_OFF=true;
  try{
    await fsSave(p);
    renderProjet(); renderSidebar();
    if(!silent) toast(`Données ROA chargées : ${added} ajoutée(s), ${updated} mise(s) à jour ✓`,'success');
    else toast(`${added} lignes de migration chargées ✓`,'success');
  }catch(e){ toast('Erreur chargement : '+e.message,'error'); }
  JOURNAL_OFF=false;
  migSeedBusy=false;
}

// Compat anciennes lignes (nd / raisonSociale)
function migGet(t,k){
  if(k==='ref')    return t.ref    ?? t.nd ?? '';
  if(k==='client') return t.client ?? t.raisonSociale ?? '';
  return t[k] ?? '';
}
const migNorm = v => String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function migNormStatut(v){
  const k=migNorm(v);
  if(!k) return 'Non migré';
  if(/^non/.test(k)) return 'Non migré';
  if(/termin|^migre|realise|traite|^fait|cloture|^ok$|livre/.test(k)) return 'Migré';
  if(/cours|wip|encours/.test(k)) return 'En cours';
  if(/report|suspend|annul|bloq|ko/.test(k)) return 'Reporté';
  if(/planif|prevu|programm/.test(k)) return 'Planifié';
  return 'Non migré';
}
function migDays(a,b){
  if(!a||!b) return null;
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  if(isNaN(d1)||isNaN(d2)) return null;
  return Math.round((d2-d1)/86400000);
}
const isDoneStatut = t => t.statut==='Terminé' || t.statut==='Migré';

const JCOL='projets_journal';
const SNAP={};                       // snapshot du dernier état sauvegardé par projet
const clone=o=>JSON.parse(JSON.stringify(o||null));
function snapSet(p){ SNAP[p.id]=clone(p); }
const J_PROJ_FIELDS={nom:'Nom',chefProjet:'Chef de projet',budget:'Budget',dateDebut:'Date début',dateFin:'Date fin',statut:'Statut',priorite:'Priorité',problematique:'Problématique',objectifs:'Objectifs',description:'Description',membres:'Membres'};
const J_TACHE_FIELDS={titre:'Nom',objectif:'Objectif',volume:'Volume',realise:'Réalisé',porteur:'Porteur',dateDebut:'Début',dateFin:'Fin',statut:'Statut',description:'Commentaire',nd:'ND',raisonSociale:'Raison sociale',dateMigPrevue:'Délai contractuel (prévu)',dateMigEffective:'Date de fin / migration',ref:'Référence / OT',client:'Client / Objet',source:'Source',categorie:'Catégorie TOP',cluster:'Cluster',site:'Site client',localisation:'Localisation',gc:'GC',sla:'SLA travaux',superviseur:'Superviseur',contact:'Contact',dateReception:'Date de réception',dateAttribution:'Date attribution',dateDemarrage:'Date de démarrage',dateSuspension:'Date de suspension',dateReprise:'Date de reprise travaux',etatSi:'État SI',observation:'Observation'};
const J_PDA_FIELDS={date:'Date',client:'Client',reference:'Référence',produit:'Produit',localisation:'Localisation',recurrent:'Récurrent',typeSite:'Type de site',dateConstruction:'Date construction',techno:'Techno',cause:'Cause',statut:'Statut'};
const jv=v=>Array.isArray(v)?v.join(', '):(v===undefined||v===null?'':String(v));
const tKey=t=>((t.ref||t.nd||t.titre||'')+'|'+(t.client||t.raisonSociale||'')).trim().toUpperCase();
const lKey=l=>((l.reference||'')+'|'+(l.client||'')+'|'+(l.date||'')).trim().toUpperCase();

function matchLists(before,after,keyFn){
  // apparie les éléments par clé (occurrences multiples gérées) ; retourne {pairs:[[b,a]], added:[a], removed:[b]}
  const bm={}; before.forEach(b=>{ const k=keyFn(b); (bm[k]=bm[k]||[]).push(b); });
  const pairs=[],added=[];
  after.forEach(a=>{ const k=keyFn(a); if(bm[k]&&bm[k].length){ pairs.push([bm[k].shift(),a]); } else added.push(a); });
  const removed=[].concat(...Object.values(bm));
  return {pairs,added,removed};
}
function diffFields(b,a,labels,base){
  const out=[];
  Object.entries(labels).forEach(([f,lab])=>{ const vb=jv(b[f]),va=jv(a[f]); if(vb!==va) out.push({...base,champ:lab,avant:vb,apres:va,type:'modification'}); });
  return out;
}
let JOURNAL_OFF=false;
function journalDiff(p){
  if(JOURNAL_OFF) return;
  const before=SNAP[p.id];
  const nomP=p.nom||'';
  let ev=[];
  if(!before){ ev.push({projet:nomP,cible:'Projet',champ:'Projet',avant:'',apres:nomP,type:'création'}); journalPush(ev); return; }
  ev.push(...diffFields(before,p,J_PROJ_FIELDS,{projet:nomP,cible:'Projet'}));
  const mt=matchLists(before.taches||[],p.taches||[],tKey);
  mt.added.forEach(t=>ev.push({projet:nomP,cible:'Tâche',champ:'Tâche',avant:'',apres:t.titre||t.nd||'',type:'création'}));
  mt.removed.forEach(t=>ev.push({projet:nomP,cible:'Tâche',champ:'Tâche',avant:t.titre||t.nd||'',apres:'',type:'suppression'}));
  mt.pairs.forEach(([tb,ta])=>{
    const cible='Tâche « '+(ta.titre||ta.nd||'')+' »';
    ev.push(...diffFields(tb,ta,J_TACHE_FIELDS,{projet:nomP,cible}));
    const nfb=(tb.fichiers||[]).length,nfa=(ta.fichiers||[]).length;
    if(nfb!==nfa) ev.push({projet:nomP,cible,champ:'Pièces jointes',avant:String(nfb),apres:String(nfa),type:'modification'});
    const ml=matchLists(tb.pda||[],ta.pda||[],lKey);
    if(ml.added.length>3) ev.push({projet:nomP,cible,champ:'PDA — import',avant:String((tb.pda||[]).length)+' dossier(s)',apres:String((ta.pda||[]).length)+' dossier(s) (+'+ml.added.length+')',type:'import'});
    else ml.added.forEach(l=>ev.push({projet:nomP,cible,champ:'PDA — dossier',avant:'',apres:pdaLineLabel(l),type:'création'}));
    if(ml.removed.length>3) ev.push({projet:nomP,cible,champ:'PDA — suppression',avant:String((tb.pda||[]).length)+' dossier(s)',apres:String((ta.pda||[]).length)+' dossier(s) (−'+ml.removed.length+')',type:'suppression'});
    else ml.removed.forEach(l=>ev.push({projet:nomP,cible,champ:'PDA — dossier',avant:pdaLineLabel(l),apres:'',type:'suppression'}));
    ml.pairs.forEach(([lb,la])=>{ const c2=cible+' › '+pdaLineLabel(la); ev.push(...diffFields(lb,la,J_PDA_FIELDS,{projet:nomP,cible:c2})); });
  });
  if(ev.length>80){ const n=ev.length; ev=ev.slice(0,80); ev.push({projet:nomP,cible:'…',champ:'Autres modifications',avant:'',apres:(n-80)+' changement(s) supplémentaire(s) non détaillé(s)',type:'modification'}); }
  journalPush(ev);
}
let journalToday=[];
function todayStr(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
async function journalPush(events){
  if(!events.length) return;
  const now=new Date(), ts=now.getTime(), date=todayStr(now);
  const heure=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const auteur=(localStorage.getItem('ddms_auteur')||'').trim();
  const rows=events.map((e,i)=>({...e,ts:ts+i,date,heure,auteur}));
  rows.forEach(r=>{ if(r.date===journalDate) journalToday.push(r); });
  renderJournalBadge(); if(document.getElementById('journal-panel').style.display==='block') renderJournal();
  try{ for(const r of rows){ await setDoc(doc(db,JCOL,String(r.ts)+'_'+Math.random().toString(36).slice(2,6)),r); } }
  catch(e){ console.warn('Journal non enregistré :',e.message); toast('Journal : '+e.message,'error'); }
}
let journalDate=todayStr();
async function journalLoad(date=journalDate){
  journalDate=date;
  try{
    const q=query(collection(db,JCOL),where('date','==',date));
    const s=await getDocs(q);
    journalToday=s.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts);
  }catch(e){ journalToday=[]; console.warn('Journal :',e.message); }
  renderJournalBadge(); renderJournal();
}
function renderJournalBadge(){
  const b=document.getElementById('journal-badge'); if(!b) return;
  const n=journalToday.length;
  b.textContent=n; b.style.display=n?'inline-flex':'none';

  const el=document.getElementById('journal-list'); if(!el) return;
  document.getElementById('journal-date').value=journalDate;

const SUGGEST_DOC = ['meta','champsHistorique'];
async function loadSuggestions() {
  try{ const s=await getDoc(doc(db,...SUGGEST_DOC)); suggestions = s.exists()? s.data() : {}; }
  catch(e){ suggestions = {}; }
}
async function saveSuggestionValues(map) {
  // map: { champId: 'valeur saisie' }
  let changed=false;
  Object.entries(map).forEach(([champId,val])=>{
    val=(val||'').trim(); if(!val) return;
    if(!suggestions[champId]) suggestions[champId]=[];
    if(!suggestions[champId].includes(val)){ suggestions[champId].push(val); changed=true; }
  });
  if(changed){
    try{ await setDoc(doc(db,...SUGGEST_DOC), suggestions, {merge:true}); }
    catch(e){ /* silencieux : ne bloque pas l'enregistrement de la tâche */ }
    renderDatalists();
  }
}
function renderDatalists() {
  document.querySelectorAll('datalist[data-champ]').forEach(dl=>{
    const champId=dl.dataset.champ;
    dl.innerHTML=(suggestions[champId]||[]).map(v=>`<option value="${v.replace(/"/g,'&quot;')}"></option>`).join('');
  });
}

function progPct(p) {

  return Math.round(t.filter(isDoneStatut).length/t.length*100);

function getWeekRange(d=new Date()) {
  const day = d.getDay(); // 0=dim..6=sam
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setHours(0,0,0,0); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return [monday, sunday];
}

function renderMigrationKPIs(taches) {
  const cnt = st => taches.filter(t=>t.statut===st).length;
  const termine=cnt('Migré'), enCours=cnt('En cours'), nonMigre=cnt('Non migré'), reporte=cnt('Reporté');
  const [wStart,wEnd] = getWeekRange();
  const planifieeCetteSemaine = taches.filter(t=>{
    if(!t.dateMigPrevue) return false;
    const d=new Date(t.dateMigPrevue+'T00:00:00');
    return d>=wStart && d<=wEnd;
  }).length;

  const card=(lbl,val,color)=>`<div class="kpi-card"><span class="kpi-label">${lbl}</span><span class="kpi-val" style="color:${color}">${val}</span></div>`;

  return `<div class="kpi-row">
    ${card('● Terminé (Migré)', termine, 'var(--green)')}
    ${card('◑ En cours', enCours, 'var(--accent)')}
    ${card('○ Non migré', nonMigre, 'var(--text3)')}
    ${card('✕ Reporté', reporte, 'var(--red)')}
    ${card('◔ Planifié cette semaine', planifieeCetteSemaine, '#7c3aed')}
  </div>`;
}

function renderTaches() {
  const p=proj(); if(!p) return;
  const taches=p.taches||[];
  const el=document.getElementById('taches-list');
  if(!taches.length){
    const cEl=document.getElementById('mig-count'); if(cEl) cEl.textContent='0 ligne';
    el.innerHTML=emptyState(isMigrationProjet(p)?'Aucune ligne — cliquez "+ Ajouter une ligne" ou "⬆ Importer"':'Aucune tâche — cliquez "+ Ajouter une tâche"'); return; }

  el.innerHTML = isMigrationProjet(p) ? renderTachesMigration(taches) : renderTachesDefault(taches);
  fixStickyOffsets(el);
}

// Ligne PDA terminée : tolérant (Terminé/Terminée/TERMINE/OK/Done/Réalisé/Fait/Clôturé/Migré/Livré)
const PDA_DONE_WORDS=['ok','done','realise','realisee','fait','faite','cloture','cloturee','migre','migree','livre','livree','termine','terminee','fini','finie','complete'];
function isPdaDone(l){
  const k=String((l&&l.statut)||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  return !!k && (k.startsWith('termin') || PDA_DONE_WORDS.includes(k));
}
// Volume / Réalisé / Reste : si un PDA existe, Volume = nb lignes, Reste = lignes non terminées
function tacheVolumes(t){
  const l=t.pda||[];
  if(l.length){
    const done=l.filter(isPdaDone).length;
    return {vol:l.length, real:done, reste:l.length-done, fromPda:true};
  }
  const hasV=t.volume!==undefined&&t.volume!=='', hasR=t.realise!==undefined&&t.realise!=='';
  return {vol:hasV?t.volume:'—', real:hasR?t.realise:'—', reste:(hasV&&hasR)?Math.max(0,Number(t.volume)-Number(t.realise)):'—', fromPda:false};
}

function migFilterState(){
  const g=id=>{const e=document.getElementById(id); return e?e.value:'';};

window.migResetFilters=function(){
  ['mig-q','mig-f-source','mig-f-statut'].forEach(id=>{const e=document.getElementById(id); if(e) e.value='';});
  renderTaches();
};
function migMatch(t,f){
  if(f.source && migGet(t,'source')!==f.source) return false;
  if(f.statut && t.statut!==f.statut) return false;
  if(f.q){
    const hay=MIG_FIELDS.map(fd=>migGet(t,fd.k)).join(' ');
    if(!migNorm(hay).includes(f.q)) return false;
  }
  return true;
}

function renderTachesMigration(taches) {
  const f=migFilterState();
  const rows=taches.map((t,i)=>({...t,_i:i})).filter(t=>migMatch(t,f));
  const cEl=document.getElementById('mig-count');
  if(cEl) cEl.textContent = rows.length===taches.length ? `${taches.length} ligne(s)` : `${rows.length} / ${taches.length} ligne(s)`;
  if(!rows.length) return emptyState('Aucune ligne ne correspond aux filtres');

  const groups={}; MIG_STATUTS.forEach(st=>groups[st]=[]);

    items.forEach(t=>{
      const i=t._i;
      const sc=MIGC[t.statut]||'var(--text3)';
      html+=`<tr class="t-row ${isDoneStatut(t)?'t-row-done':''}">
        <td class="t-cell-chk fix-chk"><div class="t-chk ${isDoneStatut(t)?'checked':''}" onclick="toggleTache(${i})"></div></td>
        <td class="t-cell-actions fix-act">
          <button class="btn-icon" onclick="editTache(${i})" title="Modifier">✏️</button>
          <button class="btn-icon del" onclick="deleteTache(${i})" title="Supprimer">✕</button>
        </td>`;
      MIG_FIELDS.forEach((fd,ix)=>{
        const v=migGet(t,fd.k);

        }
      });
      html+=`</tr>`;

  html+=`</tbody></table></div>`;
  return html;
}

// Formulaire migration généré depuis le schéma (tous les champs modifiables)
function migFieldHTML(fd,val){
  const id='t-mig-'+fd.k;
  const v=String(val==null?'':val).replace(/"/g,'&quot;');
  let inner='';
  if(fd.type==='statut'){
    inner=`<select id="${id}">${MIG_STATUTS.map(o=>`<option${o===(val||'Non migré')?' selected':''}>${o}</option>`).join('')}</select>`;
  } else if(fd.type==='select'){
    inner=`<select id="${id}">${fd.opts.map(o=>`<option value="${o}"${o===val?' selected':''}>${o||'—'}</option>`).join('')}</select>`;
  } else if(fd.type==='date'){
    inner=`<input id="${id}" type="date" value="${v}">`;
  } else if(fd.type==='textarea'){
    inner=`<textarea id="${id}" style="min-height:70px">${String(val==null?'':val).replace(/</g,'&lt;')}</textarea>`;
  } else {
    inner=`<input id="${id}" value="${v}" list="dl-${id}" placeholder="${fd.ph||''}">`+(fd.sug?`<datalist id="dl-${id}" data-champ="${id}"></datalist>`:'');
  }
  return `<div class="field"><label>${fd.l}${fd.key?' *':''}</label>${inner}</div>`;
}
function renderMigForm(t){
  t=t||{};
  const wide=MIG_FIELDS.filter(f=>f.wide), narrow=MIG_FIELDS.filter(f=>!f.wide);
  const head=narrow.slice(0,3).map(f=>migFieldHTML(f,migGet(t,f.k))).join('');
  const rest=narrow.slice(3).map(f=>migFieldHTML(f,migGet(t,f.k))).join('');
  const cli=wide.find(f=>f.k==='client'), obs=wide.find(f=>f.k==='observation');
  document.getElementById('tache-fields-migration').innerHTML =
    head + (cli?migFieldHTML(cli,migGet(t,'client')):'') +
    `<div class="grid2">${rest}</div>` +
    (obs?migFieldHTML(obs,migGet(t,'observation')):'');
  renderDatalists();
}
function readMigForm(){
  const obj={};
  MIG_FIELDS.forEach(fd=>{
    const el=document.getElementById('t-mig-'+fd.k);
    obj[fd.k]=el?el.value.trim():'';

}

function fixStickyOffsets(root){
  const apply=()=>{
    const chk=root.querySelector('th.fix-chk'); if(!chk) return;
    const w=el=>el?el.getBoundingClientRect().width:0;
    const wChk=w(chk), wAct=w(root.querySelector('th.fix-act')), wNom=w(root.querySelector('th.fix-nom'));
    root.querySelectorAll('.t-table-wrap').forEach(x=>{
      x.style.setProperty('--fix-left',  wChk+'px');
      x.style.setProperty('--fix-left2', (wChk+wAct)+'px');
      x.style.setProperty('--fix-left3', (wChk+wAct+wNom)+'px');
    });
    // Application directe sur les cellules : indépendant de la cascade CSS
    const put=(sel,left)=>root.querySelectorAll(sel).forEach(c=>{ c.style.position='sticky'; c.style.left=left+'px'; });
    put('.fix-chk',0);
    put('.fix-act',wChk);
    put('.fix-nom',wChk+wAct);
    put('.fix-cli',wChk+wAct+wNom);
  };
  apply();
  requestAnimationFrame(apply);
  clearTimeout(fixStickyOffsets._t);
  fixStickyOffsets._t=setTimeout(apply,250);
  if(!fixStickyOffsets._rz){
    fixStickyOffsets._rz=true;
    window.addEventListener('resize',()=>{
      const el=document.getElementById('taches-list'); if(el) fixStickyOffsets(el);
    });
  }
}

function toISODate(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) {
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s=String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}

// Reconnaissance des en-têtes (tolérant accents / casse / espaces)
const normH = v => String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const MIG_ALIASES = {
  ref:              ['ot','otn','numeroot','reference','ref','referencedulienamigrer','referencelien','lien','nd'],
  client:           ['client','raisonsociale','clientobjet','objet','designation','libelle'],
  statut:           ['statut','status','etat'],
  source:           ['source','provenance'],
  categorie:        ['categorietop','categorie','top'],
  cluster:          ['cluster','clusters'],
  site:             ['siteclient','site'],
  localisation:     ['localistion','localisation','localite','commune','zone','ville'],
  gc:               ['gc','geniecivil'],
  sla:              ['slatravaux','sla'],
  superviseur:      ['superviseur','supervisor','sup'],
  porteur:          ['porteur','responsable'],
  contact:          ['contact','telephone','tel','numero'],
  dateReception:    ['datedereception','datereception'],
  dateAttribution:  ['dateattribution','datedattribution'],
  dateDemarrage:    ['datededemarrage','datedemarrage','demarrage'],
  dateMigPrevue:    ['delaicontractuelprevisionnel','delaicontractuel','delaiprevisionnel','datedemigrationprevue','datemigrationprevue','dateprevue','dateprevisionnelle'],
  dateSuspension:   ['datedesuspension','datesuspension','suspension'],
  dateReprise:      ['datedereprisetravaux','datedereprise','datereprise','reprise'],
  dateMigEffective: ['datedefinprojet','datefinprojet','datefin','datedemigrationeffective','datemigrationeffective','dateeffective','datedemigration','datemigration'],
  etatSi:           ['etatsi'],
  observation:      ['observation','observations','commentaire','commentaires','remarque','remarques'],
};
function migMapHeaders(hdr){
  const norm=hdr.map(normH);
  const map={}, used=new Set();
  MIG_FIELDS.forEach(fd=>{
    const al=MIG_ALIASES[fd.k]||[];
    for(const a of al){
      const ix=norm.findIndex((h,j)=>h===a && !used.has(j));
      if(ix>=0){ map[fd.k]=ix; used.add(ix); return; }
    }
  });
  return map;
}
function migSheetRows(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false,raw:false,dateNF:'yyyy-mm-dd'});
  const aoaD=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
  // recherche de la ligne d'en-tête dans les 6 premières lignes
  let hi=-1, map=null;
  for(let i=0;i<Math.min(6,aoa.length);i++){
    const m=migMapHeaders(aoa[i]||[]);
    const n=Object.keys(m).length;
    if(n>=3){ hi=i; map=m; break; }
  }
  if(hi<0) return {rows:[],map:null,headers:[]};
  const headers=(aoa[hi]||[]).map(normH);
  const rows=aoaD.slice(hi+1);
  return {rows,map,headers};
}
window.importMigrationExcel=async function(e){
  const file=e.target.files[0]; if(!file) return;
  const p=proj(); if(!p){ e.target.value=''; return; }
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array',cellDates:true});
    if(!p.taches) p.taches=[];
    let added=0, updated=0, skipped=0;

    wb.SheetNames.forEach(sn=>{
      const {rows,map,headers}=migSheetRows(wb.Sheets[sn]);
      if(!map) return;
      const isProd = headers.some(h=>['referencedulienamigrer','categorietop','siteclient'].includes(h));
      const srcDefault = isProd ? 'PRODUCTION' : 'CIC';

      rows.forEach(r=>{
        const get=k=> map[k]===undefined ? '' : (r[map[k]]===undefined?'':r[map[k]]);
        let ref=String(get('ref')||'').replace(/\u00a0/g,' ').trim();
        // Lignes « référence seule » (liste des liens migrés collée en bas de feuille) :
        // seule la colonne Client/Référence est remplie → ligne PRODUCTION déjà migrée
        let refOnly=false;
        if(!ref){
          const filled=Object.keys(map).filter(k=>String(get(k)===null||get(k)===undefined?'':get(k)).trim()!=='');
          if(filled.length===1 && filled[0]==='client'){
            ref=String(get('client')).replace(/\u00a0/g,' ').trim();
            refOnly=!!ref;
          }
        }
        if(!ref){ skipped++; return; }
        const obj={};
        MIG_FIELDS.forEach(fd=>{
          let v=get(fd.k);
          if(fd.type==='date') v=toISODate(v);
          else v=String(v===null||v===undefined?'':v).replace(/\u00a0/g,' ').trim();
          obj[fd.k]=v;
        });
        obj.ref=ref;
        obj.statut=migNormStatut(get('statut')||get('etatSi'));
        if(refOnly){ obj.client=''; obj.source='PRODUCTION'; obj.statut='Migré'; }
        if(!obj.source) obj.source=srcDefault;
        if(obj.gc) obj.gc=migNorm(obj.gc).startsWith('o')?'OUI':migNorm(obj.gc).startsWith('n')?'NON':'';
        if(obj.sla) obj.sla=String(obj.sla).toUpperCase().includes('HD')?'HD':String(obj.sla).toUpperCase().includes('DD')?'DD':'';

        // Clé = source + référence + objet : un même OT peut porter 2 sites distincts
        const migKey=(src,rf,cl)=>((src||srcDefault)+'|'+rf+'|'+String(cl||'').slice(0,60)).toUpperCase().replace(/\s+/g,' ').trim();
        const key=migKey(obj.source,ref,obj.client);
        const idx=p.taches.findIndex(t=>migKey(migGet(t,'source'),migGet(t,'ref'),migGet(t,'client'))===key);
        if(idx>=0){
          const prev=p.taches[idx], merged={...prev};
          MIG_FIELDS.forEach(fd=>{ if(obj[fd.k]!=='') merged[fd.k]=obj[fd.k]; });
          merged.statut=obj.statut;
          p.taches[idx]=merged; updated++;
        } else { p.taches.push(obj); added++; }
      });
    });

    if(!added && !updated){ toast('Aucune ligne exploitable dans ce fichier','error'); e.target.value=''; return; }
    await fsSave(p);
    renderProjet(); renderSidebar();
    toast(`Import : ${added} ajoutée(s), ${updated} mise(s) à jour${skipped?`, ${skipped} ignorée(s)`:''} ✓`,'success');
  }catch(err){ toast('Erreur import : '+err.message,'error'); }
  e.target.value='';
};

function renderPda(){

  document.getElementById('pda-title-text').textContent=`PDA — ${t.titre||''}`+(pdaMode==='reste'?' · Reste à faire':pdaMode==='termine'?' · Terminé':'');

  document.getElementById('pda-count').textContent=`Volume : ${lines.length} · Réalisé (terminé) : ${done} · Reste à faire : ${lines.length-done} · Récurrent total : ${totRec.toLocaleString('fr-FR')}`;
  const q=(document.getElementById('pda-search').value||'').toLowerCase();
  const el=document.getElementById('pda-list');
  ['all','reste','termine'].forEach(m=>{ const b=document.getElementById('pda-mode-'+m); if(b) b.classList.toggle('active',m===pdaMode); });
  const modeOk=l=>pdaMode==='reste'?!isPdaDone(l):pdaMode==='termine'?isPdaDone(l):true;
  const shown=lines.filter(modeOk).length;
  document.getElementById('pda-total').textContent=pdaMode==='all'?`Total dossier : ${lines.length}`:`Affichés : ${shown} / ${lines.length}`;
  const schema=pdaSchema(t), fields=schema.map(c=>c.f);
  if(!lines.length){ el.innerHTML=emptyState('Aucune ligne — cliquez « + Ajouter » ou importez un fichier Excel'); return; }
  let html=`<div class="t-table-wrap"><table class="t-table"><thead><tr>
    ${schema.map(c=>`<th class="${c.fix?'pda-fix':''}" ${c.type==='number'?'style="text-align:right"':''}>${c.label}</th>`).join('')}<th style="width:64px"></th>
  </tr></thead><tbody>`;
  const cellView=(c,l)=>{
    const v=l[c.f];
    if(c.type==='statut'){ const sc=PDAC[v]||(isPdaDone(l)?'var(--green)':'var(--text3)'); return `<td class="t-cell-statut"><span class="t-statut-badge" style="color:${sc};background:${sc}14;border:1px solid ${sc}33">${esc(v)||'—'}</span></td>`; }
    if(c.type==='date') return `<td class="t-cell-date ${c.fix?'pda-fix':''}">${v?formatDate(v):'—'}</td>`;
    if(c.type==='number') return `<td class="t-cell-vol" style="text-align:right;font-family:'DM Mono',monospace">${fmtNum(v)||esc(v)||'—'}</td>`;
    return `<td class="${c.fix?'t-cell-nom pda-fix':'t-cell-obj'}" ${c.mono?"style=\"font-family:'DM Mono',monospace\"":''}>${esc(v)||'—'}</td>`;
  };
  const cellEdit=(c,l)=>{
    if(c.type==='statut') return `<td><select class="pda-inline" id="pda-${c.f}">${PDA_STATUTS.map(st=>`<option ${st===(l[c.f]||'À faire')?'selected':''}>${st}</option>`).join('')}</select></td>`;
    const type=c.type==='date'?'date':c.type==='number'?'number':'text';
    return `<td class="${c.fix?'pda-fix':''}"><input class="pda-inline" id="pda-${c.f}" type="${type}" value="${esc(l[c.f]||'')}"></td>`;
  };
  lines.forEach((l,li)=>{
    if(!modeOk(l) && li!==pdaEditIdx) return;
    if(q && li!==pdaEditIdx && !fields.some(f=>String(l[f]||'').toLowerCase().includes(q))) return;
    if(li===pdaEditIdx){
      html+=`<tr class="t-row pda-editing">${schema.map(c=>cellEdit(c,l)).join('')}
        <td class="t-cell-actions">
          <button class="btn-icon" onclick="pdaSave()" title="Enregistrer">✔</button>
          <button class="btn-icon del" onclick="pdaCancelEdit()" title="Annuler">✕</button>
        </td></tr>`;
      return;
    }
    html+=`<tr class="t-row ${isPdaDone(l)?'t-row-done':''}">${schema.map(c=>cellView(c,l)).join('')}
      <td class="t-cell-actions">
        <button class="btn-icon" onclick="pdaEdit(${li})" title="Modifier">✏️</button>
        <button class="btn-icon del" onclick="pdaDelete(${li})" title="Supprimer">✕</button>
      </td></tr>`;
  });
  html+=`</tbody></table></div>`;
  el.innerHTML=html;
}
window.pdaFilter=()=>renderPda();
window.pdaSetMode=m=>{ if(pdaEditIdx!==null) window.pdaCancelEdit(); pdaMode=m; renderPda(); };

window.pdaEdit=function(li){
  const t=pdaTache(); if(!t||!t.pda||!t.pda[li]) return;
  if(pdaNewIdx!==null) window.pdaCancelEdit();
  pdaEditIdx=li;
  renderPda();
  const first=pdaSchema(t)[0]; const c=document.getElementById('pda-'+first.f); if(c) c.focus();
};
let pdaNewIdx=null; // index de la ligne en cours d'ajout (non encore sauvegardée)
window.pdaAdd=function(){
  const t=pdaTache(); if(!t) return;
  if(pdaNewIdx!==null) return; // déjà une ligne en cours
  if(!t.pda) t.pda=[];
  const blank={}; pdaFieldsOf(t).forEach(f=>blank[f]=f==='statut'?'À faire':'');
  if(blank.date!==undefined) blank.date=todayStr();
  t.pda.unshift(blank); pdaNewIdx=0; pdaEditIdx=0;
  renderPda();
  const el=document.getElementById('pda-list'); if(el) el.scrollTop=0;
  const first=pdaSchema(t)[0]; const c=document.getElementById('pda-'+first.f); if(c) c.focus();
};

window.pdaSave=async function(){
  const p=proj(); const t=pdaTache(); if(!p||!t) return;
  const obj={};
  pdaFieldsOf(t).forEach(f=>{ const el=document.getElementById('pda-'+f); obj[f]=el?(el.value||'').trim():(t.pda[pdaEditIdx]||{})[f]||''; });
  if(!obj.client && !obj.reference){ toast('Client ou Référence requis','error'); return; }
  pdaNewIdx=null;
  if(!t.pda) t.pda=[];
  if(pdaEditIdx===null) return;
  t.pda[pdaEditIdx]=obj;
  syncPdaVolume(t);
  try{
    await fsSave(p);
    saveSuggestionValues({'pda-client':obj.client,'pda-produit':obj.produit,'pda-localisation':obj.localisation,'pda-typeSite':obj.typeSite,'pda-techno':obj.techno});
    pdaClearForm(); renderPda(); renderProjet();
    toast('Ligne enregistrée ✓','success');
  }catch(e){ toast('Erreur : '+e.message,'error'); }
};

window.pdaDelete=async function(li){
  const p=proj(); const t=pdaTache(); if(!p||!t||!t.pda) return;
  if(!confirm('Supprimer cette ligne du PDA ?')) return;
  t.pda.splice(li,1);
  if(pdaEditIdx===li) pdaClearForm(); else if(pdaNewIdx!==null){ t.pda.splice(pdaNewIdx>li?pdaNewIdx-1:pdaNewIdx,1); pdaClearForm(); }
  syncPdaVolume(t);
  try{ await fsSave(p); renderPda(); renderProjet(); toast('Ligne supprimée','success'); }
  catch(e){ toast('Erreur : '+e.message,'error'); }
};

window.pdaClearAll=async function(){
  const p=proj(); const t=pdaTache(); if(!p||!t||!(t.pda||[]).length) return;
  if(!confirm('Vider toutes les lignes du PDA ?')) return;
  if(!checkPassword('vider le PDA')) return;
  t.pda=[];
  try{ await fsSave(p); pdaClearForm(); renderPda(); renderProjet(); toast('PDA vidé','success'); }
  catch(e){ toast('Erreur : '+e.message,'error'); }
};

// Import Excel PDA — détection des colonnes par nom d'en-tête (tolérant accents/casse), selon le schéma de la tâche
window.triggerImportPda=function(){
  if(!pdaTache()) return;
  document.getElementById('import-pda-file').click();
};
window.importPdaExcel=async function(e){
  const file=e.target.files[0]; if(!file) return;
  const p=proj(); const t=pdaTache(); if(!p||!t){ e.target.value=''; return; }
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    // trouver la ligne d'en-tête (première ligne contenant client ou reference)
    let hIdx=-1, map={};
    for(let r=0;r<Math.min(aoa.length,30);r++){
      const keys=aoa[r].map(normKey); const m={};
      pdaSchema(t).forEach(({f,alts})=>{
        const ci=keys.findIndex(k=>k && alts.includes(k)); if(ci>=0) m[f]=ci;
      });
      if(m.client!==undefined || m.reference!==undefined){ hIdx=r; map=m; break; }
    }
    if(hIdx<0){ toast('En-tête introuvable (colonne Client ou Référence attendue)','error'); e.target.value=''; return; }
    if(!t.pda) t.pda=[];
    let added=0, ignored=0;
    const KI=v=>String(v??'').trim().toUpperCase().replace(/\s+/g,' ');
    const dispo=isDispoTache(t);
    for(let r=hIdx+1;r<aoa.length;r++){
      const row=aoa[r]; if(!row || !row.some(v=>String(v).trim()!=='')) continue;
      const get=f=>map[f]!==undefined?row[map[f]]:'';
      const statutRaw=String(get('statut')||'').trim();
      let statut=PDA_STATUTS.find(s=>normKey(s)===normKey(statutRaw));
      if(!statut && isPdaDone({statut:statutRaw})) statut='Terminé';
      if(!statut && /encours|enc|wip/.test(normKey(statutRaw))) statut='En cours';
      if(!statut && /bloq|block|ko/.test(normKey(statutRaw))) statut='Bloqué';
      if(!statut) statut='À faire';
      const obj={};
      pdaSchema(t).forEach(c=>{ obj[c.f]= c.type==='statut'?statut : c.type==='date'?toISODate(get(c.f)) : String(get(c.f)||'').trim(); });
      if(!obj.client && !obj.reference) continue;
      const ref=KI(obj.reference), cli=KI(obj.client);
      const dateOk=l=>!dispo || (l.date||'')===(obj.date||'');
      const idx = ref ? t.pda.findIndex(l=>KI(l.reference)===ref && dateOk(l))
                      : t.pda.findIndex(l=>KI(l.client)===cli && dateOk(l));
      if(idx>=0){ ignored++; } else { t.pda.push(obj); added++; }
    }
    syncPdaVolume(t);
    await fsSave(p);
    pdaClearForm(); renderPda(); renderProjet();
    toast(`Import PDA : ${added} ajoutée(s), ${ignored} déjà en base (ignorée(s)) ✓`,'success');
  }catch(err){ toast('Erreur import : '+err.message,'error'); }
  e.target.value='';
};

window.exportPdaExcel=function(){
  const t=pdaTache(); if(!t) return;
  const schema=pdaSchema(t);
  const rows=(t.pda||[]).map(l=>{ const o={}; schema.forEach(c=>o[c.xl]=l[c.f]||''); return o; });
  const vide={}; schema.forEach(c=>vide[c.xl]='');
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[vide]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'PDA');
  XLSX.writeFile(wb,`PDA_${(t.titre||'tache').replace(/[^a-z0-9]+/gi,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast(rows.length?'Export généré ✓':'Modèle vide généré ✓','success');
};

// Comparaison Excel ↔ base PDA — ne modifie rien, produit un classeur 2 onglets
window.triggerComparePda=function(){
  if(!pdaTache()) return;
  document.getElementById('compare-pda-file').click();
};
window.comparePdaExcel=async function(e){
  const file=e.target.files[0]; if(!file) return;
  const t=pdaTache(); if(!t){ e.target.value=''; return; }
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    // détection de la ligne d'en-tête (même logique que l'import)
    let hIdx=-1, map={};
    for(let r=0;r<Math.min(aoa.length,30);r++){
      const keys=(aoa[r]||[]).map(normKey); const m={};
      pdaSchema(t).forEach(({f,alts})=>{ const ci=keys.findIndex(k=>k && alts.includes(k)); if(ci>=0) m[f]=ci; });
      if(m.client!==undefined || m.reference!==undefined){ hIdx=r; map=m; break; }
    }
    if(hIdx<0){ toast('En-tête introuvable (colonne Client ou Référence attendue)','error'); e.target.value=''; return; }
    // en-têtes du fichier source (dédoublonnés)
    const seen={}; const headers=(aoa[hIdx]||[]).map((h,i)=>{
      let n=String(h||'').trim()||('Col'+(i+1));
      if(seen[n]!==undefined){ seen[n]++; n=n+' ('+seen[n]+')'; } else seen[n]=1;
      return n;
    });
    // index de la base
    const K=v=>String(v??'').trim().toUpperCase().replace(/\s+/g,' ');
    const base=t.pda||[];
    const byRef=new Map(), byCli=new Map();
    base.forEach(l=>{
      const r=K(l.reference), c=K(l.client);
      if(r && !byRef.has(r)) byRef.set(r,l);
      if(c && !byCli.has(c)) byCli.set(c,l);
    });
    const dedans=[], dehors=[]; const vus=new Set();
    for(let r=hIdx+1;r<aoa.length;r++){
      const row=aoa[r]; if(!row || !row.some(v=>String(v).trim()!=='')) continue;
      const get=f=>map[f]!==undefined?row[map[f]]:'';
      const ref=K(get('reference')), cli=K(get('client'));
      if(!ref && !cli) continue;
      const o={}; headers.forEach((h,i)=>{ const v=row[i]; o[h]=(v instanceof Date)?formatDate(v):(v??''); });
      const hitRef=ref?byRef.get(ref):null;
      const hitCli=(!hitRef && cli)?byCli.get(cli):null;
      const hit=hitRef||hitCli;
      if(hit){
        vus.add(hit);
        o['_Correspondance']=hitRef?'Référence':'Client';
        o['_Client en base']=hit.client||'';
        o['_Référence en base']=hit.reference||'';
        o['_Statut en base']=hit.statut||'';
        dedans.push(o);
      }else{
        o['_Motif']='Absent de la base PDA';
        dehors.push(o);
      }
    }
    const wbOut=XLSX.utils.book_new();
    const mk=(rows,cols)=>XLSX.utils.json_to_sheet(rows.length?rows:[cols.reduce((a,c)=>(a[c]='',a),{})]);
    XLSX.utils.book_append_sheet(wbOut, mk(dedans,[...headers,'_Correspondance','_Statut en base']), 'Deja en base');
    XLSX.utils.book_append_sheet(wbOut, mk(dehors,[...headers,'_Motif']), 'Non pris en compte');
    const nom=(t.titre||'tache').replace(/[^a-z0-9]+/gi,'_');
    XLSX.writeFile(wbOut,`Comparaison_${nom}_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast(`Comparaison : ${dedans.length} déjà en base · ${dehors.length} non pris en compte ✓`,'success');
  }catch(err){ toast('Erreur comparaison : '+err.message,'error'); }
  e.target.value='';
};

// Entrée = ajouter dans le formulaire PDA
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('pda-inline')){ e.preventDefault(); window.pdaSave(); }
  if(e.key==='Escape' && document.getElementById('modal-pda').style.display==='flex'){ if(pdaEditIdx!==null) window.pdaCancelEdit(); else window.closePda(); }

// Calcul temps réel "Reste à faire" dans la modal
document.addEventListener('input', function(e){
  if(e.target.id==='t-volume'||e.target.id==='t-realise'){
    const v=parseFloat(document.getElementById('t-volume').value);
    const r=parseFloat(document.getElementById('t-realise').value);
    const el=document.getElementById('t-reste-display');
    if(!isNaN(v)&&!isNaN(r)){
      const reste=Math.max(0,v-r);
      el.textContent=reste;
      el.style.color=reste===0?'var(--green)':reste<v/2?'var(--orange)':'var(--accent)';
    } else { el.textContent='—'; el.style.color='var(--accent)'; }
  }
});

      </div>
      <div id="mig-filters" style="display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <input id="mig-q" type="search" placeholder="Rechercher (référence, client, cluster, localisation…)" oninput="migApplyFilters()" style="flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 12px;outline:none">
        <select id="mig-f-source" onchange="migApplyFilters()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 12px"><option value="">Toutes sources</option><option value="CIC">CIC</option><option value="PRODUCTION">PRODUCTION</option></select>
        <select id="mig-f-statut" onchange="migApplyFilters()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 12px"><option value="">Tous statuts</option><option>Non migré</option><option>Planifié</option><option>En cours</option><option>Migré</option><option>Reporté</option></select>
        <button class="btn-add-t" style="background:none;border:1px solid var(--border);color:var(--text2)" onclick="migResetFilters()">Réinitialiser</button>
        <span id="mig-count" style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)"></span>
      </div>
      <div id="taches-list"></div>
    </div>
  </div>
</div>

<!-- MODAL PROJET -->
<div id="modal-projet" class="modal-overlay" style="display:none" onclick="closeModalOutside(event,'modal-projet')">
  <div class="modal">
    <div class="modal-title" id="proj-modal-title">Nouveau projet <button class="modal-close" onclick="closeModal('modal-projet')">✕</button></div>
    <input type="hidden" id="p-edit-id">

    <div class="fsep">Informations générales</div>
    <div class="field"><label>Nom du projet *</label><input id="p-nom" placeholder="ex: Migration SD-WAN Abidjan"></div>
    <div class="grid2" style="margin-bottom:11px">
      <div class="field"><label>Chef de projet</label><input id="p-chef" placeholder="ex: Eric Thiémélé"></div>
      <div class="field"><label>Budget estimé</label><input id="p-budget" placeholder="ex: 120 000 € HT"></div>
    </div>
    <div class="grid2" style="margin-bottom:11px">
      <div class="field"><label>Statut</label>
        <select id="p-statut"><option>En cours</option><option>Planifié</option><option>Terminé</option><option>En pause</option><option>Annulé</option></select>
      </div>
      <div class="field"><label>Priorité</label>
        <select id="p-priorite"><option>Haute</option><option>Moyenne</option><option>Faible</option></select>
      </div>
    </div>
    <div class="grid2" style="margin-bottom:11px">
      <div class="field"><label>Date de début</label><input id="p-dateDebut" type="date"></div>
      <div class="field"><label>Date de fin prévue</label><input id="p-dateFin" type="date"></div>
    </div>
    <div class="field"><label>Membres de l'équipe</label><input id="p-membres" placeholder="Jean Dupont, Marie Fall… (séparés par des virgules)"></div>

    <div class="fsep">Contexte du projet</div>
    <div class="field"><label>🔴 Problématique adressée</label>
      <textarea id="p-problematique" placeholder="Quel problème ce projet résout-il ? Quelle douleur client ?"></textarea>
    </div>
    <div class="field"><label>🎯 Objectifs</label>
      <textarea id="p-objectifs" placeholder="Quels sont les résultats attendus ?"></textarea>
    </div>
    <div class="field"><label>📋 Description</label>
      <textarea id="p-description" placeholder="Contexte, périmètre, parties prenantes…"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-projet')">Annuler</button>
      <button class="btn-primary" id="proj-modal-btn" onclick="saveProjet()">Créer</button>
    </div>
  </div>
</div>

<!-- MODAL TACHE -->
<div id="modal-tache" class="modal-overlay" style="display:none" onclick="closeModalOutside(event,'modal-tache')">
  <div class="modal modal-sm">
    <div class="modal-title" id="tache-modal-title">Nouvelle tâche <button class="modal-close" onclick="closeModal('modal-tache')">✕</button></div>
    <div id="tache-fields-default">
      <div class="field"><label>Nom de la tâche *</label><input id="t-titre" list="dl-t-titre" placeholder="ex: Rédiger le cahier des charges"><datalist id="dl-t-titre" data-champ="t-titre"></datalist></div>
      <div class="field"><label>Objectif</label><input id="t-objectif" list="dl-t-objectif" placeholder="ex: Définir le périmètre technique du projet"><datalist id="dl-t-objectif" data-champ="t-objectif"></datalist></div>
      <div class="grid2" style="margin-bottom:11px">
        <div class="field"><label>Volume <span id="t-volume-pda-note" style="display:none;color:var(--text3);font-weight:400">(auto depuis PDA)</span></label><input id="t-volume" type="number" min="0" placeholder="ex: 100"></div>
        <div class="field"><label>Réalisé</label><input id="t-realise" type="number" min="0" placeholder="ex: 40"> </div>
      </div>
      <div class="field" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;">Reste à faire</span>
        <span id="t-reste-display" style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--accent);">—</span>
        <span style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;">(calculé automatiquement)</span>
      </div>
      <div class="field"><label>Porteur</label><input id="t-porteur" list="dl-t-porteur" placeholder="ex: Jean Dupont"><datalist id="dl-t-porteur" data-champ="t-porteur"></datalist></div>
      <div class="grid2" style="margin-bottom:11px">
        <div class="field"><label>Date de début</label><input id="t-dateDebut" type="date"></div>
        <div class="field"><label>Date de fin</label><input id="t-dateFin" type="date"></div>
      </div>
      <div class="field"><label>Statut</label>
        <select id="t-statut"><option>À faire</option><option>En cours</option><option>Terminé</option><option>Bloqué</option></select>
      </div>
      <div class="field"><label>Commentaire</label><textarea id="t-desc" style="min-height:72px" placeholder="Notes, blocages, informations complémentaires…"></textarea></div>
    </div>

    <div id="tache-fields-migration" style="display:none"></div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-tache')">Annuler</button>
      <button class="btn-primary" onclick="saveTache()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- BOUTON FLOTTANT : JOURNAL DES MODIFICATIONS (avant → après) -->
<button id="journal-btn" onclick="toggleJournal()">📝 <span id="journal-btn-label">Modifs du jour</span><span id="journal-badge">0</span></button>
<div id="journal-panel">
  <div class="j-top">
    <h4>Modifications</h4>
    <button class="j-nav" onclick="journalShift(-1)" title="Jour précédent">‹</button>
    <input type="date" id="journal-date" onchange="journalSetDate(this.value)">
    <button class="j-nav" onclick="journalShift(1)" title="Jour suivant">›</button>
    <button class="modal-close" onclick="toggleJournal()">✕</button>
    <div class="j-auteur">Votre nom <input id="journal-auteur" placeholder="ex: Dean" onchange="journalSetAuteur(this.value)"></div>
  </div>
  <div id="journal-list"></div>
</div>

<!-- MODAL PDA (détail des lignes d'une tâche) — reste ouvert pendant les saisies -->
<div id="modal-pda" class="modal-overlay" style="display:none">
  <div class="modal modal-pda">
    <div class="modal-title"><span id="pda-title-text">PDA</span><button class="modal-close" onclick="closePda()" title="Fermer">✕</button></div>
    <div class="pda-sub" id="pda-count"></div>


    <div class="pda-toolbar">
      <div class="pda-modes">
        <button id="pda-mode-all" onclick="pdaSetMode('all')">Volume (tous)</button>
        <button id="pda-mode-reste" onclick="pdaSetMode('reste')">Reste à faire</button>
        <button id="pda-mode-termine" onclick="pdaSetMode('termine')">Terminé</button>
      </div>
      <div class="search-box"><span>🔍</span><input id="pda-search" placeholder="Rechercher dans les lignes…" oninput="pdaFilter()"></div>
      <button class="btn-primary" onclick="pdaAdd()" title="Ajouter une ligne" style="padding:8px 14px">+ Ajouter</button>
      <button class="btn-cancel" onclick="triggerImportPda()" title="Importer des lignes depuis Excel">📥 Import Excel</button>
      <button class="btn-cancel" onclick="exportPdaExcel()" title="Exporter / télécharger un modèle">📤 Export Excel</button>
      <button class="btn-cancel" onclick="triggerComparePda()" title="Comparer un fichier Excel avec les lignes déjà en base">🔎 Comparer</button>
      <button class="btn-cancel" onclick="pdaClearAll()" style="color:var(--red)">🗑 Vider</button>
      <span id="pda-total" style="font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);border-radius:8px;padding:8px 12px;white-space:nowrap">Total dossier : 0</span>
      <input type="file" id="import-pda-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importPdaExcel(event)">
      <input type="file" id="compare-pda-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="comparePdaExcel(event)">
    </div>

    <div id="pda-list"></div>

    <div class="modal-footer">
      <button class="btn-primary" onclick="closePda()">Fermer</button>
    </div>
  </div>
</div>

</body>
</html>
