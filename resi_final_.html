<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>📄 Résiliations</title>

<style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --accent: #4f46e5;
      --text-main: #27272a;
      --text-muted: #8a8f98;
      --bg-page: #fafafa;
      --bg-card: #ffffff;
      --border-soft: #eaeaea;
      --border-medium: #e2e2e2;
      --danger: #b91c1c;
      --info: #0369a1;
      --warn: #b45309;
      --radius: 10px;
      --shadow-card: 0 1px 2px rgba(16,24,40,.04);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 22px 26px 60px;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.45;
      font-size: 13px;
    }

    /* ── En-tête ─────────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 14px; margin-bottom: 16px;
    }
    .page-header h1 {
      margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.2px;
      color: var(--text-main);
      display: flex; align-items: center; gap: 8px;
    }
    .page-header .subtitle {
      margin: 2px 0 0; font-size: 12px; color: var(--text-muted); font-weight: 400;
    }

    h1 { color: var(--text-main); }
    h2 {
      font-size: 13px; font-weight: 600; color: var(--text-main);
      margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: center; gap: 7px; letter-spacing: 0;
    }

    /* ── Cartes de section ───────────────────────────────────── */
    .section-card {
      background: var(--bg-card); border: 1px solid var(--border-soft);
      border-radius: var(--radius); box-shadow: var(--shadow-card);
      padding: 16px 18px; margin-bottom: 16px;
    }

    /* ── Tableaux ────────────────────────────────────────────── */
    table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 12px; }
    th, td { border: none; border-bottom: 1px solid var(--border-soft); padding: 8px 10px; text-align: left; }
    th {
      background: #f7f7f8; color: #52525b; font-weight: 600; font-size: 10.5px;
      text-transform: uppercase; letter-spacing: .25px;
      border-bottom: 1px solid var(--border-medium);
      position: sticky; top: 0; z-index: 2;
    }
    tbody tr:nth-child(even) { background: #fbfbfc; }
    tbody tr:hover { background: #f4f4f8; }

    .tableau-scroll {
      max-height: 500px; max-width: 100%; overflow-x: auto; overflow-y: auto;
      border: 1px solid var(--border-soft); border-radius: 8px; margin: 10px 0 12px;
    }
    .tableau-scroll table { min-width: 600px; margin-top: 0; }

    /* ── Boutons ─────────────────────────────────────────────── */
    button {
      font-family: inherit; cursor: pointer; border-radius: 7px;
      padding: 6px 12px; font-size: 12px; font-weight: 500;
      background: #fff; color: #3f3f46; border: 1px solid var(--border-medium);
      transition: all .12s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    /* Boutons "Exporter" en style discret */
    button[onclick^="exporterTableau"] {
      background: transparent; color: #71717a; border-color: var(--border-soft);
      margin: 4px 0 14px; font-size: 11.5px; padding: 5px 10px;
    }
    button[onclick^="exporterTableau"]:hover { color: var(--primary); border-color: var(--primary); }
    .page-header button, a[href="index.html"] button {
      background: var(--bg-card); border: 1px solid var(--border-medium); color: var(--text-main);
    }
    #btn-summary-resi {
      background: var(--text-main) !important; color: #fff !important;
      border: none !important; font-weight: 500 !important; box-shadow: none !important;
    }
    #btn-summary-resi:hover { background: #000 !important; }

    /* ── Champs de recherche ─────────────────────────────────── */
    input[type="text"], input[type="date"] {
      font-family: inherit; border: 1px solid var(--border-medium); border-radius: 7px;
      padding: 7px 12px; font-size: 12px; outline: none; background: #fff; color: var(--text-main);
      transition: border-color .12s;
    }
    input[type="text"]:focus, input[type="date"]:focus { border-color: var(--accent); }

    /* ── KPI produits ────────────────────────────────────────── */
    .kpi {
      display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px;
      margin: 4px 8px 4px 0; padding: 8px 16px; border-radius: 8px;
      background: #fbfbfc; border: 1px solid var(--border-soft); cursor: pointer;
      min-width: 84px; font-size: 12.5px; font-weight: 600; color: var(--text-main);
    }

    #search {
      margin: 0; padding: 7px 12px; width: 260px;
    }

    /* ── Popups ──────────────────────────────────────────────── */
    .popup {
      display: none; position: fixed; top: 8%; left: 10%; width: 80%; height: 82%;
      background: white; border: 1px solid var(--border-soft); border-radius: 12px; overflow: auto; padding: 18px;
      box-shadow: 0 8px 32px rgba(16,24,40,.14); z-index: 1000;
    }
    .popup table { width: 100%; }
    .popup h3 { color: var(--text-main); margin-top: 0; font-size: 14px; font-weight: 600; }
    .close {
      float: right; cursor: pointer; font-size: 13px; font-weight: 400; color: #52525b;
      background: #f4f4f5; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .close:hover { background: #e4e4e7; }
    .popup thead th { color: #52525b !important; background: #f7f7f8 !important; }

    .badge-header {
      display:inline-flex; align-items:center; gap:6px;
      padding:7px 14px; border-radius:8px; cursor:pointer;
      font-size:12px; font-weight:500; color: var(--text-main);
      background: #fff; border: 1px solid var(--border-medium);
      transition: border-color .12s, background .12s;
      user-select:none;
    }
    .badge-header:hover { border-color: #c7c7cc; background: #fafafa; }
    .badge-header b, .badge-header strong { font-weight: 700; }
    .badge-mois    { border-left: 3px solid var(--info); }
    .badge-montant { border-left: 3px solid var(--danger); }
    .badge-qos     { border-left: 3px solid var(--warn); }
    .btn-periode {
      padding:6px 13px; border:1px solid var(--border-medium); border-radius:7px;
      background:white; color:#52525b; font-size:11.5px; font-weight:500;
      cursor:pointer; transition:all .12s;
    }
    .btn-periode:hover { border-color: var(--accent); color: var(--accent); }
    .btn-periode.active { background: var(--text-main); color:white; border-color: var(--text-main); }
    .sel-periode {
      padding:6px 9px; border:1px solid var(--border-medium); border-radius:7px;
      font-size:11.5px; font-weight:500; color:#3f3f46; background:white; cursor:pointer;
    }
  </style>
</head>

<script>
let dataGlobal = [];
let dataFiltre = [];

function excelDateToJSDate(serial) {
  const excelEpoch = new Date(1899, 11, 30);
  return new Date(excelEpoch.getTime() + serial * 86400000);
}

function formatDateFR(date) {
  if (!(date instanceof Date) || isNaN(date)) return "";
  let d = date.getDate().toString().padStart(2,'0');
  let m = (date.getMonth()+1).toString().padStart(2,'0');
  let y = date.getFullYear();
  return `${d}/${m}/${y}`;
}

function getDateFromCell(value) {
  if (value == null) return null;
  const num = Number(value);
  if (!isNaN(num) && num > 20000 && num < 80000) {
    return excelDateToJSDate(num);
  }
  if (Object.prototype.toString.call(value) === "[object Date]") {
    return value;
  }
  const str = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(str)) {
    const [d, m, y] = str.split("/").map(Number);
    return new Date(y, m - 1, d);
  }
  if (/^\d{2}\/\d{2}\/\d{2}$/.test(str)) {
    const [d, m, y] = str.split("/").map(Number);
    const fullYear = y < 50 ? 2000 + y : 1900 + y; 
    return new Date(fullYear, m - 1, d);
  }
  return null;
}

function formatDatesInRows(rows) {
  if (!rows || !rows.length) return rows;
  const dateKeys = Object.keys(rows[0]).filter(k => k.toLowerCase().includes("date"));
  if (!dateKeys.length) return rows;
  return rows.map(r => {
    const copy = {...r};
    dateKeys.forEach(k => {
      const dt = getDateFromCell(copy[k]);
      if (dt) copy[k] = formatDateFR(dt);
    });
    return copy;
  });
}

async function chargerExcel() {
  const response = await fetch("resi_final_.xlsx");
  const arrayBuffer = await response.arrayBuffer();
  const data = new Uint8Array(arrayBuffer);
  const workbook = XLSX.read(data, { type: "array" });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  dataGlobal = XLSX.utils.sheet_to_json(sheet);
  dataFiltre = dataGlobal;
  window._resiDataReady = true;

  mettreAJourAffichage();

  document.getElementById("search").addEventListener("keyup", function () {
    const valeur = this.value.toLowerCase();
    dataFiltre = dataGlobal.filter(row =>
      Object.values(row).some(v => String(v).toLowerCase().includes(valeur))
    );
    mettreAJourAffichage();
  });
}

// Fonction centrale de parsing du récurrent — robuste à l'encodage et au format
function parseRecurent(row) {
  // Détection dynamique de la clé (accent, espace, casse...)
  const key = Object.keys(row).find(k => k.replace(/\s/g,'').toLowerCase() === 'récurent'
    || k.replace(/\s/g,'').toLowerCase() === 'recurrent'
    || k.replace(/\s/g,'').toLowerCase() === 'r\u00e9curent');
  const val = key ? row[key] : null;
  if (val == null || val === '') return 0;
  // Si c'est déjà un nombre
  if (typeof val === 'number') return val;
  // Nettoyage string complet
  const s = String(val)
    .replace(/\u00a0/g, '')        // espace insécable
    .replace(/\s/g, '')            // tous espaces
    .replace(/FCFA/gi, '')         // suffixe FCFA
    .replace(/XOF/gi, '')          // suffixe XOF
    .replace(/\.(?=\d{3})/g, '')   // points séparateurs de milliers
    .replace(',', '.');             // virgule décimale → point
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// ── Gestion de la période (Jour / Semaine N° / Mois / Année, sélectionnables) ─
let periodeActuelle = 'mois';

// Calcul du n° de semaine ISO-8601 d'une date
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // lundi = 0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
}

// Renvoie le lundi de la semaine ISO n° `week` de l'année `year`
function getDateOfISOWeek(week, year) {
  const simple = new Date(year, 0, 1 + (week - 1) * 7);
  const dow = simple.getDay();
  const isoStart = new Date(simple);
  if (dow <= 4) isoStart.setDate(simple.getDate() - dow + 1);
  else isoStart.setDate(simple.getDate() + 8 - dow);
  return isoStart;
}

const _nowInit = new Date();
let periodeEtat = {
  annee: _nowInit.getFullYear(),
  mois: _nowInit.getMonth(),            // 0-11
  semaineNum: getISOWeek(_nowInit),
  semaineAnnee: _nowInit.getFullYear(),
  jour: new Date(_nowInit.getFullYear(), _nowInit.getMonth(), _nowInit.getDate())
};

function getPeriodeBounds(periode) {
  if (periode === 'jour') {
    const d = periodeEtat.jour;
    const debut = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const fin = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
    return { debut, fin };
  }
  if (periode === 'semaine') {
    const lundi = getDateOfISOWeek(periodeEtat.semaineNum, periodeEtat.semaineAnnee);
    const dimanche = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6, 23, 59, 59, 999);
    return { debut: lundi, fin: dimanche };
  }
  if (periode === 'mois') {
    const debut = new Date(periodeEtat.annee, periodeEtat.mois, 1);
    const fin = new Date(periodeEtat.annee, periodeEtat.mois + 1, 0, 23, 59, 59, 999);
    return { debut, fin };
  }
  // annee
  const debut = new Date(periodeEtat.annee, 0, 1);
  const fin = new Date(periodeEtat.annee, 11, 31, 23, 59, 59, 999);
  return { debut, fin };
}

function filtrerParPeriode(data, periode) {
  const { debut, fin } = getPeriodeBounds(periode);
  return data.filter(r => {
    const d = getDateFromCell(r["Date résiliation "] || r["Date résiliation"]);
    return d && d >= debut && d <= fin;
  });
}

function labelPeriode(periode) {
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  if (periode === 'jour') return "du " + formatDateFR(periodeEtat.jour);
  if (periode === 'semaine') return "de la semaine " + periodeEtat.semaineNum + " / " + periodeEtat.semaineAnnee;
  if (periode === 'mois') return "de " + moisNoms[periodeEtat.mois] + " " + periodeEtat.annee;
  return "en " + periodeEtat.annee;
}

// Années présentes dans les données (pour peupler les sélecteurs)
function getAnneesDisponibles() {
  const annees = new Set();
  (dataGlobal || []).forEach(r => {
    const d = getDateFromCell(r["Date résiliation "] || r["Date résiliation"]);
    if (d) annees.add(d.getFullYear());
  });
  annees.add(periodeEtat.annee);
  return [...annees].sort((a, b) => a - b);
}

// Construit les contrôles de sélection (select mois/année, semaine/année, date) selon le type actif
function renderPeriodeControls() {
  const cont = document.getElementById('periode-controls');
  if (!cont) return;
  const annees = getAnneesDisponibles();
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  let html = '';

  if (periodeActuelle === 'annee') {
    html = '<select id="sel-annee" class="sel-periode">' +
      annees.map(a => '<option value="' + a + '"' + (a === periodeEtat.annee ? ' selected' : '') + '>' + a + '</option>').join('') +
      '</select>';
  } else if (periodeActuelle === 'mois') {
    html = '<select id="sel-mois-mois" class="sel-periode">' +
      moisNoms.map((m, i) => '<option value="' + i + '"' + (i === periodeEtat.mois ? ' selected' : '') + '>' + m + '</option>').join('') +
      '</select>' +
      '<select id="sel-mois-annee" class="sel-periode">' +
      annees.map(a => '<option value="' + a + '"' + (a === periodeEtat.annee ? ' selected' : '') + '>' + a + '</option>').join('') +
      '</select>';
  } else if (periodeActuelle === 'semaine') {
    let opts = '';
    for (let w = 1; w <= 53; w++) {
      opts += '<option value="' + w + '"' + (w === periodeEtat.semaineNum ? ' selected' : '') + '>Semaine ' + w + '</option>';
    }
    html = '<select id="sel-semaine-num" class="sel-periode">' + opts + '</select>' +
      '<select id="sel-semaine-annee" class="sel-periode">' +
      annees.map(a => '<option value="' + a + '"' + (a === periodeEtat.semaineAnnee ? ' selected' : '') + '>' + a + '</option>').join('') +
      '</select>';
  } else if (periodeActuelle === 'jour') {
    const iso = periodeEtat.jour.getFullYear() + '-' + String(periodeEtat.jour.getMonth() + 1).padStart(2, '0') + '-' + String(periodeEtat.jour.getDate()).padStart(2, '0');
    html = '<input type="date" id="sel-jour" class="sel-periode" value="' + iso + '"/>';
  }

  cont.innerHTML = html;

  if (periodeActuelle === 'annee') {
    document.getElementById('sel-annee').onchange = function() { periodeEtat.annee = parseInt(this.value); mettreAJourPeriode(); };
  } else if (periodeActuelle === 'mois') {
    document.getElementById('sel-mois-mois').onchange = function() { periodeEtat.mois = parseInt(this.value); mettreAJourPeriode(); };
    document.getElementById('sel-mois-annee').onchange = function() { periodeEtat.annee = parseInt(this.value); mettreAJourPeriode(); };
  } else if (periodeActuelle === 'semaine') {
    document.getElementById('sel-semaine-num').onchange = function() { periodeEtat.semaineNum = parseInt(this.value); mettreAJourPeriode(); };
    document.getElementById('sel-semaine-annee').onchange = function() { periodeEtat.semaineAnnee = parseInt(this.value); mettreAJourPeriode(); };
  } else if (periodeActuelle === 'jour') {
    document.getElementById('sel-jour').onchange = function() {
      const [y, m, d] = this.value.split('-').map(Number);
      periodeEtat.jour = new Date(y, m - 1, d);
      mettreAJourPeriode();
    };
  }
}

// ── Badges header (Résiliés période sélectionnée / Montant > 1M / Motif QoS) ──
function afficherBadgesHeader(data) {
  const cont = document.getElementById("badges-header");
  if (!cont) return;
  if (!data || !data.length) {
    cont.innerHTML = '<div class="badge-header badge-mois">📅 Résiliés : 0</div>' +
      '<div class="badge-header badge-montant">💰 Résiliés &gt; 1 000 000 : 0</div>' +
      '<div class="badge-header badge-qos">🛠️ Motif QoS : 0</div>';
    window._badgeMoisCourant = []; window._badgeMontant1M = []; window._badgeQoS = [];
    return;
  }

  const dossiersMontant = data.filter(r => parseRecurent(r) > 1000000);
  const dossiersQoS = data.filter(r => String(r["Motif de résiliation"] || "").toUpperCase().includes("QOS"));
  const pctQoS = data.length ? (Math.round((dossiersQoS.length / data.length) * 1000) / 10) : 0;

  window._badgeMoisCourant = data;
  window._badgeMontant1M = dossiersMontant;
  window._badgeQoS = dossiersQoS;

  const label = labelPeriode(periodeActuelle);

  cont.innerHTML =
    '<div class="badge-header badge-mois" onclick="afficherPopupBadge(\'mois\')">📅 Résiliés ' + label + ' : ' + data.length + '</div>' +
    '<div class="badge-header badge-montant" onclick="afficherPopupBadge(\'montant\')">💰 Montant &gt; 1 000 000 : ' + dossiersMontant.length + '</div>' +
    '<div class="badge-header badge-qos" onclick="afficherPopupBadge(\'qos\')">🛠️ Motif QoS : ' + dossiersQoS.length +
      ' <span style="font-weight:400;opacity:.85;">(' + pctQoS + '% du total)</span></div>';
}

function afficherPopupBadge(type) {
  let rows, titre;
  if (type === 'mois') { rows = window._badgeMoisCourant || []; titre = "Résiliations " + labelPeriode(periodeActuelle); }

function afficherTableauMensuel(data) {
  let volumes = {};
  let recurents = {};
  let details = {};

  data.forEach(d => {
    let dateRes = getDateFromCell(d["Date résiliation"] || d["Date résiliation "]);
    if (!dateRes) return;
    const mois = dateRes.getMonth();
    const annee = dateRes.getFullYear();
    const cle = annee + "-" + mois;
    if (!volumes[cle]) { volumes[cle] = 0; recurents[cle] = 0; details[cle] = []; }
    volumes[cle]++;
    recurents[cle] += parseRecurent(d);
    details[cle].push(d);
  });

  const moisLabels = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin",
                      "Juil", "Août", "Sep", "Oct", "Nov", "Déc"];

  let annees = [...new Set(Object.keys(volumes).map(k => k.split("-")[0]))].sort();
  let html = "<table><thead><tr>"
    + "<th>Année</th><th>Total</th>"
    + moisLabels.map(m => "<th>" + m + "</th>").join("")
    + "</tr></thead><tbody>";

  annees.forEach(annee => {
    let totalAnnuel = 0;
    let totalRecAnnuel = 0;
    for (let m = 0; m < 12; m++) {
      const cle = annee + "-" + m;
      totalAnnuel   += volumes[cle]   || 0;
      totalRecAnnuel += recurents[cle] || 0;
    }

    // Ligne volumes
    html += "<tr><td><b>" + annee + "</b></td><td style='font-weight:bold'>" + totalAnnuel + "</td>";
    for (let m = 0; m < 12; m++) {
      const cle = annee + "-" + m;
      const val = volumes[cle] || 0;
      if (val > 0) {
        html += `<td style="cursor:pointer;color:blue;text-decoration:underline" onclick="afficherPopupClients('${annee}', ${m})">${val}</td>`;
      } else {
        html += "<td>0</td>";

    html += "</tr>";

    // Ligne récurrent (sous chaque année)
    html += "<tr style='background:#fff8f0;font-size:15px;font-weight:700;color:#c2440f;'>";
    html += "<td style='padding-left:10px;font-style:italic;white-space:nowrap;'>↳ Récurent (FCFA)</td>";
    html += "<td style='font-weight:bold;white-space:nowrap;text-align:right;'>"
      + Math.round(totalRecAnnuel).toLocaleString("fr-FR") + "</td>";
    for (let m = 0; m < 12; m++) {
      const cle = annee + "-" + m;

// Mots à supprimer pour normalisation (formes juridiques + mots génériques CI)
const STOP_WORDS = new Set([
  "SA","SAS","SARL","SNC","SUARL","SURL","GIE","ONG","ASSOCIATION","ASSOC",
  "CI","RCI","COTE","DIVOIRE","IVOIRE","INTERNATIONAL","INTER","LIMITED","LTD",
  "GROUP","GROUPE","HOLDING","SERVICES","SERVICE","SOLUTION","SOLUTIONS",
  "TECHNOLOGIES","TECHNOLOGIE","TECH","SYSTEMS","SYSTEM","SYSTEME",
  "ET","AND","DE","DU","LA","LE","LES","L","D","THE","OF",
  "BUREAU","AGENCE","CABINET","CENTRE","CENTER","DIRECTION",
  "ABIDJAN","COCODY","PLATEAU","MARCORY","TREICHVILLE","YOPOUGON"
]);

// Règles explicites : si le nom normalisé contient ce pattern → ce label
const REGLES_EXPLICITES = [
  [/ORANGE\s*BUSINESS/,          "ORANGE BUSINESS SERVICES"],
  [/STANDARD\s*CHARTERED/,       "STANDARD CHARTERED BANK"],
  [/ECOBANK/,                    "ECOBANK"],
  [/CFAO/,                       "CFAO"],
  [/AIR\s*(COTE|IVOIRE)/,        "AIR CÔTE D'IVOIRE"],
  [/MULTIMEDIA/,                 "CI-TELECOM / MULTIMEDIA"],
  [/CI.?TELECOM|CITELEC/,        "CI-TELECOM / MULTIMEDIA"],
  [/BRASSIVOIRE/,                "BRASSIVOIRE"],
  [/SUNU\s*ASSUR/,               "SUNU ASSURANCES"],
  [/VIPNET/,                     "VIPNET"],
  [/MUGEF|MUTUELLE\s*GEN/,       "MUGEF-CI"],
  [/CANAL\s*\+?|CANALSAT/,       "CANAL+"],
  [/UCP\s*SANT|UNITE.*COORD/,    "UCP SANTÉ BM"],
  [/SGBCI|SOCIETE\s*GEN/,        "SOCIÉTÉ GÉNÉRALE CI"],
  [/DIRECTION\s*GEN.*IMPOT|DGI\b/,        "DIRECTION GÉNÉRALE DES IMPÔTS (DGI)"],
  [/BNI\b|BANQUE\s*NAT.*INVEST/, "BNI"],
  [/NSIA\s*BANQUE/,              "NSIA BANQUE"],
  [/NSIA\s*ASSUR/,               "NSIA ASSURANCES"],
  [/BICICI/,                     "BICICI"],
  [/BOA\b|BANK.*AFRICA/,         "BANK OF AFRICA"],
  [/CORIS\s*BANK/,               "CORIS BANK"],
  [/UBA\b/,                      "UBA"],
  [/MANSA\s*MUSA|MANSAMUSA/,     "MANSA MUSA"],
  [/SIVOM|OFFICE.*VOIRIE/,       "SIVOM"],
  [/SOTRA\b/,                    "SOTRA"],
  [/CIE\b|COMPAGNIE.*ELECTR/,    "CIE"],
  [/SODECI/,                     "SODECI"],
  [/PETROCI/,                    "PETROCI"],
  [/SIR\b|RAFFINERIE/,           "SIR"],
  [/PALMCI/,                     "PALMCI"],
  [/NESTLE/,                     "NESTLÉ"],
  [/UNILEVER/,                   "UNILEVER"],
  [/TOTAL.*ENERG|TOTALENERG/,    "TOTALENERGIES"],
  [/SHELL/,                      "SHELL"],
  [/MTN\b/,                      "MTN"],
  [/MOOV/,                       "MOOV AFRICA"],
  [/WAVE\b/,                     "WAVE"],
  [/TRESOR.*PUBLIC|DIR.*TRESOR/, "TRÉSOR PUBLIC"],
  [/DGBF|DIR.*BUDGET/,           "DGBF"],
  [/CHU\b|CENTRE\s*HOSP.*UNIV/,  "CHU"],
  [/AMBASSADE.*ETATS|AMBASS.*USA/,"AMBASSADE USA"],
  [/AZUR|HOTEL\s*AZUR/,          "HÔTEL AZUR"],
  [/SOFITEL/,                    "SOFITEL"],
  [/PULLMAN/,                    "PULLMAN"],
  [/RADISSON/,                   "RADISSON"],
];

function normaliserBrut(nom) {
  if (!nom) return "";
  return nom.toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function cleRegroupement(nom) {
  if (!nom) return "INCONNU";
  const brut = normaliserBrut(nom);

  // 1. Règles explicites en priorité
  for (const [pattern, label] of REGLES_EXPLICITES) {
    if (pattern.test(brut)) return label;
  }

  // 2. Extraction des tokens significatifs (≥3 chars, pas stop word)
  const tokens = brut.split(" ").filter(t => t.length >= 3 && !STOP_WORDS.has(t));

  // 3. Clé = les 2 premiers tokens significatifs (ou 1 si un seul)
  if (tokens.length === 0) return brut || "INCONNU";
  return tokens.slice(0, 2).join(" ");
}

// Jaccard sur tokens pour valider si deux clés doivent fusionner
function jaccardTokens(a, b) {
  const ta = new Set(a.split(" ").filter(t => t.length >= 3));
  const tb = new Set(b.split(" ").filter(t => t.length >= 3));
  if (ta.size === 0 && tb.size === 0) return 1;
  let inter = 0;
  ta.forEach(t => { if (tb.has(t)) inter++; });
  const union = ta.size + tb.size - inter;
  return union > 0 ? inter / union : 0;
}

function trouverGroupeSimilaire(groupes, cle) {
  // Correspondance exacte
  if (groupes[cle]) return cle;
  // Jaccard ≥ 0.6 sur les tokens de la clé
  for (let g in groupes) {
    if (jaccardTokens(cle, g) >= 0.6) return g;
  }
  return null;
}

function afficherTableauResume(data) {
  if (!data.length) return;
  const groupes = {};

  data.forEach(row => {
    let cle = cleRegroupement(row["Clients"]);
    let existant = trouverGroupeSimilaire(groupes, cle);
    if (existant) cle = existant;

    if (!groupes[cle]) groupes[cle] = { volume: 0, recurent: 0, originaux: [], rows: [] };
    groupes[cle].volume++;
    groupes[cle].originaux.push(row["Clients"]);
    groupes[cle].rows.push(row);
    groupes[cle].recurent += parseRecurent(row);
  });

  let html = "<div class='tableau-scroll'><table><thead><tr>"
    + "<th>#</th><th>Client regroupé</th><th>Volume</th><th>Récurent (FCFA)</th>"
    + "</tr></thead><tbody>";
  let rank = 0;
  Object.entries(groupes)
    .sort((a, b) => b[1].volume - a[1].volume)
    .forEach(([groupe, info]) => {
      rank++;
      const rec = info.recurent > 0
        ? Math.round(info.recurent).toLocaleString("fr-FR") + " FCFA"
        : (info.recurent === 0 ? "0 FCFA" : "-");
      html += `<tr>
        <td>${rank}</td>
        <td style="text-align:left">${groupe}</td>
        <td style="cursor:pointer;color:blue;text-decoration:underline;font-weight:bold"
            onclick="afficherPopupClientsRegroupes('${groupe.replace(/'/g,"\\'")}')">
          ${info.volume}
        </td>
        <td style="color:#c2440f;font-weight:600">${rec}</td>
      </tr>`;
    });
  html += "</tbody></table></div>";

  document.getElementById("tableau-par-client").innerHTML = html;
  window.groupesResume = groupes;
  const titreClient = document.getElementById("titre-par-client");
  if (titreClient) {
    const nbClients = Object.keys(groupes).length;
    titreClient.innerText = "Résiliations par client " + labelPeriode(periodeActuelle) + " (" + nbClients + ")";
  }
}

  let html = `<h3>Résiliations pour le motif : ${motif}</h3>`;
  html += `<button onclick="exporterTableau('popupContent', 'Resiliations_${motif}.xlsx')">📤 Exporter ce tableau</button>`;
  html += "<div class='tableau-scroll'><table><thead><tr><th>Client</th><th>Produit</th><th>ND</th><th>Récurent</th><th>Date</th><th>Motif</th></tr></thead><tbody>";
  rows.forEach(r => {
    const recVal = parseRecurent(r);
    const rec = recVal > 0 ? Math.round(recVal).toLocaleString("fr-FR") + " FCFA" : "—";
    html += "<tr><td>"+(r["Clients"]||"")+"</td><td>"+(r["Produit"]||"")+"</td><td>"+(r["ND"]||"")+"</td><td style='text-align:right;'>"+rec+"</td><td>"+formatDateFR(getDateFromCell(r["Date résiliation"]||r["Date résiliation "]))+"</td><td>"+(r["Motif de résiliation"]||"")+"</td></tr>";
  });
  html += "</tbody></table></div>";
  document.getElementById("popupContent").innerHTML = html;
  document.getElementById("popup").style.display = "block";
}
</script>



<div id="popup-resi-summary" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:9999;justify-content:center;align-items:flex-start;overflow-y:auto;">
  <div style="background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.25);width:96%;max-width:1100px;margin:28px auto 40px;">
    <div style="background:#27272a;padding:10px 18px;border-radius:11px 11px 0 0;display:flex;align-items:center;justify-content:space-between;">
      <span style="color:white;font-size:13px;font-weight:600;">&#128203; Summary — Analyse des Résiliations</span>
      <div style="display:flex;gap:10px;align-items:center;">
        <span id="resi-sum-badge" style="background:white;color:#27272a;padding:4px 12px;border-radius:14px;font-weight:600;font-size:12px;">—</span>
        <button id="btn-close-sum" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);color:white;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;line-height:1;">&#10005;</button>
      </div>
    </div>
    <div id="resi-sum-body" style="padding:14px;background:#f5f3ff;border-radius:0 0 16px 16px;max-height:82vh;overflow-y:auto;"></div>
  </div>
</div>

<div id="popup-resi-detail" style="display:none;position:fixed;top:4%;left:50%;transform:translateX(-50%);width:88%;max-width:1000px;max-height:86vh;background:white;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.4);z-index:10000;flex-direction:column;overflow:hidden;">
  <div style="background:#27272a;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;">
    <span id="resi-det-title" style="color:white;font-weight:bold;font-size:14px;"></span>
    <button id="btn-close-det" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);color:white;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;line-height:1;">&#10005;</button>
  </div>
  <div id="resi-det-body" style="overflow:auto;flex:1;"></div>
</div>

<script>
window.addEventListener('load', function() {

  var popSum  = document.getElementById('popup-resi-summary');
  var popDet  = document.getElementById('popup-resi-detail');
  var sumBody = document.getElementById('resi-sum-body');
  var detBody = document.getElementById('resi-det-body');
  var detTitle= document.getElementById('resi-det-title');
  var badge   = document.getElementById('resi-sum-badge');

  document.getElementById('btn-summary-resi').addEventListener('click', function() {
    var data = (typeof dataFiltre !== 'undefined' && dataFiltre && dataFiltre.length) ? dataFiltre
             : (typeof dataGlobal !== 'undefined' && dataGlobal && dataGlobal.length) ? dataGlobal : null;
    if (!data || !data.length) { alert('Données non encore chargées. Patientez quelques secondes et réessayez.'); return; }
    buildSummary(data);
    popSum.style.display = 'flex';
  });

  document.getElementById('btn-close-sum').addEventListener('click', function() {
    popSum.style.display = 'none';
    popDet.style.display = 'none';
  });
  document.getElementById('btn-close-det').addEventListener('click', function() {
    popDet.style.display = 'none';
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { popSum.style.display='none'; popDet.style.display='none'; }
  });

  // ── Helpers ────────────────────────────────────────────────────
  function getDate(v) {
    if (!v) return null;
    if (v instanceof Date && !isNaN(v)) return v;
    if (typeof v === 'number') { var d=new Date(new Date(1899,11,30).getTime()+v*86400000); return isNaN(d)?null:d; }
    var m=String(v).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if(m) return new Date(+m[3],+m[2]-1,+m[1]);
    return null;
  }
  function fmt(n) { return Math.round(n).toLocaleString('fr-FR'); }
  var MN = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  var ML = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function mtnt(r) {
    var s=String(r['Récurent']||'0').replace(/\s/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.');
    return parseFloat(s)||0;
  }
  function normCl(s) {
    if(!s) return '';
    s=String(s).toUpperCase().trim();
    if(/MUGEF|MUTUELLE G/.test(s)) return 'MUGEF CI';
    if(/CANAL/.test(s)) return 'CANAL+';
    if(/UCP SANTE|UNITE DE COORD/.test(s)) return 'UCP SANTÉ BM';
    if(/STE DICK JOEL/.test(s)) return 'STE DICK JOEL';
    if(/AMBASSADE.*ETATS|AMBASSADE.*USA/.test(s)) return 'AMBASSADE USA';
    return s.length>38 ? s.slice(0,38)+'…' : s;
  }
  function el(tag, css, txt) {
    var e=document.createElement(tag);
    if(css) e.style.cssText=css;
    if(txt!==undefined) e.textContent=txt;
    return e;
  }
  function card(titre) {
    var w=el('div','background:white;border-radius:12px;box-shadow:0 2px 8px rgba(124,58,237,.09);padding:12px;margin-bottom:12px;');
    var h=el('h3','margin:0 0 12px;font-size:11px;color:#4c1d95;border-bottom:2px solid #ede9fe;padding-bottom:4px;font-weight:700;',titre);
    w.appendChild(h); return w;
  }
  function barRow(label, val, maxV, color, clickFn) {
    var pct=maxV>0?Math.round((val/maxV)*100):0;
    var d=el('div','display:flex;align-items:center;gap:10px;padding:5px 3px;cursor:pointer;border-radius:6px;');
    d.onmouseover=function(){this.style.background='#f5f3ff';};
    d.onmouseout =function(){this.style.background='';};
    if(clickFn) d.addEventListener('click',clickFn);
    var lbl=el('div','width:185px;font-size:11px;color:#374151;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;');
    lbl.title=label; lbl.textContent=label;
    var track=el('div','flex:1;background:#f3f4f6;border-radius:4px;height:11px;');
    var fill=el('div','width:'+pct+'%;background:'+color+';border-radius:4px;height:11px;');
    track.appendChild(fill);
    var num=el('div','width:42px;text-align:right;font-size:11px;font-weight:700;color:'+color+';',''+val);
    d.appendChild(lbl); d.appendChild(track); d.appendChild(num);
    return d;
  }
  function kpiTile(label, val, sub, color, clickFn) {
    var d=el('div','flex:1;min-width:100px;background:#faf5ff;border:2px solid #ede9fe;border-radius:11px;padding:8px;text-align:center;cursor:'+(clickFn?'pointer':'default')+';transition:border-color .15s;');
    d.onmouseover=function(){if(clickFn)this.style.borderColor=color;};
    d.onmouseout =function(){this.style.borderColor='#ede9fe';};
    if(clickFn) d.addEventListener('click',clickFn);
    d.appendChild(el('div','font-size:26px;font-weight:700;color:'+color+';',''+val));
    d.appendChild(el('div','font-size:9px;color:#6b7280;margin-top:2px;font-weight:600;',label));
    if(sub) d.appendChild(el('div','font-size:9px;color:#9ca3af;margin-top:1px;',sub));
    return d;
  }

  // ── Tableau détail ─────────────────────────────────────────────
  function showDetail(titre, rows) {
    if(!rows||!rows.length){alert('Aucune donnée.');return;}
    detTitle.innerHTML = '&#128269; '+titre+' <span style="font-size:11px;font-weight:400;">('+rows.length+' ligne'+(rows.length>1?'s':'')+')</span>';
    var cols=['Clients','Produit','ND','Récurent','Date résiliation ','Motif de résiliation','Type de résiliation'];
    var tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;font-size:11px;';
    var thead=document.createElement('thead');
    var hr=document.createElement('tr');
    hr.style.cssText='background:#3f3f46;color:white;position:sticky;top:0;';
    cols.forEach(function(col){
      var th=document.createElement('th');
      th.style.cssText='padding:6px 5px;text-align:left;white-space:nowrap;';
      th.textContent=col; hr.appendChild(th);
    });
    thead.appendChild(hr); tbl.appendChild(thead);
    var tbody=document.createElement('tbody');
    rows.forEach(function(r,i){
      var tr=document.createElement('tr');
      tr.style.background=i%2===0?'#fff':'#faf5ff';
      cols.forEach(function(col){
        var td=document.createElement('td');
        td.style.cssText='padding:5px 6px;border-bottom:1px solid #f3f4f6;';
        var v=r[col]!=null?r[col]:'';
        if(col.includes('Date')&&v){var dt=getDate(v);if(dt)v=dt.toLocaleDateString('fr-FR');}
        if(col==='Récurent'&&v){td.style.cssText+='text-align:right;font-weight:700;color:#4f46e5;';v=fmt(v)+' FCFA';}
        td.textContent=String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    detBody.innerHTML=''; detBody.appendChild(tbl);
    popDet.style.display='flex';
  }

  // ── Build Summary ──────────────────────────────────────────────
  function buildSummary(data) {
    badge.textContent = data.length+' résiliations';
    sumBody.innerHTML = '';

    var totRec=0, motifs={}, produits={}, typeResi={}, moisMap={}, clients={}, recParMotif={}, recurring={}, dataParMois={};

    data.forEach(function(r){
      var m=mtnt(r); totRec+=m;
      var motif=String(r['Motif de résiliation']||'(non renseigné)').trim()||'(non renseigné)';
      motifs[motif]=(motifs[motif]||0)+1; recParMotif[motif]=(recParMotif[motif]||0)+m;
      var prod=String(r['Produit']||'(vide)').trim();
      produits[prod]=(produits[prod]||0)+1;
      var tr2=String(r['Type de résiliation']||'(vide)').trim();
      typeResi[tr2]=(typeResi[tr2]||0)+1;
      var dt=getDate(r['Date résiliation ']||r['Date résiliation']);
      if(dt){var k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');moisMap[k]=(moisMap[k]||0)+1;if(!dataParMois[k])dataParMois[k]=[];dataParMois[k].push(r);}
      var cl=normCl(r['Clients']);
      if(cl){if(!clients[cl])clients[cl]={count:0,rec:0,rows:[]};clients[cl].count++;clients[cl].rec+=m;clients[cl].rows.push(r);}
      var clB=String(r['Clients']||'').trim();
      if(clB) recurring[clB]=(recurring[clB]||0)+1;
    });

    function sorted(obj){return Object.entries(obj).sort(function(a,b){return b[1]-a[1];});}

    // KPIs
    var cKpi=card('\uD83D\uDD22 Indicateurs clés');
    var kpiRow=el('div','display:flex;gap:10px;flex-wrap:wrap;');
    var mKeys=Object.keys(moisMap).sort();
    var mPic=mKeys.reduce(function(a,b){return (moisMap[a]||0)>(moisMap[b]||0)?a:b;},mKeys[0]||'');
    var tMot=sorted(motifs)[0]; var tProd=sorted(produits)[0];
    var multi=Object.values(recurring).filter(function(v){return v>1;}).length;
    [
      ['Total résiliations', data.length, '', '#4f46e5', function(){showDetail('Toutes les résiliations',data);}],
      ['Récurent perdu', fmt(totRec)+' FCFA', '', '#dc2626', null],
      ['Produit dominant', tProd?tProd[0]:'—', tProd?tProd[1]+' rés.':'', '#0284c7', tProd?function(){showDetail('Produit: '+tProd[0],data.filter(function(r){return (r['Produit']||'').trim()===tProd[0];}));}:null],
      ['Cause principale', tMot?tMot[0]:'—', tMot?tMot[1]+' cas':'', '#ea580c', tMot?function(){showDetail('Motif: '+tMot[0],data.filter(function(r){return (String(r['Motif de résiliation']||'').trim()||'(non renseigné)')===tMot[0];}));}:null],
      ['Mois pic', mPic?ML[+mPic.split('-')[1]-1]:'—', mPic?moisMap[mPic]+' rés.':'', '#4f46e5', mPic?function(){showDetail('Mois '+mPic,dataParMois[mPic]||[]);}:null],
      ['Multi-résiliations', multi, 'clients ≥2 fois', '#b45309', null]
    ].forEach(function(k){kpiRow.appendChild(kpiTile(k[0],k[1],k[2],k[3],k[4]));});
    cKpi.appendChild(kpiRow); sumBody.appendChild(cKpi);

    // Fréquence par mois
    var cMois=card('\uD83D\uDCC5 Fréquence par mois');
    var mBar=el('div','display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;');
    var maxM=Math.max.apply(null,Object.values(moisMap).concat([1]));
    Object.keys(moisMap).sort().forEach(function(k){
      var v=moisMap[k], h=Math.round((v/maxM)*80)+12;
      var isPic=k===mPic;
      var col=el('div','flex:1;min-width:55px;text-align:center;cursor:pointer;');
      col.title=ML[+k.split('-')[1]-1]+' '+k.split('-')[0]+': '+v+' rés.';
      col.addEventListener('click',(function(kk){return function(){showDetail('Résiliations '+kk,dataParMois[kk]||[]);};})(k));
      col.appendChild(el('div','font-size:10px;font-weight:700;color:#4c1d95;margin-bottom:2px;',''+v));
      var bar=el('div','height:'+h+'px;background:'+(isPic?'#4f46e5':'#c7d2fe')+';border-radius:6px 6px 0 0;transition:opacity .2s;');
      bar.onmouseover=function(){this.style.opacity='0.7';};
      bar.onmouseout=function(){this.style.opacity='1';};
      col.appendChild(bar);
      col.appendChild(el('div','font-size:9px;color:#6b7280;margin-top:2px;',MN[+k.split('-')[1]-1]+(isPic?' 🔺':'')));
      mBar.appendChild(col);
    });
    cMois.appendChild(mBar); sumBody.appendChild(cMois);

    // Grid 2 colonnes
    function grid2(a, b) {
      var g=el('div','display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;');
      g.appendChild(a); g.appendChild(b); sumBody.appendChild(g);
    }

    // Causes
    var cMotif=card('\uD83D\uDD0E Causes de résiliation');
    var sMotif=sorted(motifs); var maxMot=sMotif[0]?sMotif[0][1]:1;
    sMotif.forEach(function(e){cMotif.appendChild(barRow(e[0],e[1],maxMot,'#4f46e5',(function(mot){return function(){showDetail('Motif: '+mot,data.filter(function(r){return (String(r['Motif de résiliation']||'').trim()||'(non renseigné)')===mot;}));};})(e[0])));});

    // Produits
    var cProd=card('\uD83D\uDCE6 Par produit'); 
    var sProd=sorted(produits); var maxProd=sProd[0]?sProd[0][1]:1;
    sProd.forEach(function(e){cProd.appendChild(barRow(e[0],e[1],maxProd,'#0284c7',(function(p){return function(){showDetail('Produit: '+p,data.filter(function(r){return (r['Produit']||'').trim()===p;}));};})(e[0])));});
    grid2(cMotif, cProd);

    // Top clients
    var cCli=card('\uD83C\uDFE2 Top clients résiliés');
    var sCli=Object.entries(clients).sort(function(a,b){return b[1].rec-a[1].rec;}).slice(0,12);
    var maxCli=sCli.length?Math.max.apply(null,sCli.map(function(x){return x[1].count;})):1;
    sCli.forEach(function(e){
      var lbl=e[0]+' ('+e[1].count+' rés.) — '+fmt(e[1].rec)+' FCFA';
      cCli.appendChild(barRow(lbl,e[1].count,maxCli,'#dc2626',(function(rows,name){return function(){showDetail('Client: '+name,rows);};})(e[1].rows,e[0])));
    });

    // Récurent par cause
    var cRecM=card('\uD83D\uDCB8 Récurent perdu par cause');
    var sRecM=Object.entries(recParMotif).sort(function(a,b){return b[1]-a[1];});
    var maxRM=sRecM[0]?sRecM[0][1]:1;
    sRecM.forEach(function(e){
      var lbl=e[0]+' — '+fmt(e[1])+' FCFA';
      cRecM.appendChild(barRow(lbl,Math.round(e[1]/1000),Math.round(maxRM/1000),'#ea580c',(function(mot){return function(){showDetail('Motif: '+mot,data.filter(function(r){return (String(r['Motif de résiliation']||'').trim()||'(non renseigné)')===mot;}));};})(e[0])));
    });
    grid2(cCli, cRecM);

    // Multi-résiliations
    var multi2=Object.entries(recurring).filter(function(e){return e[1]>1;}).sort(function(a,b){return b[1]-a[1];});
    if(multi2.length){
      var cM=card('\u26A0\uFE0F Clients avec résiliations multiples');
      var g=el('div','display:flex;flex-wrap:wrap;gap:8px;');
      multi2.forEach(function(e){
        var b=el('span','background:#fef3c7;border:1px solid #fbbf24;color:#92400e;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;');
        b.textContent=(e[0].length>42?e[0].slice(0,42)+'…':e[0])+' ×'+e[1];
        b.title=e[0];
        b.addEventListener('click',(function(cl){return function(){showDetail('Client: '+cl,data.filter(function(r){return String(r['Clients']||'').trim()===cl;}));};})(e[0]));
        g.appendChild(b);
      });
      cM.appendChild(g); sumBody.appendChild(cM);
    }

    // Type résiliation
    var cType=card('\uD83D\uDCCB Type de résiliation');
    var tRow=el('div','display:flex;gap:10px;flex-wrap:wrap;');
    sorted(typeResi).forEach(function(e){
      var pct=Math.round((e[1]/data.length)*100);
      var t=el('div','flex:1;min-width:120px;background:#faf5ff;border:2px solid #ede9fe;border-radius:11px;padding:8px;text-align:center;cursor:pointer;');
      t.onmouseover=function(){this.style.borderColor='#4f46e5';};
      t.onmouseout=function(){this.style.borderColor='#ede9fe';};
      t.addEventListener('click',(function(tv){return function(){showDetail('Type: '+tv,data.filter(function(r){return String(r['Type de résiliation']||'').trim()===tv;}));};})(e[0]));
      t.appendChild(el('div','font-size:16px;font-weight:700;color:#4f46e5;',''+e[1]));
      t.appendChild(el('div','font-size:10px;color:#374151;margin-top:2px;font-weight:600;',e[0]||'(vide)'));
      t.appendChild(el('div','font-size:9px;color:#9ca3af;',pct+'% du total'));
      tRow.appendChild(t);
    });
    cType.appendChild(tRow); sumBody.appendChild(cType);
  }

}); // end window.load
</script>

</body>
</html>
